name: Telegram-Beitrag

# Stuendlich, nicht zu einer festen Uhrzeit.
#
# Grund: GitHub startet zeitgesteuerte Jobs teils mehrere Stunden zu spaet. Ein
# Job, der auf eine bestimmte Stunde prueft, geht dabei jedes Mal leer aus.
# Genau das ist hier anfangs passiert.
#
# 5 bis 21 Uhr UTC deckt Berlin von 6 bis 23 Uhr ab, im Sommer wie im Winter.
# Ob wirklich gesendet wird, entscheidet der Wochenplan im Skript: zwei bis drei
# Beitraege pro Woche, an zufaelligen Tagen zwischen 7 und 22 Uhr.
on:
  schedule:
    - cron: "0 5-21 * * *"
  workflow_dispatch:
    inputs:
      modus:
        description: "Was soll passieren?"
        type: choice
        default: trocken
        options:
          - trocken
          - senden

concurrency:
  group: telegram-tagestipp
  cancel-in-progress: false

jobs:
  tipp:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Beitrag senden
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          if [ "${{ inputs.modus }}" = "trocken" ]; then
            node telegram/skripte/posten.mjs --trocken
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node telegram/skripte/posten.mjs --jetzt
          else
            node telegram/skripte/posten.mjs
          fi

      - name: Stand zurueckschreiben
        run: |
          # git status statt git diff: funktioniert auch, wenn die Datei noch
          # gar nicht existiert, etwa beim ersten Lauf oder im Trockenlauf.
          if [ -z "$(git status --porcelain telegram/zustand.json)" ]; then
            echo "Nichts gesendet, nichts zu committen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram/zustand.json
          git commit -m "Telegram: Tagestipp gesendet"
          git push
