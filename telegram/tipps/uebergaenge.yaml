# Silo: Uebergaenge im Alltag

- id: uebergaenge-begleiten-01
  artikel: uebergaenge-begleiten
  titel: Drei Anforderungen auf einmal
  heikel: false
  text: |
    Morgens beim Losgehen. Beim Abholen vom Spielplatz. Beim Abschalten des
    Bildschirms. Abends beim Zubettgehen.

    Alle vier sind Übergänge, und das ist keine zufällige Häufung.

    Für ein kleines Kind sind das drei Anforderungen gleichzeitig. Etwas
    Angenehmes beenden, was eine Verlusterfahrung ist. Sich auf etwas
    Unbekanntes einstellen, auch wenn es hundertmal dasselbe war. Und einen
    Impuls bremsen, nämlich den, weiterzumachen.

    Ein Kind, das beim Verlassen des Spielplatzes zusammenbricht, ist nicht
    ungezogen. Es macht drei Dinge auf einmal, von denen es keines gut kann.

- id: uebergaenge-begleiten-02
  artikel: uebergaenge-begleiten
  titel: „Noch fünf Minuten“ ist keine Information
  heikel: false
  text: |
    Fünf Minuten sind für ein vierjähriges Kind keine Information.

    Kinder entwickeln erst im Grundschulalter ein einigermaßen verlässliches
    Gefühl für Zeitspannen. Vorher ist eine Minute genau so lang wie eine halbe
    Stunde: unbekannt.

    Damit wird die Ankündigung wirkungslos, und das Ende kommt trotzdem wie aus
    dem Nichts.

    Was stattdessen funktioniert, sind zählbare oder sichtbare Mengen. Nicht
    „noch fünf Minuten“, sondern „noch zweimal rutschen“.

- id: morgens-ohne-geschrei-01
  artikel: morgens-ohne-geschrei
  titel: Sieben Wechsel in vierzig Minuten
  heikel: false
  text: |
    Aufwachen, aufstehen, anziehen, essen, aufhören zu essen, Zähne putzen,
    Schuhe, losgehen.

    Jeder einzelne Wechsel kostet ein Kind Kraft. Dazu kommt, dass es nach dem
    Aufwachen oft zehn bis zwanzig Minuten braucht, bis es überhaupt ansprechbar
    ist. In dieser Phase Anweisungen zu geben ist ungefähr so wirksam, wie einen
    Schlafenden zu bitten, sich zu beeilen.

    Und drittens stehst du unter Zeitdruck. Das ist der entscheidende Faktor,
    weil er alle anderen verstärkt.

    Es ist gleichzeitig der einzige, den du wirklich in der Hand hast.

- id: morgens-ohne-geschrei-02
  artikel: morgens-ohne-geschrei
  titel: Fünf Entscheidungen gehören an den Vorabend
  heikel: false
  text: |
    Der wirksamste Teil des Morgens findet abends statt. Nicht als
    Ordnungsprinzip, sondern weil jede Entscheidung, die morgens noch offen ist,
    Zeit und Energie kostet.

    Kleidung, gemeinsam rausgelegt. Frühstück, festgelegt, wenige Optionen.
    Tasche, gepackt und an der Tür. Wer bringt, geklärt.

    Und der wichtigste, unbequemste Punkt: die Aufstehzeit, realistisch
    gerechnet.

    Wenn der Morgen regelmäßig zu knapp ist, ist er zu knapp geplant. Zwanzig
    Minuten mehr Puffer verändern ihn stärker als jede Methode.

- id: morgens-ohne-geschrei-03
  artikel: morgens-ohne-geschrei
  titel: Der Streit ums Anziehen ist oft ein Hungerstreit
  heikel: false
  text: |
    Ein Kind mit leerem Magen ist zu keiner Kooperation fähig.

    Deshalb: Essen vor allem anderen. Und davor eine Aufwachphase einplanen.
    Licht an, Rollo hoch, dann fünf Minuten Kontakt, ohne dass etwas passieren
    muss.

    Diese fünf Minuten holt man später doppelt wieder herein.

    Und ein ruhiger letzter Punkt vor der Tür, notfalls im Sitzen. Ein Kind, das
    gehetzt aus dem Haus geht, nimmt das mit in den Tag.

- id: morgens-ohne-geschrei-04
  artikel: morgens-ohne-geschrei
  titel: Warum Schnellerwerden das Gegenteil bewirkt
  heikel: false
  text: |
    Der Reflex ist, das Tempo zu erhöhen, wenn die Zeit knapp wird. Bei Kindern
    bewirkt das das Gegenteil: Hektik erhöht ihre Anspannung, und angespannte
    Kinder werden langsamer.

    Was ebenfalls nicht funktioniert: Belohnungssysteme, weil das Problem nicht
    am Wollen liegt. Ein müdes Kind wird durch einen Sticker nicht wacher.

    Und Drohungen mit dem Zuspätkommen. Für Erwachsene ist Zuspätkommen
    unangenehm, für ein vierjähriges Kind ist es ein Wort.

- id: kita-eingewoehnung-kind-weint-01
  artikel: kita-eingewoehnung-kind-weint
  titel: Zwei Dinge, die gleichzeitig wahr sind
  heikel: false
  text: |
    Dein Kind hat gerade wirklich Trennungsschmerz. Das ist kein Theater, keine
    Masche. Es ist ein echtes Gefühl, und es tut echt weh.

    Und es ist trotzdem richtig, dass du gehst.

    Beides gilt. Gleichzeitig. Genau das macht diesen Moment so anstrengend,
    denn unser Gefühl sagt uns: Wenn es weh tut, muss ich es beenden.

    Bei einem Kind, das sich den Kopf gestoßen hat, stimmt das auch. Hier nicht.

- id: kita-eingewoehnung-kind-weint-02
  artikel: kita-eingewoehnung-kind-weint
  titel: Der Wunsch ist unstillbar
  heikel: false
  text: |
    Das Bedürfnis dahinter ist Sicherheit. Der Wunsch lautet: Bleib hier.

    Viele Eltern versuchen, das Bedürfnis zu erfüllen, indem sie den Wunsch
    erfüllen. Also bleiben sie. Noch fünf Minuten, noch mal winken, noch mal
    zurückkommen.

    Bleibst du fünf Minuten, will dein Kind zehn. Kommst du zurück, fängt der
    Abschied von vorne an. Du erfüllst den Wunsch immer wieder und das Bedürfnis
    nie.

    Sicherheit entsteht nicht durch Dableiben. Sicherheit entsteht durch
    Vorhersehbarkeit.

- id: kita-eingewoehnung-kind-weint-03
  artikel: kita-eingewoehnung-kind-weint
  titel: Nicht ob es weint, sondern was danach passiert
  heikel: false
  text: |
    In der Eingewöhnung geht es um genau eine Frage. Nicht: Weint mein Kind?
    Sondern: Kann dieses Kind sich von jemand anderem trösten lassen?

    Weint beim Abschied und beruhigt sich nach wenigen Minuten: Das läuft gut,
    auch wenn es sich morgens schlimm anfühlt.

    Weint noch nach zwanzig Minuten, Tag für Tag: Gespräch mit der Einrichtung
    suchen.

    Und ein Fall wird oft übersehen. Ein Kind, das gar nicht weint, sondern
    erstarrt und teilnahmslos wirkt, braucht meist mehr Aufmerksamkeit als das,
    das laut protestiert.

- id: kita-eingewoehnung-kind-weint-04
  artikel: kita-eingewoehnung-kind-weint
  titel: Ein langer Abschied verlängert den Schmerz
  heikel: false
  text: |
    Er verkürzt ihn nicht. Jede zusätzliche Minute an der Tür ist eine weitere
    Minute, in der dein Kind zwischen zwei Welten hängt und nicht ankommen kann.

    Ein tragfähiger Abschied ist immer gleich, angekündigt und kurz. „Ich bringe
    dich zur Gruppe, dann gehe ich, und nach dem Mittagessen hole ich dich ab.“

    Dann das Gefühl: „Du bist traurig, dass ich gehe. Das verstehe ich.“

    Dann die Klarheit: „Und ich gehe jetzt.“

    Und dann gehen. Nicht noch einmal umdrehen, nicht zurückkommen, wenn es
    lauter wird. Das ist der schwerste Teil und der wichtigste.

- id: kita-eingewoehnung-kind-weint-05
  artikel: kita-eingewoehnung-kind-weint
  titel: Erst Beziehung, dann Trennung
  heikel: false
  text: |
    Das ist der gemeinsame Kern beider gängigen Eingewöhnungsmodelle, des
    Berliner und des Münchener.

    Erst begleitest du dein Kind in die Gruppe, ohne dass eine Trennung
    stattfindet. Dann kommt der erste kurze Trennungsversuch. Wie es weitergeht,
    hängt davon ab, ob dein Kind sich von der Fachkraft trösten ließ.

    Und beide sagen nicht, dass es nach exakt drei Wochen fertig sein muss.

    Ein Kind, das sechs Wochen braucht, ist nicht schwierig. Es ist ein Kind,
    das sechs Wochen braucht.

- id: erste-schulwochen-01
  artikel: erste-schulwochen
  titel: Vier Stunden Schule sind vier Stunden Selbstbeherrschung
  heikel: false
  text: |
    Stillsitzen, obwohl der Körper etwas anderes will. Warten, bis man dran ist.
    Leise sein, obwohl man etwas sagen möchte. Nicht weinen, wenn etwas
    schiefgeht.

    Jede dieser Anforderungen zieht an derselben Ressource, und die ist bei
    einem Erstklässler klein.

    Deshalb passiert Folgendes: Am Vormittag hält dein Kind sich zusammen, oft
    vorbildlich. Die Lehrkraft berichtet, dass alles gut läuft. Und um halb zwei
    explodiert es an der Wohnungstür wegen einer falschen Sorte Joghurt.

    Das ist kein Widerspruch, sondern die Rechnung.

- id: erste-schulwochen-02
  artikel: erste-schulwochen
  titel: Der Einbruch kommt in Woche zwei
  heikel: false
  text: |
    Fast jede Familie durchläuft dasselbe Muster.

    Erste Tage: Aufregung, Stolz, alles ist neu. Woche zwei bis drei: der
    Einbruch, Ablehnung, Tränen, Wut zu Hause. Woche vier bis sechs: Es setzt
    sich.

    Der Einbruch überrascht die meisten Eltern, weil die erste Woche gut lief.
    Er kommt genau dann, wenn die Aufregung nachlässt und die Anstrengung
    sichtbar wird. Das Neue ist nicht mehr spannend, aber auch noch nicht
    vertraut.

    Wer in dieser Phase das Konzept wechselt, verlängert sie. Wer sie aussitzt,
    kommt hindurch.

- id: erste-schulwochen-03
  artikel: erste-schulwochen
  titel: Der leere Nachmittag
  heikel: false
  text: |
    Die wirksamste Maßnahme und die unpopulärste, weil im September alle Kurse
    anfangen.

    Ein Erstklässler hat seinen Vorrat am Vormittag aufgebraucht. Was danach
    kommt, geht auf Reserve. Und wer die Reserve nachmittags verbraucht, hat
    abends nichts mehr.

    In den ersten sechs Wochen: möglichst kein Termin, höchstens einer pro
    Woche. Der Sportkurs läuft nicht weg.

    Was ein Kind stattdessen braucht, ist unstrukturierte Zeit. Das sieht nach
    Nichtstun aus und ist Erholung.

- id: erste-schulwochen-04
  artikel: erste-schulwochen
  titel: Hausaufgaben, ohne dass es täglich Streit gibt
  heikel: false
  text: |
    Anwesend sein, nicht kontrollieren. Ein Erstklässler braucht oft jemanden im
    Raum, um überhaupt anzufangen. Er braucht keine Korrektur nach jedem
    Buchstaben.

    Fehler stehen lassen. Sie gehören der Lehrkraft, nicht dir.

    Eine feste Zeit und ein festes Ende. Fünfzehn bis zwanzig Minuten sind in
    der ersten Klasse genug. Wenn es länger dauert, ist es zu viel, und das ist
    eine Information für die Lehrkraft.

    Und nicht direkt nach dem Nachhausekommen. Der Streit um die Hausaufgaben
    ist zu neunzig Prozent ein Blutzucker-Streit.

- id: erste-schulwochen-05
  artikel: erste-schulwochen
  titel: „Ich will da nicht mehr hin“
  heikel: false
  text: |
    Dieser Satz kommt bei sehr vielen Kindern in den ersten Wochen.

    Zuhören, ohne sofort zu beruhigen. Der Reflex ist, dagegenzuhalten: „Aber es
    ist doch schön dort.“ Damit ist das Gespräch beendet.

    Konkret nachfragen. Nicht „Warum nicht?“, sondern: Was war heute das
    Schwierigste? Wer war dabei? Wann genau?

    Meistens steckt etwas Kleines dahinter. Der Weg zur Toilette. Ein Kind, das
    drängelt. Der Lärm in der Pause.

    Kleine Dinge lassen sich lösen, große Sätze nicht.

- id: wenn-oma-anders-erzieht-01
  artikel: wenn-oma-anders-erzieht
  titel: Die Großelternversion von Urlaub
  heikel: false
  text: |
    Kinder unterscheiden schnell und zuverlässig, dass bei Oma andere Regeln
    gelten als zu Hause. Das überfordert sie nicht.

    Ein Vierjähriger weiß genau, dass es bei Oma Kekse gibt und dass er zu Hause
    danach nicht fragen muss.

    Was Kinder brauchen, ist Verlässlichkeit innerhalb einer Person, nicht
    Gleichheit zwischen Personen.

    Damit ist der allergrößte Teil der üblichen Konflikte erledigt: Süßigkeiten,
    Fernsehzeit, später ins Bett, mehr Spielzeug. Nichts davon richtet Schaden
    an.

- id: wenn-oma-anders-erzieht-02
  artikel: wenn-oma-anders-erzieht
  titel: Wo die Grenze wirklich verläuft
  heikel: true
  freigegeben: false
  text: |
    Drei Bereiche, und sie sind kurz.

    Sicherheit. Autositz, Straße, Herd, Medikamente, Schwimmen. Hier gibt es
    keinen Verhandlungsspielraum, und hier darf man deutlich werden.

    Der Umgang mit dem Kind. Keine körperliche Bestrafung, keine Beschämung,
    kein Auslachen. Auch nicht als Scherz, auch nicht als „so hat man das früher
    gemacht“.

    Und das Aufheben eurer Entscheidungen vor dem Kind. Sonst lernt es nicht,
    dass es zwei Meinungen gibt, sondern dass eure Entscheidungen nicht
    endgültig sind.

    Alles außerhalb dieser drei ist Verhandlungssache und meistens den Konflikt
    nicht wert.

- id: wenn-oma-anders-erzieht-03
  artikel: wenn-oma-anders-erzieht
  titel: Warum Großeltern empfindlich reagieren
  heikel: false
  text: |
    Wenn du heute sagst, dass etwas nicht gut für ein Kind ist, hört die andere
    Generation etwas mit, das du nicht gesagt hast: dass sie es bei ihren
    eigenen Kindern falsch gemacht hat.

    Und in vielen Fällen stimmt das sogar. Was heute selbstverständlich
    abgelehnt wird, war vor vierzig Jahren normal.

    Fast jede Erziehungsdebatte mit den eigenen Eltern ist deshalb gleichzeitig
    ein Gespräch über die eigene Kindheit. Das erklärt, warum die Reaktionen oft
    heftiger sind, als der Anlass es hergibt.

    Wer das weiß, kann es umgehen: indem er auf die pädagogische Begründung
    verzichtet und einfach sagt, was bei euch gilt.

- id: geschenke-und-konsum-01
  artikel: geschenke-und-konsum
  titel: Es ist nicht undankbar, es ist überfordert
  heikel: false
  text: |
    Ein Geschenk auszupacken ist für ein kleines Kind ein intensiver Vorgang.
    Spannung, Überraschung, ein neuer Gegenstand, der verstanden werden will.

    Wenn direkt danach das nächste Päckchen kommt, wird dieser Vorgang
    unterbrochen, bevor er abgeschlossen ist. Und beim dritten und vierten Mal
    ebenso.

    Was am Ende bleibt, ist keine Freude, sondern ein Zustand hoher Erregung
    ohne Ziel.

    Deshalb erzeugen weniger Päckchen mehr Freude, nicht weniger.

- id: geschenke-und-konsum-02
  artikel: geschenke-und-konsum
  titel: Vier Päckchen, und trotzdem ist alles dabei
  heikel: false
  text: |
    Es gibt keine wissenschaftlich richtige Zahl. Es gibt eine wiederkehrende
    Beobachtung: Bei etwa vier bis fünf Päckchen kippt es bei kleinen Kindern.

    Viele Familien arbeiten mit einer einfachen Aufteilung. Etwas, das man sich
    wünscht. Etwas zum Anziehen. Etwas zum Lesen. Etwas, das man braucht.

    Der Vorteil dieser Ordnung ist nicht die Sparsamkeit, sondern dass sie jedes
    Jahr gleich funktioniert und keine Diskussion mehr erzeugt.

    Und was oft mehr bringt als jede Zahl: nacheinander auspacken, mit Pausen
    dazwischen.

- id: geschenke-und-konsum-03
  artikel: geschenke-und-konsum
  titel: Das Gespräch mit den Großeltern
  heikel: false
  text: |
    Früh ansprechen, im Oktober, nicht Mitte Dezember. Wer im Dezember bittet,
    bittet, nachdem gekauft wurde.

    Konkret statt allgemein. „Schenkt bitte weniger“ ist eine Kritik und wird
    selten befolgt. „Wir würden uns über einen Beitrag zum Fahrrad freuen“ ist
    ein Vorschlag und wird meistens angenommen.

    Ohne pädagogische Begründung. Die Erklärung, warum zu viele Geschenke
    schaden, klingt für die schenkende Generation wie ein Vorwurf.

    Und mit einer Alternative, die dem Schenkenden etwas gibt. Wer gern schenkt,
    will Freude sehen. Ein gemeinsamer Ausflug liefert das besser als das fünfte
    Päckchen.

- id: geschenke-und-konsum-04
  artikel: geschenke-und-konsum
  titel: Der Wunschzettel braucht eine Regel
  heikel: false
  text: |
    Nicht alles davon kommt.

    Der Sinn eines Wunschzettels ist nicht die Bestellung, sondern das Wünschen
    selbst. Sich etwas vorstellen, sich freuen, warten.

    Wenn jedes Jahr alles vom Zettel eintrifft, verändert sich die Bedeutung.
    Aus Wünschen wird Erwarten, und aus dem Fest wird eine Lieferung.

    Praktisch: Der Zettel darf lang sein. Und es ist von vornherein klar, dass
    ein Teil davon kommt.

- id: familienregeln-jahreswechsel-01
  artikel: familienregeln-jahreswechsel
  titel: Der Reset besteht aus Streichen
  heikel: false
  text: |
    Der übliche Fehler zum Jahreswechsel lautet: neue Regeln aufstellen. Ein
    Plan, ein Plakat, gute Vorsätze.

    Nach zwei bis drei Wochen ist alles wie vorher, nur mit einem schlechten
    Gewissen mehr.

    Der Grund ist einfach: Die meisten Familien haben nicht zu wenige Regeln,
    sondern zu viele. Sie sind nur nicht aufgeschrieben, sondern gewachsen, über
    Jahre, oft ohne Entscheidung.

    Und ein neuer Satz Regeln kommt obendrauf, statt etwas zu ersetzen.

- id: familienregeln-jahreswechsel-02
  artikel: familienregeln-jahreswechsel
  titel: Vier Schritte zwischen den Jahren
  heikel: false
  text: |
    Sichtbar machen. Eine Woche lang notieren, wie oft du am Tag Nein sagst und
    worum es geht. Bei den meisten Familien kommen zwanzig bis dreißig Punkte
    zusammen.

    Sortieren. Sicherheit, Umgang miteinander, Rahmen des Tages: Das bleibt.

    Fragen, warum eigentlich. Bei sehr vielen Regeln lautet die ehrliche
    Antwort: Weil es bei mir früher so war.

    Streichen. Zwei bis vier Regeln, nicht mehr. Und ohne große Ankündigung.
    Eine gestrichene Regel muss nicht besprochen werden, sie hört einfach auf zu
    existieren.

- id: zeitumstellung-mit-kind-01
  artikel: zeitumstellung-mit-kind
  titel: Warum die geschenkte Stunde nicht ankommt
  heikel: false
  text: |
    Die innere Uhr richtet sich nicht nach der Wanduhr, sondern nach Licht und
    Rhythmus. Wann es hell wird, wann gegessen wird, wann etwas Bestimmtes
    passiert.

    Ein Erwachsener kann sich darüber hinwegsetzen, weil er weiß, dass jetzt
    eine andere Zahl gilt, und weil er länger liegen bleiben kann.

    Ein kleines Kind kann das nicht. Sein Körper wacht auf, wenn er wach ist.

    Deshalb wirkt die Herbstumstellung bei Kindern nicht als geschenkte Stunde,
    sondern als verlorene.

- id: zeitumstellung-mit-kind-02
  artikel: zeitumstellung-mit-kind
  titel: Vier Tage, vier Viertelstunden
  heikel: false
  text: |
    Ab vier Tage vor der Umstellung den ganzen Tagesablauf jeden Tag um 15
    Minuten verschieben. Am letzten Tag liegt er eine Stunde anders, und die
    Umstellung gleicht das aus.

    Entscheidend ist ein Punkt, der oft übersehen wird: nicht nur die
    Schlafenszeit verschieben, sondern den ganzen Tag. Auch Frühstück,
    Mittagsschlaf, Abendessen und den Beginn der Abendroutine.

    Die innere Uhr orientiert sich an all diesen Ankern. Wer nur das
    Zubettgehen verschiebt, bekommt ein müdes Kind, das trotzdem zur alten Zeit
    aufwacht.

- id: zeitumstellung-mit-kind-03
  artikel: zeitumstellung-mit-kind
  titel: Morgens hell, abends gedämpft
  heikel: false
  text: |
    Der zweite Hebel, und er ist unterschätzt.

    Sobald dein Kind aufsteht: Licht an, Rollo hoch, wenn möglich raus.
    Helligkeit am Morgen ist das stärkste Signal für die innere Uhr und
    verschiebt sie zuverlässiger als jede Uhrzeit.

    In der letzten Stunde vor dem Bett weniger Licht, warme Lampen statt
    Deckenlicht, keine Bildschirme.

    Zwanzig Minuten Tageslicht am Morgen wirken mehr als jede Verhaltensregel.

- id: zeitumstellung-mit-kind-04
  artikel: zeitumstellung-mit-kind
  titel: Wer um fünf eine interessante Zeit erlebt
  heikel: false
  text: |
    steht am nächsten Tag wieder um fünf auf.

    Deshalb: auf frühes Aufwachen ruhig und langweilig reagieren. Licht bleibt
    gedämpft, keine Spiele, kein Gespräch.

    Und bleib beim neuen Ablauf. Der häufigste Fehler ist, nach zwei
    schwierigen Tagen zur alten Zeit zurückzukehren. Damit wird die Umstellung
    nicht kürzer, sondern länger, weil das System kein klares Signal bekommt.

    Bei den meisten Kindern ist der Spuk nach zwei bis vier Tagen vorbei, bei
    manchen dauert es zwei Wochen. Beides ist normal.
