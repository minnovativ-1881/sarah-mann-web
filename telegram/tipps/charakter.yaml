# Silo: Was dein Kind stark macht

- id: richtig-loben-01
  artikel: richtig-loben
  titel: Zwei Sätze, gegensätzliche Wirkung
  heikel: false
  text: |
    „Du bist echt klug.“

    „Du hast lange daran gesessen und es dreimal anders probiert.“

    Sie klingen ähnlich freundlich und wirken gegensätzlich. Der erste macht ein
    Kind vorsichtiger, der zweite mutiger.

    Wer für eine Eigenschaft gelobt wird, bekommt einen Titel. Und wer einen
    Titel hat, kann ihn verlieren. Für ein Kind, das als klug gilt, ist eine
    schwierige Aufgabe damit ein Risiko.

    Die sichere Strategie liegt auf der Hand: eine leichtere Aufgabe wählen.

- id: richtig-loben-02
  artikel: richtig-loben
  titel: Der einfache Test vor dem Lob
  heikel: false
  text: |
    Prüfe einen einzigen Punkt: Kann mein Kind das, was ich gerade lobe, morgen
    wieder tun?

    Klug sein kann es nicht wiederholen. Es ist es, oder es ist es nicht.

    Drei Anläufe machen kann es wiederholen. Um Hilfe fragen kann es
    wiederholen. Nach dem Fehler weitermachen kann es wiederholen.

    Statt „Du bist gut in Mathe“ also: „Die Aufgabe war schwer, und du bist
    drangeblieben.“

    Das hat einen Nebeneffekt, der oft unterschätzt wird: Es zeigt deinem Kind,
    dass jemand genau hingesehen hat.

- id: richtig-loben-03
  artikel: richtig-loben
  titel: Wenn etwas misslungen ist
  heikel: false
  text: |
    Der Blick auf das Vorgehen zahlt sich vor allem dann aus, wenn etwas nicht
    klappt. Denn er funktioniert auch dann noch.

    Nicht: „Macht nichts, du bist trotzdem gut.“ Dein Kind weiß, dass es nicht
    geklappt hat, und hört, dass darüber nicht gesprochen wird.

    Sondern: „Was hast du probiert?“ Und danach: „Was würdest du beim nächsten
    Mal anders machen?“

    Damit bleibt der Fehler ein Arbeitsgegenstand statt eines Urteils. Genau das
    ist der Unterschied zwischen einem Kind, das Fehler versteckt, und einem,
    das sie erzählt.

- id: richtig-loben-04
  artikel: richtig-loben
  titel: Dauerlob ist Dauerbewertung
  heikel: false
  text: |
    Es gibt eine zweite Falle, und sie hat nichts mit der Formulierung zu tun:
    Lob, das ständig kommt.

    Ein Kind, das für jede Kleinigkeit gefeiert wird, lernt zwei Dinge. Erstens,
    dass Lob nichts bedeutet, weil es immer kommt. Zweitens, dass ständig jemand
    bewertet.

    Der zweite Punkt wiegt schwerer. Ein Kind unter Dauerbewertung wird nicht
    sicherer, sondern aufmerksamer darauf, wie es gerade ankommt.

    Vieles gelingt am besten unkommentiert.

- id: selbstwert-staerken-kind-01
  artikel: selbstwert-staerken-kind
  titel: Selbstwert entsteht nicht durch Lob
  heikel: false
  text: |
    Er entsteht aus zwei Erfahrungen, und beide macht ein Kind selbst.

    Zugehörigkeit beantwortet die Frage: Gehöre ich dazu, auch wenn ich gerade
    nichts kann und nichts leiste?

    Wirksamkeit beantwortet die Frage: Kann ich etwas bewirken? Ich habe mir
    etwas vorgenommen, ich habe es probiert, und es hat geklappt.

    Fehlt die Zugehörigkeit, entsteht ein Kind, das leistet, um dazuzugehören.
    Fehlt die Wirksamkeit, entsteht ein Kind, das geliebt wird und sich trotzdem
    für unfähig hält.

    Auffällig ist, was in dieser Aufzählung nicht vorkommt: die Meinung anderer
    Leute.

- id: selbstwert-staerken-kind-02
  artikel: selbstwert-staerken-kind
  titel: Warum Lob die falsche Baustelle ist
  heikel: false
  text: |
    Lob ist eine Rückmeldung von außen. Es fühlt sich gut an und hat einen
    eingebauten Haken: Es macht den Wert von jemandem abhängig, der zuschaut.

    Ein Kind, dessen Selbstbild an Lob hängt, braucht Publikum. Es fragt nach
    jedem Bild, ob es schön ist. Es hört auf zu malen, wenn niemand hinsieht.

    Und es gerät in Schwierigkeiten, sobald es an eine Stelle kommt, an der es
    nicht das Beste ist.

    Das ist kein Argument gegen freundliche Worte. Es ist ein Argument dafür,
    sie nicht mit dem Fundament zu verwechseln.

- id: selbstwert-staerken-kind-03
  artikel: selbstwert-staerken-kind
  titel: Vier Minuten oder ein sauberer Tisch
  heikel: false
  text: |
    Wirksamkeit lässt sich nicht erzählen. Ein Kind muss etwas getan haben,
    damit es weiß, dass es etwas tun kann.

    Das kostet im Alltag genau das, was am knappsten ist. Ein Vierjähriger, der
    sein Brot selbst schmiert, braucht vier Minuten und hinterlässt Butter auf
    dem Tisch. Ein Erwachsener braucht dreißig Sekunden.

    Wer diese vier Minuten dreihundertmal im Jahr aufbringt, hat am Ende ein
    Kind mit dreihundert Erfahrungen. Wer sie einspart, hat einen sauberen
    Tisch.

    Es reicht, an einer Stelle pro Tag nicht einzugreifen.

- id: selbstwert-staerken-kind-04
  artikel: selbstwert-staerken-kind
  titel: Zwei Aussagen, die beide stimmen
  heikel: false
  text: |
    Kinder prüfen die Zugehörigkeit besonders dann, wenn sie es schwer machen.
    Nach dem Wutanfall, nach der Lüge, nach dem Streit.

    Genau dort entscheidet sich, ob Zugehörigkeit an Bedingungen hängt.

    „Das war nicht in Ordnung. Und du gehörst trotzdem hierher.“

    Kein Widerspruch, sondern zwei Aussagen, die beide stimmen. Das Verhalten
    wird beurteilt, die Zugehörigkeit nicht.

- id: selbstwert-staerken-kind-05
  artikel: selbstwert-staerken-kind
  titel: Beschreibungen sind schwerer wegzuwischen als Komplimente
  heikel: false
  text: |
    Manche Kinder sagen von sich, dass sie dumm sind, dass sie nichts können.
    Der Reflex ist, es zu widerlegen.

    Das funktioniert selten, weil eine Überzeugung nicht durch eine
    Gegenbehauptung verschwindet.

    Was wirkt, ist mühsamer und verlässlicher: Gelegenheiten schaffen, in denen
    dein Kind etwas tatsächlich schafft, und hinterher genau benennen, was es
    getan hat.

    „Du hast das Regal allein zusammengebaut. Zweimal ist die Schraube
    runtergefallen, und du hast weitergemacht.“

    Das ist kein Lob. Das ist eine Beschreibung.

- id: resilienz-kind-01
  artikel: resilienz-kind
  titel: Der stärkste Schutzfaktor ist ein Mensch
  heikel: false
  text: |
    Die Resilienzforschung begann mit einer Frage, die niemand erwartet hatte:
    Warum entwickelt sich ein Teil der Kinder unter schwierigsten Bedingungen
    gut?

    Die Antwort war nicht Härte, nicht Talent und nicht Optimismus. Der Faktor,
    der über Jahrzehnte immer wieder auftaucht, ist unspektakulär: mindestens
    eine stabile, verlässliche Beziehung zu einem Erwachsenen.

    Nicht zu allen. Zu einem. Und es muss nicht die Mutter sein. Es kann der
    Vater sein, eine Großmutter, eine Erzieherin, ein Trainer.

    Das ist die vielleicht ermutigendste Erkenntnis der Entwicklungspsychologie,
    weil sie nicht an Geld, Bildung oder Wohnort hängt.

- id: resilienz-kind-02
  artikel: resilienz-kind
  titel: Das Missverständnis mit der Härte
  heikel: false
  text: |
    „Was uns nicht umbringt, macht uns stärker.“ Für Kinder stimmt das in dieser
    Form nicht.

    Belastung stärkt unter einer Bedingung: Sie muss bewältigbar sein und
    begleitet werden.

    Ein Kind, das eine schwierige Sache mit jemandem an der Seite durchsteht,
    kommt gestärkt heraus. Ein Kind, das dieselbe Sache allein durchsteht, kommt
    erschöpft heraus und mit der Überzeugung, dass niemand kommt.

    Der Unterschied liegt nicht in der Schwierigkeit. Er liegt in der
    Begleitung.

- id: resilienz-kind-03
  artikel: resilienz-kind
  titel: Ein zweiter Ort
  heikel: false
  text: |
    Ein Schutzfaktor wird selten genannt und wirkt stark: ein Ort außerhalb der
    Familie, an dem ein Kind dazugehört. Verein, Chor, Gruppe.

    Ein Kind, das nur einen Bereich hat, in dem es zählt, verliert bei einem
    Problem dort alles.

    Ein Kind mit zwei Bereichen hat immer noch einen.

- id: resilienz-kind-04
  artikel: resilienz-kind
  titel: „Das war heute richtig blöd“
  heikel: false
  text: |
    Dieser Satz ist besser als „Das wird schon wieder“.

    Der erste macht Platz, der zweite macht zu.

    Und noch zwei Dinge, die keine Umstellung des Familienlebens verlangen. Eine
    Zeit am Tag, in der du erreichbar bist, nicht länger als zehn Minuten, aber
    verlässlich. Für viele Kinder ist das die Zeit nach dem Zubettgehen, weil
    dann erst erzählt wird, was tagsüber war.

    Und eine Aufgabe, die tatsächlich gebraucht wird. Nicht zum Üben, sondern
    weil sie sonst niemand macht. Der Unterschied ist für Kinder deutlich
    spürbar.

- id: resilienz-kind-05
  artikel: resilienz-kind
  titel: Wenn ein Kind alles wegsteckt
  heikel: false
  text: |
    In vielen Familien gibt es eines, von dem alle sagen, es stecke alles weg.
    Es beschwert sich nicht, es funktioniert, es macht keine Umstände.

    Manchmal ist das Temperament. Manchmal ist es etwas anderes: ein Kind, das
    gelernt hat, dass Belastung zeigen nichts bringt.

    Der Unterschied lässt sich an einer Frage erkennen. Erzählt dieses Kind auch
    von Dingen, die schiefgehen? Wenn immer nur Gutes kommt, lohnt es sich,
    genauer hinzuschauen.

    Resilienz heißt nicht, dass ein Kind nichts spürt. Sie heißt, dass es sich
    erholt, und Erholung braucht jemanden, dem man erzählt hat, was los war.

- id: mut-bei-kindern-01
  artikel: mut-bei-kindern
  titel: Mut ist nicht Angstlosigkeit
  heikel: false
  text: |
    Ein mutiges Kind hat genau so viel Angst wie ein vorsichtiges. Es geht nur
    trotzdem hin.

    Wer glaubt, Mut heiße keine Angst, versucht zuerst, die Angst wegzureden.
    „Da ist nichts.“ „Das tut nicht weh.“ „Die anderen machen das doch auch.“

    Für das Kind bedeutet jeder dieser Sätze dasselbe: Was ich fühle, ist
    falsch. Und jetzt hat es zwei Probleme. Das erste ist die Rutsche. Das
    zweite ist, dass es sich für das erste schämt.

    „Du hast Angst vor der Rutsche. Ich bleib unten stehen. Willst du erst mal
    nur die Leiter?“

- id: mut-bei-kindern-02
  artikel: mut-bei-kindern
  titel: Die zehn Minuten am Rand
  heikel: false
  text: |
    Etwa jedes fünfte Kind kommt mit einem vorsichtigen Temperament zur Welt. Es
    reagiert stärker auf Neues, beobachtet länger, geht später hinein.

    Das ist keine Erziehungsfrage und kein Defizit. Diese Kinder schätzen
    Risiken realistischer ein und machen seltener Dinge, die man hinterher
    bereut.

    Was sie brauchen, ist kein Schubs, sondern Zeit am Rand. Ein Kind, das zehn
    Minuten zusieht, ist nicht untätig. Es sammelt Informationen, und wenn es
    genug hat, geht es los.

    Der häufigste Fehler ist, diese zehn Minuten zu unterbrechen.

- id: kind-gibt-schnell-auf-01
  artikel: kind-gibt-schnell-auf
  titel: Der Blick, der alles verrät
  heikel: false
  text: |
    Es gibt eine Beobachtung, die im Alltag mehr klärt als jede Analyse: Schaut
    dein Kind dich an, bevor es aufhört?

    Wenn ja, ist das Aufgeben eine Ansage an dich und keine Entscheidung über
    die Aufgabe. Es hat gelernt, dass an dieser Stelle jemand kommt.

    Das ist niemandem vorzuwerfen, denn es entsteht aus lauter freundlichen
    Momenten. Nur sammelt dein Kind dabei keine Erfahrung darüber, was passiert,
    wenn es weitermacht.

    Der Ausweg ist nicht, wegzugehen. Der Ausweg ist, dazubleiben und die Hände
    unten zu lassen.

- id: kind-gibt-schnell-auf-02
  artikel: kind-gibt-schnell-auf
  titel: Vier Sätze, die dabeibleiben, ohne zu übernehmen
  heikel: false
  text: |
    „Hm. Das ist knifflig.“ Damit ist anerkannt, dass es schwer ist, und sonst
    nichts.

    „Welcher Teil geht noch?“ Damit schrumpft die Aufgabe auf eine bearbeitbare
    Größe.

    „Willst du, dass ich zuschaue?“ Für viele Kinder reicht Anwesenheit
    vollständig aus.

    „Was hast du schon probiert?“ Damit wird aus dem Scheitern eine Aufzählung
    von Versuchen, und Versuche kann man fortsetzen.

    Alle vier haben dasselbe gemeinsam: Die Aufgabe bleibt beim Kind.

- id: kind-gibt-schnell-auf-03
  artikel: kind-gibt-schnell-auf
  titel: Um 17 Uhr ist es kein Charakterproblem
  heikel: false
  text: |
    Durchhalten hängt an derselben Ressource wie alle Selbstbeherrschung, und
    die ist bei Müdigkeit, Hunger oder nach einem langen Kita-Tag aufgebraucht.

    Ein Kind, das um 17 Uhr sofort aufgibt und samstags um 10 Uhr eine Stunde
    tüftelt, hat kein Charakterproblem. Es hat einen Tagesverlauf.

    Deshalb wirkt „Streng dich einfach mal an“ nicht. Anstrengung ist kein
    Schalter, und der Satz behauptet, die Ursache liege im Willen.

    Bei einem leeren Kind ist er sogar schädlich, weil er eine Erschöpfung als
    Charakterfehler auslegt.

- id: kind-gibt-schnell-auf-04
  artikel: kind-gibt-schnell-auf
  titel: Wenn das Können selbst das Problem ist
  heikel: false
  text: |
    Manche Kinder geben besonders schnell in genau den Bereichen auf, in denen
    sie sonst gut sind.

    Das klingt widersinnig und ist logisch: Wer als klug, sportlich oder
    musikalisch gilt, hat bei jeder schweren Aufgabe etwas zu verlieren. Nicht
    anzufangen ist die Strategie, die den Titel sichert.

    Der Ausweg führt über die Sprache im Alltag. Wer zu Hause über Anläufe,
    Umwege und Fehler spricht wie über etwas Normales, auch über die eigenen,
    senkt den Einsatz.

    Und ein Kind, für das Fehler zum Ablauf gehören, riskiert wieder etwas.

- id: kind-vergleicht-sich-01
  artikel: kind-vergleicht-sich
  titel: Warum Widersprechen nicht hilft
  heikel: false
  text: |
    „Das stimmt doch gar nicht.“ „Du bist auch gut.“ „Dafür kannst du super
    malen.“

    Alle drei Sätze haben denselben Effekt: Dein Kind hört, dass sein Eindruck
    nicht ernst genommen wird. Und der dritte ist ein Themenwechsel, den auch
    ein Sechsjähriger sofort erkennt.

    Was stattdessen trägt, ist zuerst ein Satz, der stehen lässt, was ist.

    „Ja, der Lukas liest schneller als du. Und das fühlt sich blöd an.“

    Damit muss dein Kind seine Wahrnehmung nicht mehr gegen dich verteidigen.

- id: kind-vergleicht-sich-02
  artikel: kind-vergleicht-sich
  titel: Der zweite Maßstab
  heikel: false
  text: |
    Nicht: Wer ist der Beste in der Klasse? Sondern: Wie war es bei dir vor drei
    Monaten?

    Der zweite Maßstab schafft den ersten nicht ab. Er nimmt ihm die
    Alleinstellung. Und ein Kind mit zwei Maßstäben ist nicht mehr davon
    abhängig, wie die anderen abschneiden.

    Damit das funktioniert, muss der Verlauf sichtbar sein. Ein altes Bild neben
    ein neues legen. Ein Heft von vor einem Jahr aufschlagen.

    Kinder erinnern sich schlecht an ihr eigenes Vorher. Deshalb muss man es
    aufbewahren.

- id: kind-vergleicht-sich-03
  artikel: kind-vergleicht-sich
  titel: Wo Erwachsene das Vergleichen selbst einbauen
  heikel: false
  text: |
    Der offensichtliche Fall sind Sätze wie „Schau mal, deine Schwester schafft
    das doch auch.“

    Der weniger offensichtliche ist Lob für ein Kind, das ein anderes mithört.
    „Du hast aber schön aufgeräumt“ ist für das Geschwisterkind im Nebenzimmer
    eine Positionsmeldung.

    Und der am wenigsten offensichtliche sind Erwachsene, die sich selbst laut
    vergleichen. Kinder hören genau zu, wenn Eltern über andere Familien, andere
    Kinder oder ihre eigene Arbeit sprechen.

- id: dankbarkeit-lernen-01
  artikel: dankbarkeit-lernen
  titel: Danke sagen und dankbar sein
  heikel: false
  text: |
    Das Wort danke ist eine Umgangsform. Man lernt sie wie Grüßen, sie
    funktioniert ab etwa zwei Jahren, und sie ist nützlich.

    Dankbarkeit ist ein Gefühl, und es setzt drei Erkenntnisse voraus. Jemand
    hat etwas gegeben. Er hätte es auch lassen können. Und es hat ihn etwas
    gekostet.

    Alle drei zusammen entwickeln sich meist zwischen fünf und sieben Jahren.

    Ein Vierjähriger, der ein Geschenk hinlegt, ist nicht undankbar. Ihm fehlt
    die zweite und dritte Erkenntnis.

- id: dankbarkeit-lernen-02
  artikel: dankbarkeit-lernen
  titel: Sichtbar machen, wer dahintersteckt
  heikel: false
  text: |
    Ein Danke auf Kommando bringt drei Dinge hervor: eine Formel, eine kurze
    Peinlichkeit und die Erleichterung der Erwachsenen.

    Was es nicht hervorbringt, ist der Gedanke, dass sich jemand etwas überlegt
    hat.

    Deshalb wirkt etwas anderes besser: Erwachsene, die selbst laut aussprechen,
    was sie bemerken. „Oma hat den Kuchen gebacken, das hat den ganzen Vormittag
    gedauert.“

    Dieses Sichtbarwerden ist der Rohstoff, aus dem Dankbarkeit entsteht.

- id: dankbarkeit-lernen-03
  artikel: dankbarkeit-lernen
  titel: Der Geschenkeberg
  heikel: false
  text: |
    Es gibt eine Situation, in der fast alle Kinder undankbar wirken, und sie
    ist von Erwachsenen hergestellt: viele Geschenke gleichzeitig.

    Wer sechs Päckchen vor sich hat, bewertet jedes im Vergleich zu den anderen.
    Menge senkt den Wert des Einzelnen.

    Was hilft, ist einfach umzusetzen. Geschenke nacheinander öffnen, mit Pause
    dazwischen. Nicht alle am selben Tag. Und laut sagen, von wem etwas ist,
    bevor das Papier ab ist.

    Das kostet nichts und ändert die Szene deutlich.

- id: dankbarkeit-lernen-04
  artikel: dankbarkeit-lernen
  titel: Ohne Wartezeit kein Wert
  heikel: false
  text: |
    Das ist der unangenehmste und wirksamste Punkt zum Thema.

    Ohne Wartezeit gibt es keinen Moment, in dem etwas als wertvoll erlebt wird.

    Ein Kind, das drei Monate auf ein Fahrrad gewartet hat, erlebt beim
    Auspacken etwas völlig anderes als eines, dem der Wunsch am nächsten Tag
    erfüllt wurde.

- id: ehrlichkeit-kind-luegt-01
  artikel: ehrlichkeit-kind-luegt
  titel: Die erste Lüge ist ein Entwicklungsschritt
  heikel: false
  text: |
    Lügen ist anspruchsvoller, als es aussieht. Ein Kind muss dafür drei Dinge
    gleichzeitig leisten.

    Es muss wissen, was passiert ist. Es muss verstehen, dass du es nicht weißt.
    Und es muss begreifen, dass sich dein Kopfinhalt von seinem unterscheidet
    und beeinflussen lässt.

    Diese Fähigkeit entwickelt sich typischerweise zwischen drei und vier
    Jahren. Die erste Lüge fällt genau in dieses Fenster.

    Das macht sie nicht wünschenswert. Es nimmt ihr nur das Dramatische.

- id: ehrlichkeit-kind-luegt-02
  artikel: ehrlichkeit-kind-luegt
  titel: Die Frage, die Lügen produziert
  heikel: false
  text: |
    „Hast du das gemacht?“

    Diese Frage stellt man fast immer dann, wenn man die Antwort schon kennt.
    Aus Sicht des Kindes ist sie keine Frage, sondern eine Öffnung.

    Es steht vor einer Wahl: zugeben und die Folge tragen, oder es versuchen.

    Wer die Antwort kennt, sollte deshalb nicht fragen, sondern feststellen.
    „Der Becher ist umgefallen. Hol den Lappen, wir machen das zusammen weg.“

    Damit gibt es nichts zu entscheiden.

- id: ehrlichkeit-kind-luegt-03
  artikel: ehrlichkeit-kind-luegt
  titel: Warum Strenge das Gegenteil bewirkt
  heikel: true
  freigegeben: false
  text: |
    Je härter die Folge der Wahrheit, desto größer der Gewinn einer gelungenen
    Lüge.

    Kinder in strengen Umgebungen lügen nicht seltener. Sie lügen besser: früher,
    glatter und mit weniger Anzeichen.

    Und ein Punkt wiegt langfristig am schwersten: Ein Kind, das als Lügner
    bezeichnet wird, bekommt eine Rolle. Rollen werden ausgefüllt.

    Benenne deshalb die Handlung, nicht das Kind.

- id: ehrlichkeit-kind-luegt-04
  artikel: ehrlichkeit-kind-luegt
  titel: Wer es selbst sagt, hat es leichter
  heikel: false
  text: |
    Diese Regel verändert in vielen Familien mehr als jede Ermahnung. Sie muss
    ausgesprochen und dann eingehalten werden.

    Ein Kind, das von sich aus erzählt, dass die Vase kaputt ist, hilft beim
    Aufräumen. Ein Kind, das erwischt wird, hilft ebenfalls, und es gibt
    zusätzlich ein Gespräch darüber, warum die Lüge das Schlimmere war.

    Der Unterschied darf klein sein. Er muss nur verlässlich sein.

    Kinder rechnen sehr genau nach.
