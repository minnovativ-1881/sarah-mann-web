# Silo: Reizüberflutung

- id: kind-staendig-ueberdreht-01
  artikel: kind-staendig-ueberdreht
  titel: Überdreht heißt nicht zu viel Energie
  heikel: false
  text: |
    Es heißt zu wenig Bremse.

    Ein überdrehtes Kind ist nicht voll mit Energie. Es ist über seinem
    Erregungsfenster. Das Nervensystem hat mehr aufgenommen, als es verarbeiten
    konnte, und findet die Bremse nicht mehr.

    Deshalb wirkt so ein Kind gleichzeitig aufgekratzt und unglücklich. Und
    deshalb macht Auspowern es bei vielen Kindern schlimmer statt besser.

    Der Unterschied von außen: Ein Kind, das fröhlich albert, kannst du
    ansprechen. Ein überdrehtes hört dich nicht mehr richtig.

- id: kind-rastet-nach-kita-und-schule-aus-01
  artikel: kind-rastet-nach-kita-und-schule-aus
  titel: Dein Kind arbeitet den ganzen Tag an sich selbst
  heikel: false
  text: |
    Es hält still, wenn es sich bewegen möchte. Es wartet, bis es dran ist. Es
    ist freundlich zu einem Kind, das ihm die Schaufel weggenommen hat. Es hält
    Geräusche aus, ohne sich die Ohren zuzuhalten. Es weint nicht, obwohl es
    traurig ist.

    Das alles ist Selbstkontrolle, und Selbstkontrolle ist keine
    Charaktereigenschaft. Sie ist eine Leistung, die Kraft kostet.

    Und dann geht die Tür auf, und da stehst du. In dem Moment meldet sein
    Nervensystem: sicher. Und wo es sicher ist, muss nichts mehr gehalten
    werden.

- id: kind-rastet-nach-kita-und-schule-aus-02
  artikel: kind-rastet-nach-kita-und-schule-aus
  titel: Der verlässlichste Test
  heikel: false
  text: |
    Nicht jeder Wutanfall am Nachmittag ist eine Heimkehr-Entladung. Der
    Unterschied ist erkennbar, und er ist wichtig, weil beides etwas anderes
    braucht.

    Sie beginnt in den ersten Minuten nach dem Ankommen. Der Anlass steht in
    keinem Verhältnis: falscher Becher, falsche Jacke. Nachgeben hilft nicht.
    Danach ist dein Kind erschöpft und oft anhänglich.

    Und der verlässlichste Test: Wenn die Ausbrüche in den Ferien fast
    verschwinden und in der ersten Schulwoche zurückkommen, liegt die Ursache
    nicht in eurem Zuhause.

- id: kind-rastet-nach-kita-und-schule-aus-03
  artikel: kind-rastet-nach-kita-und-schule-aus
  titel: Frag nicht, wie es war
  heikel: false
  text: |
    Diese Frage ist gut gemeint und in dem Moment eine Zumutung.

    Erinnern, sortieren, formulieren: All das braucht genau die Kraft, die
    gerade nicht mehr da ist.

    Die meisten Kinder erzählen von selbst, wenn sie wieder aufgetankt sind. Oft
    Stunden später, beim Spielen oder abends im Dunkeln.

    Was stattdessen hilft: sofort etwas zu essen und zu trinken, ohne Nachfrage,
    ob es Hunger hat. Viele Kinder spüren Hunger schlecht, wenn sie überdreht
    sind, und ein leerer Magen macht jede Entladung heftiger.

- id: kind-rastet-nach-kita-und-schule-aus-04
  artikel: kind-rastet-nach-kita-und-schule-aus
  titel: Ein leeres Konto lernt nichts
  heikel: false
  text: |
    Der häufigste vermeidbare Fehler ist, die Situation in diesem Moment
    erziehen zu wollen.

    Die Regel, dass man die Mutter nicht anschreit, gilt weiter. Aber sie wird
    nicht in der Sekunde durchgesetzt, in der niemand zuhören kann. Sie wird
    später besprochen.

    Die Grenze verschwindet nicht. Sie wartet auf den richtigen Moment.

    Wer in der Entladung erzieht, verliert beides: den Nachmittag und die
    Grenze.

- id: kind-rastet-nach-kita-und-schule-aus-05
  artikel: kind-rastet-nach-kita-und-schule-aus
  titel: „Du bist die schlimmste Mama“
  heikel: false
  text: |
    Dieser Satz ist in diesem Moment kein Urteil über dich. Es ist der Satz
    eines Kindes, dessen Kraft aufgebraucht ist und das weiß, dass diese
    Beziehung das aushält.

    Kinder entladen sich dort, wo die Beziehung es trägt. Nicht dort, wo sie am
    schwächsten ist, sondern dort, wo sie am stärksten ist.

    Das macht die Nachmittage nicht leichter. Aber es beantwortet die Frage, die
    dir am meisten zusetzt. Du machst nichts falsch. Du bist der Ort, an dem es
    rausdarf.

- id: kind-rastet-nach-kita-und-schule-aus-06
  artikel: kind-rastet-nach-kita-und-schule-aus
  titel: Die erste halbe Stunde freihalten
  heikel: false
  text: |
    Direkt nach dem Abholen noch schnell einkaufen, zum Turnen, zum
    Kindergeburtstag: Das ist der häufigste vermeidbare Fehler.

    Wenn es sich einrichten lässt, gehört in die erste halbe Stunde nach dem
    Ankommen nichts.

    Und viele Kinder brauchen zuerst raus statt runter. Rennen, klettern, toben,
    auf dem Rückweg noch einmal um den Block. Das entlädt, ohne dass es
    eskalieren muss.

- id: meltdown-oder-trotzanfall-01
  artikel: meltdown-oder-trotzanfall
  titel: Schaut mein Kind mich an?
  heikel: false
  text: |
    Wenn du dir aus diesem Thema nur eine Sache merkst, dann diese Frage für die
    fünf Sekunden, in denen du entscheiden musst.

    Schaut mein Kind mich an?

    Wenn ja, will es etwas. Dann steh ruhig zu deinem Nein.

    Wenn nein, kann es gerade nicht. Dann steh einfach nur ruhig daneben.

    Ein Kind im Trotzanfall kontrolliert die Wirkung. Ein Kind im Meltdown ist
    nicht mehr im Kontakt, du bist gar nicht gemeint.

- id: meltdown-oder-trotzanfall-02
  artikel: meltdown-oder-trotzanfall
  titel: Ein Trotzanfall will etwas. Ein Meltdown will nichts.
  heikel: false
  text: |
    Ein Trotzanfall ist zielgerichtet. Dein Kind will das Eis, will nicht in die
    Jacke. Es setzt sein stärkstes Mittel ein, um dich umzustimmen. Weil er ein
    Ziel hat, ist er steuerbar: Wenn du nachgibst, hört er sofort auf.

    Ein Meltdown ist das Gegenteil. Er hat kein Ziel und keine Forderung. Er ist
    das, was passiert, wenn ein Nervensystem so weit über seiner Kapazität ist,
    dass es die Kontrolle abgibt. Ein Systemabsturz, kein Machtkampf.

    Deshalb lässt er sich nicht unterbrechen. Nicht durch Nachgeben, nicht durch
    Strenge, nicht durch Ablenkung.

- id: meltdown-oder-trotzanfall-03
  artikel: meltdown-oder-trotzanfall
  titel: Warum die Verwechslung so teuer ist
  heikel: true
  freigegeben: false
  text: |
    Die üblichen Ratschläge für Trotzanfälle sind richtig: ruhig bleiben, bei
    der Entscheidung bleiben, nicht diskutieren.

    Wendet man sie auf einen Meltdown an, passiert etwas anderes. „Bleib bei der
    Entscheidung“ wird zur Forderung an ein System, das gerade nicht liefern
    kann. „Sag klar, was du erwartest“ wird zu zusätzlichem Input in einem
    Moment, in dem jeder Reiz die Sache verschlimmert.

    Deshalb eskalieren Meltdowns bei konsequenten Eltern manchmal heftiger als
    bei nachlässigen. Nicht weil sie etwas falsch machen wollen, sondern weil
    sie eine richtige Strategie im falschen Moment einsetzen.

- id: meltdown-oder-trotzanfall-04
  artikel: meltdown-oder-trotzanfall
  titel: Die Grenze verschwindet nicht, sie verschiebt sich
  heikel: true
  freigegeben: false
  text: |
    Wenn ein Kind im Meltdown schlägt oder tritt, ist das nicht in Ordnung. Es
    bleibt nicht in Ordnung, nur weil es nicht anders konnte.

    Mitten im Zusammenbruch wird die Grenze nicht durchgesetzt, weil niemand da
    ist, der sie hören kann. Später, wenn dein Kind wieder ansprechbar ist, wird
    sie benannt. Ruhig, kurz, ohne Strafpredigt.

    Und dann kommt der Teil, der wirklich etwas verändert: Ihr sucht gemeinsam
    nach dem, was vorher schiefging. Nicht nach einer Strafe, sondern nach dem
    Auslöser.

    Wer nachgibt, streicht die Grenze. Wer versteht, behält sie und ändert die
    Bedingungen.

- id: meltdown-oder-trotzanfall-05
  artikel: meltdown-oder-trotzanfall
  titel: Festhalten steigert die Panik
  heikel: false
  text: |
    Im Meltdown gibt es nur eine echte Aufgabe: sichern. Harte Kanten, Treppen,
    Straße, andere Kinder.

    Wenn dein Kind schlägt oder tritt, geh außer Reichweite, statt festzuhalten.
    Festhalten steigert bei den meisten Kindern die Panik.

    Dann: weniger von allem. Licht runter, Geräusche weg, Menschen weg. Der Weg
    aus einem Meltdown führt über Reduktion, nicht über Zuwendung.

    Und höchstens drei bis vier Worte, in großen Abständen. „Ich bin da.“ Ein
    Gehirn im Absturz verarbeitet keine Sprache.

- id: aussagen-statt-aufforderungen-01
  artikel: aussagen-statt-aufforderungen
  titel: Dreißig bis siebzig Befehle am Tag
  heikel: false
  text: |
    Zieh die Schuhe an. Komm zum Essen. Räum das weg. Beeil dich. Hör auf damit.
    Mach das aus.

    Zähl einen Tag lang mit. Bei den meisten Familien kommen zwischen dreißig
    und siebzig solcher Sätze zusammen, an einem ganz normalen Tag.

    Und dann wundern wir uns, dass der eine Satz, auf den es wirklich ankommt,
    untergeht.

- id: aussagen-statt-aufforderungen-02
  artikel: aussagen-statt-aufforderungen
  titel: Beschreib, was du siehst
  heikel: false
  text: |
    Statt zu sagen, was zu tun ist: „Ich sehe, deine Schuhe stehen noch da.“

    Der Inhalt ist derselbe wie bei „Zieh die Schuhe an“. Aber der Satz verlangt
    keine Unterwerfung. Er stellt eine Lage fest, und den Schluss daraus zieht
    dein Kind selbst.

    Das ist der ganze Unterschied, und er ist größer, als er klingt. Wer den
    Schluss selbst zieht, handelt aus eigenem Antrieb. Wer einen Befehl
    ausführt, gehorcht. Das Erste kann man lernen. Das Zweite muss man jedes Mal
    neu durchsetzen.

- id: aussagen-statt-aufforderungen-03
  artikel: aussagen-statt-aufforderungen
  titel: Das ist nicht weich
  heikel: false
  text: |
    Beim ersten Lesen klingt es zu nachgiebig. Genau darin liegt der Denkfehler.

    Weich wäre: „Möchtest du vielleicht deine Schuhe anziehen?“ Das ist eine
    Frage, und Fragen kann man mit Nein beantworten.

    „Ich sehe, deine Schuhe stehen noch da“ ist keine Frage. Es steht dieselbe
    Erwartung dahinter wie beim Befehl. Sie wird nur nicht ausgesprochen,
    sondern dem Kind überlassen.

    Weitere Beispiele: „Das Essen steht auf dem Tisch.“ „Draußen sind es heute
    sechs Grad.“ „In fünf Minuten müssen wir los.“ „Der Ball ist für draußen.“

- id: aussagen-statt-aufforderungen-04
  artikel: aussagen-statt-aufforderungen
  titel: Warum es bei überlasteten Kindern wirkt
  heikel: false
  text: |
    Eine Feststellung setzt keine Frist. Sie erlaubt zwei Sekunden Denkzeit,
    bevor etwas passieren muss. Für ein Kind, dessen System gerade langsam ist,
    sind diese zwei Sekunden oft der Unterschied zwischen Reaktion und Blockade.

    Dazu kommt: Eine Feststellung enthält keine Bewertung.

    „Zieh endlich die Schuhe an“ enthält den Vorwurf, es zu lange nicht getan zu
    haben. „Deine Schuhe stehen noch da“ enthält ihn nicht.

    Wer ohnehin am Rand seiner Kraft ist, reagiert auf Vorwürfe empfindlicher
    als auf Anforderungen.

- id: kind-haelt-sich-die-ohren-zu-01
  artikel: kind-haelt-sich-die-ohren-zu
  titel: Das Ohrenzuhalten ist nicht das Problem
  heikel: false
  text: |
    Es ist die Lösung, die dein Kind sich selbst gebaut hat.

    Ein Erwachsener, dem es zu laut ist, geht raus, dreht leiser oder sagt
    Bescheid. Ein Kind kann das alles nicht. Es kann den Supermarkt nicht
    verlassen, den Händetrockner nicht abstellen, die Turnhalle nicht leiser
    machen.

    Es hat genau eine Möglichkeit, und es nutzt sie.

    Es abzugewöhnen heißt, ihm die Lösung wegzunehmen und das Problem zu lassen.

- id: kind-haelt-sich-die-ohren-zu-02
  artikel: kind-haelt-sich-die-ohren-zu
  titel: Warum dasselbe Kind selbst ohrenbetäubend laut sein kann
  heikel: false
  text: |
    Das verwirrt viele Eltern und ist kein Widerspruch.

    Selbst erzeugte Geräusche sind vorhersehbar, fremde nicht. Vorhersehbarkeit
    macht fast den ganzen Unterschied.

    Daraus folgt der billigste wirksame Griff im Alltag: immer vorwarnen. „Ich
    mache jetzt den Mixer an.“ „Gleich kommt der Händetrockner.“

    Ein angekündigtes Geräusch ist ein anderes Geräusch als ein plötzliches. Das
    senkt die Reaktion oft um mehr als die Hälfte und kostet dich nichts.

- id: kind-haelt-sich-die-ohren-zu-03
  artikel: kind-haelt-sich-die-ohren-zu
  titel: Wer den Knopf hat, hat weniger Angst
  heikel: false
  text: |
    Dein Kind darf den Staubsauger selbst einschalten. Es darf entscheiden, wann
    der Mixer läuft.

    Das ist einer der zuverlässigsten Tricks überhaupt, und er kostet nichts
    außer ein bisschen Geduld.

    Dazu ein leiser Rückzugsort. Zu Hause und, wenn möglich, in der Kita. Nicht
    als Strafort, sondern als Ort, den dein Kind selbst aufsuchen darf, bevor es
    kippt.

- id: kind-haelt-sich-die-ohren-zu-04
  artikel: kind-haelt-sich-die-ohren-zu
  titel: Zuerst das Gehör prüfen lassen
  heikel: true
  freigegeben: false
  text: |
    Das klingt widersinnig und ist der wichtigste erste Schritt.

    Auch eine Hörstörung kann sich als Geräuschempfindlichkeit äußern. Ein
    Paukenerguss, wiederkehrende Mittelohrentzündungen, eine einseitige
    Schwerhörigkeit: All das verändert, wie ein Kind Geräusche erlebt, und all
    das ist behandelbar.

    Ein Hörtest bei der Kinderärztin oder beim HNO-Arzt ist schnell gemacht.

    Diesen Schritt zu überspringen, ist der häufigste Fehler in dieser ganzen
    Geschichte.

- id: kind-haelt-sich-die-ohren-zu-05
  artikel: kind-haelt-sich-die-ohren-zu
  titel: Wenn dein Kind sich bei Streit die Ohren zuhält
  heikel: false
  text: |
    Dann geht es nicht um Dezibel, sondern um Anspannung. Laute Stimmen,
    Konflikt, Aufregung. Manche Kinder reagieren darauf körperlich genauso wie
    auf eine Sirene.

    Wenn dein Kind sich in dem Moment die Ohren zuhält, in dem jemand laut wird,
    ist das kein Trotz.

    Es ist das ehrlichste Feedback, das du bekommen kannst.

- id: kind-will-sich-nicht-anziehen-01
  artikel: kind-will-sich-nicht-anziehen
  titel: Zieh die Socke auf links
  heikel: false
  text: |
    Der schnellste Test beim morgendlichen Anziehkampf dauert zehn Sekunden.

    Wenn die Naht dann außen liegt und plötzlich alles gut ist, hast du deine
    Antwort.

    Denn hinter der Weigerung stecken zwei völlig verschiedene Gründe.
    Selbstbestimmung: Dein Kind will überhaupt etwas wählen. Oder Sensorik: Die
    Kleidung fühlt sich auf der Haut wirklich unangenehm an.

    Beide sehen gleich aus und brauchen genau entgegengesetzte Antworten.
    Deshalb hat bisher die Hälfte aller Ratschläge versagt.

- id: kind-will-sich-nicht-anziehen-02
  artikel: kind-will-sich-nicht-anziehen
  titel: Woran du die beiden unterscheidest
  heikel: false
  text: |
    Bei Selbstbestimmung wechselt, was abgelehnt wird: heute die Hose, morgen
    die Jacke. Eine Auswahl von zwei Dingen löst das Problem meistens sofort.
    Der Ton ist trotzig.

    Bei Sensorik bleibt es gleich: immer dasselbe Teil, dieselbe Stelle. Nach
    dem Anziehen wird gezupft und gezogen. Der Ton ist verzweifelt, manchmal in
    Tränen. Und es passiert bei anderen Erwachsenen genauso.

    Der zweite Test: Wenn ein Kleidungsstück auch dann abgelehnt wird, wenn dein
    Kind es selbst ausgesucht hat, geht es nicht um Selbstbestimmung.

- id: kind-will-sich-nicht-anziehen-03
  artikel: kind-will-sich-nicht-anziehen
  titel: Man kann Kleidung ändern, nicht das Empfinden
  heikel: false
  text: |
    Wenn es Sensorik ist, ist es keine Erziehungsfrage.

    Man kann einem Kind nicht abgewöhnen, dass etwas auf der Haut unangenehm
    ist, so wenig wie man ihm abgewöhnen kann, dass Zitrone sauer schmeckt.

    Was wirkt: Etiketten heraustrennen statt abschneiden, weil der Rest oft
    schlimmer kratzt als das Ganze. Nahtlose Socken. Neue Kleidung einmal
    waschen, bevor sie getragen wird.

    Und die Passform ausprobieren. Manche Kinder brauchen eng, weil fester Druck
    angenehm ist. Andere brauchen weit, weil jede Berührung stört.

- id: kind-will-sich-nicht-anziehen-04
  artikel: kind-will-sich-nicht-anziehen
  titel: Fünfmal dasselbe
  heikel: false
  text: |
    Wenn ein Kleidungsstück funktioniert, kauf es mehrfach.

    Das ist keine Marotte, das ist die wirksamste Einzelmaßnahme in diesem
    ganzen Thema.

    Fünf gleiche Hosen sparen euch fünf Konflikte pro Woche.
