# Silo: Grundlagen

- id: autoritativer-erziehungsstil-01
  artikel: autoritativer-erziehungsstil
  titel: Ein Buchstabe Unterschied
  heikel: false
  text: |
    Autoritär und autoritativ klingen fast gleich und meinen das Gegenteil
    voneinander.

    Autoritär heißt vereinfacht: Ich bestimme, du gehorchst. Die Regel steht
    über der Beziehung. Wer nicht folgt, bekommt Druck.

    Autoritativ heißt: Ich sehe dich. Ich liebe dich. Und ich weiß, wohin wir
    gehen. Die Beziehung trägt, und die Richtung ist trotzdem klar.

    An dieser einen Verwechslung scheitern unglaublich viele Gespräche über
    Erziehung. Sobald jemand Führung sagt, hören viele Eltern Strenge. Sobald
    jemand Wärme sagt, hören andere Beliebigkeit.

- id: autoritativer-erziehungsstil-02
  artikel: autoritativer-erziehungsstil
  titel: Zwei Fragen, mehr nicht
  heikel: false
  text: |
    Anfang der Sechzigerjahre beobachtete die Psychologin Diana Baumrind über
    hundert Vorschulkinder in ihrem ganz normalen Alltag.

    Irgendwann fiel ihr ein Muster auf. Fast alles, was diese Eltern taten, ließ
    sich auf zwei Fragen zurückführen.

    Wie viel Wärme erlebt dieses Kind? Und wie viel klare Führung erlebt es?

    Entscheidend war dabei nicht, welches von beidem. Entscheidend war, dass
    Kinder mit viel Wärme und viel Führung im Durchschnitt am besten
    zurechtkommen.

    Nicht eines von beidem. Beides zugleich.

- id: autoritativer-erziehungsstil-03
  artikel: autoritativer-erziehungsstil
  titel: Wie klein der Unterschied im Wortlaut ist
  heikel: false
  text: |
    Das Kind will nicht ins Bett.

    Wenig Führung: „Na gut, aber nur noch zehn Minuten.“ Und danach noch mal
    zehn.

    Wenig Wärme: „Jetzt reicht es. Ins Bett, sofort.“

    Warm und klar: „Ich weiß, du würdest gern weiterspielen. Das verstehe ich.
    Und trotzdem gehen wir jetzt ins Bett.“ Dann aufstehen und mitgehen, nicht
    noch dreimal wiederholen.

    Der Unterschied liegt selten in der Länge des Satzes. Er liegt darin, ob
    beide Hälften vorkommen.

- id: autoritativer-erziehungsstil-04
  artikel: autoritativer-erziehungsstil
  titel: Führung heißt nicht, ein Kind zu brechen
  heikel: true
  freigegeben: false
  text: |
    Weil das Feld empfindlich ist, gehört die Abgrenzung dazu.

    Dieser Weg hat nichts zu tun mit der Vorstellung, Kinder bräuchten vor allem
    Härte, damit aus ihnen etwas wird. Diese Linie hat in Deutschland viel
    Schaden angerichtet.

    Und er hat nichts zu tun mit den strengen Schlafprogrammen der
    Neunzigerjahre, die vielen Müttern bis heute im Nacken sitzen.

    Führung heißt, einem Kind die Last abzunehmen, die Welt selbst sortieren zu
    müssen.

- id: beduerfnis-oder-wunsch-01
  artikel: beduerfnis-oder-wunsch
  titel: Die Faustregel für den Alltag
  heikel: false
  text: |
    Wenn es schnell gehen muss, hilft eine einzige Frage.

    Was bleibt, wenn ich es nicht erfülle?

    Bleibt ein echter Mangel, war es ein Bedürfnis. Dann erfülle es, auch wenn
    es gerade unpassend ist.

    Bleibt eine Enttäuschung, war es ein Wunsch. Dann darfst du Nein sagen.

    Und dann gilt das Wichtigste: Das Nein gilt der Sache. Nicht dem Gefühl.

- id: beduerfnis-oder-wunsch-02
  artikel: beduerfnis-oder-wunsch
  titel: Das Bedürfnis erfüllen, ohne den Wunsch zu erfüllen
  heikel: false
  text: |
    Dein Kind will das Spielzeug im Laden. Der Wunsch ist das Spielzeug. Das
    Bedürfnis dahinter ist oft: Ich will auch etwas zu sagen haben. Ich will,
    dass du mich siehst.

    Du kannst also Nein zum Spielzeug sagen und trotzdem das Bedürfnis
    erfüllen. Indem dein Kind aussucht, welches Brot ihr mitnehmt. Indem du
    sagst: „Das ist wirklich schön. Schreiben wir es auf deine Wunschliste?“

    Das ist keine Trickkiste. Es ist die Anerkennung, dass hinter dem Lauten
    fast immer etwas Echtes steht, das man erreichen kann, ohne nachzugeben.

- id: beduerfnis-oder-wunsch-03
  artikel: beduerfnis-oder-wunsch
  titel: Die Lautstärke sagt gar nichts
  heikel: false
  text: |
    Wenn ein Kind wegen eines Wunsches vierzig Minuten schreit, denken wir
    unwillkürlich: So heftig kann das nur sein, wenn es wirklich wichtig ist.

    Aber die Heftigkeit sagt nichts über die Art. Sie sagt etwas über das Alter.

    Kleine Kinder können Enttäuschung noch nicht regulieren. Deshalb wirkt eine
    Enttäuschung bei einem Dreijährigen körperlich so groß wie bei uns ein
    echter Verlust.

    Das ist real, und es ist trotzdem kein Beweis dafür, dass der Wunsch hätte
    erfüllt werden müssen.

    Was dein Kind in diesem Moment braucht, ist nicht das Eis. Es ist jemand,
    der ruhig bleibt, während es das gerade nicht kann.

- id: beduerfnis-oder-wunsch-04
  artikel: beduerfnis-oder-wunsch
  titel: Warum diese Unterscheidung Eltern rettet
  heikel: false
  text: |
    Wenn jeder geäußerte Wille als unverhandelbares Bedürfnis gilt, gibt es
    logischerweise keinen Moment mehr, in dem du Nein sagen darfst, ohne dich
    schuldig zu fühlen.

    Und dann verschwindest du. Langsam, über Monate, bis du abends um zehn auf
    dem Sofa sitzt und nicht mehr weißt, wo du in all dem eigentlich vorkommst.

    Deine Bedürfnisse sind auch Bedürfnisse. Schlaf. In Ruhe essen. Ein
    zusammenhängender Gedanke.

    Das ist kein Egoismus, den du dir verdienen musst.

- id: was-kinder-sicher-macht-01
  artikel: was-kinder-sicher-macht
  titel: Sicherheit entsteht nicht nur durch Nähe
  heikel: false
  text: |
    Die verbreitetste Vorstellung lautet: Je mehr Nähe, desto sicherer. Das ist
    nicht falsch und es ist unvollständig.

    Sicherheit ruht auf vier Säulen. Nähe ist eine davon.

    Vorhersehbarkeit. Verlässliche Reaktionen. Ruhe im schwierigen Moment. Und
    die Rückkehr nach dem Konflikt.

    Die Lücke in der üblichen Vorstellung ist der Grund, warum sehr viele Eltern
    das Gefühl haben, ständig zu wenig zu geben, obwohl sie alles geben.

- id: was-kinder-sicher-macht-02
  artikel: was-kinder-sicher-macht
  titel: Ein fester Ablauf schlägt eine zusätzliche Stunde
  heikel: false
  text: |
    Ein Kind, das nicht weiß, was als Nächstes kommt, ist in leichter
    Daueralarmbereitschaft.

    Das ist keine Metapher. Wachsamkeit kostet Energie, und zwar genau die
    Energie, die sonst für Lernen, Spielen und Selbstbeherrschung zur Verfügung
    stünde.

    Vorhersehbarkeit heißt nicht Minutenplan. Es heißt: Der Ablauf ist bekannt.
    Nach dem Abendessen kommt das Bad, dann das Buch, dann das Bett. Immer.

    Ein fester Ablauf gibt einem Kind mehr Sicherheit als eine zusätzliche
    Stunde gemeinsame Zeit ohne Struktur.

- id: was-kinder-sicher-macht-03
  artikel: was-kinder-sicher-macht
  titel: Drei Dinge, die nicht dazugehören
  heikel: false
  text: |
    Ständige Verfügbarkeit. Sicherheit entsteht aus Verlässlichkeit, nicht aus
    Dauerpräsenz. Entscheidend ist, dass jemand wiederkommt, nicht dass niemand
    geht.

    Konfliktfreiheit. Ein Kind, das nie einen Widerstand erlebt, ist nicht
    sicherer. Es hat nur weniger Gelegenheit gehabt zu erfahren, dass Widerstand
    aushaltbar ist.

    Und Perfektion. Ein Kind verträgt sehr viel mehr, als Eltern glauben, und
    die Reparatur ist wichtiger als die Fehlerlosigkeit.

- id: was-kinder-sicher-macht-04
  artikel: was-kinder-sicher-macht
  titel: Die tröstlichste der vier Säulen
  heikel: false
  text: |
    Sicherheit entsteht nicht dadurch, dass nie etwas schiefgeht. Sie entsteht
    dadurch, dass nach dem, was schiefgegangen ist, jemand wiederkommt.

    Ein Kind, das erlebt, dass ein Streit die Beziehung nicht beendet, lernt
    etwas Entscheidendes über Beziehungen überhaupt.
