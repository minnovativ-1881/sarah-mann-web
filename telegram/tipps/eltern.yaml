# Silo: Für dich als Elternteil

- id: eigene-wut-regulieren-01
  artikel: eigene-wut-regulieren
  titel: Die angekündigte Unterbrechung
  heikel: true
  freigegeben: true
  text: |
    Wenn du merkst, dass du die Kontrolle verlierst, ist Rausgehen besser als
    Lautwerden.

    „Ich bin gerade zu wütend. Ich gehe kurz raus und komme gleich wieder.“

    Zwei Minuten im Flur. Atmen. Zurück.

    Das fühlt sich an wie Versagen und ist eine gute Entscheidung. Ein Kind kann
    zwei Minuten Warten verkraften. An einen lauten Satz erinnert es sich
    länger.

    Wichtig ist das Wiederkommen. Ohne die Rückkehr wird aus einer Unterbrechung
    ein Rückzug, und ein Rückzug wirkt wie Ausschluss.

- id: eigene-wut-regulieren-02
  artikel: eigene-wut-regulieren
  titel: Ruhe ist keine Willensleistung
  heikel: true
  freigegeben: true
  text: |
    Der übliche Ansatz lautet: sich vornehmen, ruhiger zu sein. Und er scheitert
    zuverlässig, weil Vorsätze in dem Moment nicht abrufbar sind, in dem man sie
    bräuchte.

    Wut bei Eltern ist normal. Was sie aussagt, ist etwas anderes: dass eine
    Grenze erreicht ist. Meistens eine körperliche.

    Ruhe hängt nicht am Willen. Sie hängt an der Reserve.

    Deshalb liegt der eigentliche Hebel vorher: Schlaf, Entlastung, weniger
    Entscheidungen am Tag. Nicht im Moment selbst.

- id: eigene-wut-regulieren-03
  artikel: eigene-wut-regulieren
  titel: Den Körper verändern, nicht die Gedanken
  heikel: false
  text: |
    Wenn die Wut schon da ist, sind Gedanken schlecht steuerbar. Der Körper ist
    es besser.

    Ausatmen, lang. Nicht einatmen. Ein langes Ausatmen senkt die Erregung
    messbar, ein tiefes Einatmen erhöht sie eher.

    Hinsetzen. Wut braucht Aufrichtung. Wer sitzt, ist weniger im Angriffsmodus.

    Leiser werden. Das ist gegen jeden Instinkt und wirkt am stärksten, in beide
    Richtungen.

    Und den Raum wechseln. Die wirksamste Maßnahme, wenn es wirklich kippt.

- id: eigene-wut-regulieren-04
  artikel: eigene-wut-regulieren
  titel: Der Punkt, der unangenehm zu lesen ist
  heikel: true
  freigegeben: true
  text: |
    Fast niemand schreit seinen Chef an. Auch nicht bei großer Erschöpfung. Auch
    nicht bei Provokation.

    Der Unterschied ist nicht die Belastung. Es sind die Konsequenzen und die
    soziale Kontrolle. Zu Hause gibt es beides nicht.

    Das klingt wie ein Vorwurf und ist das Gegenteil: Es zeigt, dass das
    Verhalten steuerbar ist. Wer es unter anderen Bedingungen steuern kann, kann
    es grundsätzlich.

    Was fehlt, sind nicht Fähigkeit oder Wille. Es sind Reserve und Struktur.
    Und an beidem kann man arbeiten.

- id: elterliche-erschoepfung-01
  artikel: elterliche-erschoepfung
  titel: Müdigkeit geht weg. Das ist der ganze Unterschied.
  heikel: true
  freigegeben: true
  text: |
    Wenn ein ruhiges Wochenende spürbar etwas ändert, war es Müdigkeit. Wenn du
    am Montagmorgen genauso leer aufwachst wie am Freitagabend, ist es etwas
    anderes.

    Elterliche Erschöpfung zeigt sich meist in drei Dingen zugleich.

    Eine Müdigkeit, die durch Schlaf nicht mehr weggeht. Innere Distanz: Du
    funktionierst weiter, spürst dabei aber nichts mehr richtig. Und das Gefühl,
    nicht mehr zu genügen, nicht nebenbei, sondern als Grundgefühl.

    Wenn du alle drei kennst, ist das kein Zeichen von Schwäche. Es ist ein
    Zeichen, dass die Belastung länger gedauert hat als deine Reserven.

- id: elterliche-erschoepfung-02
  artikel: elterliche-erschoepfung
  titel: Geduld ist keine Charaktereigenschaft
  heikel: false
  text: |
    Sie ist eine Ressource. Sie verbraucht sich, und sie füllt sich nur unter
    bestimmten Bedingungen wieder auf.

    Wer das nicht weiß, zieht die falsche Schlussfolgerung. Er wird laut, schämt
    sich, nimmt sich vor, es besser zu machen, und wird beim nächsten Mal wieder
    laut. Weil der Vorsatz an der Ursache nichts ändert.

    Die Ursache ist nicht zu wenig Vorsatz. Die Ursache ist zu wenig Reserve.

    Das ist keine Ausrede, sondern eine andere Baustelle. Wer an der falschen
    arbeitet, arbeitet vergeblich und hält sich zusätzlich für unfähig.

- id: elterliche-erschoepfung-03
  artikel: elterliche-erschoepfung
  titel: Warum es die Engagierten trifft
  heikel: false
  text: |
    Erschöpfung trifft nicht die Gleichgültigen. Sie trifft überdurchschnittlich
    oft die Eltern, die es besonders gut machen wollen.

    Weil hoher Anspruch und wenig Entlastung die ungünstigste Kombination
    überhaupt sind.

    Dazu kommt, was für diese Elterngeneration besonders gilt: kaum Alltagshilfe
    im Haus, ständiger Vergleich über Bildschirme, der Anspruch, immer geduldig
    zu sein, und kein Puffer für Krankheit oder Ausfall.

    Das ist keine Verklärung der alten Zeit. Es ist eine nüchterne Rechnung.

- id: elterliche-erschoepfung-04
  artikel: elterliche-erschoepfung
  titel: Konkrete Bitten werden erfüllt, allgemeine nicht
  heikel: false
  text: |
    Erschöpfung entsteht in Isolation, und sie geht in Isolation nicht weg. Es
    gibt keinen Ersatz für andere Menschen.

    Der schwierigste Teil daran ist das Fragen. Viele Eltern fragen nicht, weil
    sie sich niemandem zumuten wollen. Und dann sitzen sie allein da und wundern
    sich, warum niemand kommt.

    Bitte deshalb einen einzigen Menschen um eine einzige konkrete Hilfe. Nicht
    allgemein, sondern konkret: einen Nachmittag, eine Abholung, einen Einkauf.

- id: elterliche-erschoepfung-05
  artikel: elterliche-erschoepfung
  titel: Was nicht hilft
  heikel: false
  text: |
    Der Wellness-Abend. Nicht weil er schlecht wäre, sondern weil er als Lösung
    verkauft wird und keine ist.

    Ein Bad ändert nichts an einer strukturellen Überlastung, und danach ist die
    Enttäuschung größer als vorher.

    Was stattdessen wirkt, ist unspektakulär: weniger Entscheidungen. Ein fester
    Wochenplan fürs Essen, ein fester Ablauf am Abend, feste Regeln statt
    situativer Bewertung.

    Alles, was du einmal entscheidest und dann nicht mehr, entlastet.

- id: elterliche-erschoepfung-06
  artikel: elterliche-erschoepfung
  titel: Wann es zur Ärztin gehört
  heikel: true
  freigegeben: true
  text: |
    Es gibt Signale, bei denen fachliche Hilfe angebracht ist.

    Der Zustand hält seit Wochen unverändert an. Du fürchtest dich morgens vor
    dem Tag. Du empfindest keine Freude mehr, auch nicht an Dingen, die dir
    früher etwas bedeutet haben. Du hast Gedanken, die dich selbst erschrecken.
    Du hast das Gefühl, dein Kind wäre ohne dich besser dran.

    Der letzte Punkt ist besonders wichtig. Dieser Gedanke fühlt sich wie eine
    Erkenntnis an und ist ein Symptom.

    Wenn er da ist, sprich mit deiner Hausärztin oder einer Beratungsstelle.
    Nicht irgendwann, sondern diese Woche.

- id: kind-angeschrien-was-jetzt-01
  artikel: kind-angeschrien-was-jetzt
  titel: Ein lauter Moment macht kein Kind kaputt
  heikel: true
  freigegeben: true
  text: |
    Kinder sind keine empfindlichen Apparate, bei denen eine falsche Reaktion
    einen Schalter umlegt. Was ein Kind prägt, sind Muster. Tausende kleine
    Momente über Jahre. Nicht der eine Abend.

    Beziehungen sind nicht dann sicher, wenn nie ein Bruch entsteht, sondern
    wenn Brüche zuverlässig repariert werden.

    Das heißt: Der Moment nach dem Schreien ist wichtiger als das Schreien
    selbst.

    Und dieser Moment liegt noch vor dir.

- id: kind-angeschrien-was-jetzt-02
  artikel: kind-angeschrien-was-jetzt
  titel: Kein „weil“ hinterher
  heikel: true
  freigegeben: true
  text: |
    „Das tut mir leid. Das hattest du nicht verdient.“

    Und jetzt der schwerste Teil: kein weil danach. Kein „aber ich hatte auch
    einen anstrengenden Tag“, kein „du hast mich ja auch dreimal ignoriert“.

    Sobald eine Erklärung kommt, wird aus der Entschuldigung eine
    Rechtfertigung, und dein Kind hört den zweiten Teil.

    Die Erklärung ist für dich, nicht für dein Kind.

- id: kind-angeschrien-was-jetzt-03
  artikel: kind-angeschrien-was-jetzt
  titel: Entschuldige dich für das Wie, nicht für das Was
  heikel: true
  freigegeben: true
  text: |
    Das ist der Punkt, an dem viele Eltern aus Schuldgefühl zu weit gehen. Man
    hat geschrien, fühlt sich schlecht, und dann darf das Kind doch noch die
    Folge schauen.

    Damit lernt es etwas Ungünstiges: Wenn es laut genug wird, kippen
    Entscheidungen.

    Ganz zusammen klingt es so: „Ich war eben laut. Das tut mir leid, das
    hattest du nicht verdient. Du bist erschrocken. Und bei den Zähnen bleibt es
    trotzdem.“

    Vier Sätze. Mehr braucht es nicht.

- id: kind-angeschrien-was-jetzt-04
  artikel: kind-angeschrien-was-jetzt
  titel: Sag es ohne Beschönigung
  heikel: false
  text: |
    „Ich war eben laut.“

    Nicht: „Es ist eskaliert.“ Nicht: „Wir hatten beide einen schlechten
    Moment.“

    Du warst laut. Dass du es benennst, ist für dein Kind die Bestätigung, dass
    es sich das nicht eingebildet hat.

    Und danach: „Du bist erschrocken, oder?“ Dann warten. Auch wenn nichts
    kommt. Kleine Kinder brauchen oft eine Weile, manchmal nicken sie nur.

- id: nicht-konsequent-sein-koennen-01
  artikel: nicht-konsequent-sein-koennen
  titel: Konsequenz ist keine Eigenschaft
  heikel: false
  text: |
    Wer glaubt, Konsequenz sei ein Charakterzug, kann daran nur mit Willenskraft
    arbeiten. Und Willenskraft ist genau das, was in den entscheidenden Momenten
    am wenigsten verfügbar ist: abends, bei Müdigkeit, im fünften Konflikt des
    Tages.

    Konsequenz ist das Ergebnis von vier Bedingungen. Wenn sie nicht gelingt,
    fehlt in aller Regel eine davon.

    Genug Reserve. Wenige Regeln. Die Fähigkeit, Protest auszuhalten. Und
    Entscheidungen, die vorher gefallen sind.

    An keiner dieser vier hilft ein Vorsatz.

- id: nicht-konsequent-sein-koennen-02
  artikel: nicht-konsequent-sein-koennen
  titel: Weniger Regeln machen konsequenter
  heikel: false
  text: |
    Sehr viele Familien haben zwanzig oder dreißig Regeln, ohne es zu wissen.
    Nicht aufgeschrieben, sondern gewachsen.

    Und niemand kann dreißig Regeln verlässlich halten. Die Hälfte wird je nach
    Tagesform ausgesetzt.

    Ein Kind, das erlebt, dass Regeln manchmal gelten, muss jede einzelne
    ständig neu prüfen.

    Weniger Regeln sind deshalb kein Kompromiss, sondern der eigentliche Weg.

- id: nicht-konsequent-sein-koennen-03
  artikel: nicht-konsequent-sein-koennen
  titel: Wenn du den Protest nicht aushältst
  heikel: false
  text: |
    Manche Eltern geben nach, weil sie das Weinen, das Schreien oder die
    Enttäuschung nicht ertragen. Nicht aus Nachlässigkeit.

    Das hat oft eine eigene Geschichte. Wer als Kind erlebt hat, dass Konflikte
    gefährlich sind, oder dass man geliebt wird, solange man niemanden
    enttäuscht, trägt das mit.

    Was hier hilft, ist nicht mehr Härte, sondern ein Gedanke: Dein Kind darf
    enttäuscht sein. Enttäuschung ist kein Schaden.

    Ein Kind, das protestiert, ist nicht verletzt. Es ist unzufrieden, und das
    darf es sein.

- id: nicht-konsequent-sein-koennen-04
  artikel: nicht-konsequent-sein-koennen
  titel: Der Denkfehler, der dazwischen sitzt
  heikel: true
  freigegeben: true
  text: |
    Viele Eltern sagen etwas fünfmal, achtmal, zehnmal, werden dann laut und
    schließen daraus, sie seien nicht konsequent genug.

    Das Gegenteil stimmt. Das Problem ist nicht, dass zu wenig passiert. Es ist,
    dass zu viel geredet wird.

    Jede Wiederholung bringt einem Kind bei, dass der Ernstfall später beginnt.

    Einmal sagen. Dann hingehen. Dann handeln. Das ist der ganze Unterschied,
    und er macht das Lautwerden fast überflüssig.

- id: ich-mag-mein-kind-gerade-nicht-01
  artikel: ich-mag-mein-kind-gerade-nicht
  titel: Zuneigung schwankt. Bindung nicht.
  heikel: true
  freigegeben: true
  text: |
    „Ich weiß, das darf man nicht sagen. Aber ich mag mein Kind gerade nicht
    besonders.“

    Zuneigung ist keine Konstante. Das gilt für jede menschliche Beziehung, und
    es gilt auch für die zum eigenen Kind.

    Was nicht schwankt, ist die Bindung. Sie hängt nicht daran, ob du dein Kind
    heute sympathisch findest. Sie hängt daran, ob du verlässlich da bist.

    Ein Elternteil, das sich innerlich distanziert fühlt und trotzdem morgens
    Frühstück macht, abends vorliest und im Streit dabeibleibt, ist für ein Kind
    ein verlässliches Elternteil.

- id: ich-mag-mein-kind-gerade-nicht-02
  artikel: ich-mag-mein-kind-gerade-nicht
  titel: Zuerst geht die Wärme
  heikel: true
  freigegeben: true
  text: |
    Zuneigung braucht Reserve. Wer über Monate zu wenig geschlafen hat, zu wenig
    allein war und zu viel getragen hat, verliert als Erstes die weichen
    Empfindungen.

    Nicht die Fähigkeit zu funktionieren, sondern die Fähigkeit zu genießen.

    Das Erschreckende daran ist, wie plötzlich es sich anfühlt. Man merkt nicht,
    dass die Reserve sinkt, sondern erst, dass die Wärme weg ist.

    Wer erwartet, dass Zuneigung durch Vorsätze zurückkommt, wartet vergeblich.
    Sie kommt zurück, wenn Reserve da ist.

- id: ich-mag-mein-kind-gerade-nicht-03
  artikel: ich-mag-mein-kind-gerade-nicht
  titel: Fünfzehn Minuten ohne Ziel
  heikel: false
  text: |
    Nicht der große Ausflug, nicht der aufwendige Nachmittag. Fünfzehn Minuten,
    in denen nichts erreicht werden muss.

    Das ist wirksamer als jedes Programm, weil Zuneigung über gemeinsame
    Erfahrung entsteht und nicht über gute Absicht. Und weil in einer
    konfliktreichen Phase die schönen Momente schlicht selten geworden sind.

    Praktisch: eine Sache am Tag, die keinem Ziel dient. Nebeneinander etwas
    anschauen. Ein Spiel, bei dem niemand etwas lernt.

- id: ich-mag-mein-kind-gerade-nicht-04
  artikel: ich-mag-mein-kind-gerade-nicht
  titel: Kinder lesen keine Gedanken
  heikel: false
  text: |
    Sie spüren Anspannung. Aber was bei ihnen ankommt, ist dein Verhalten.

    Und noch ein paar Dinge, die Eltern in diesem Zustand über sich denken und
    die nicht stimmen.

    Es bedeutet nicht, dass du dein Kind nicht liebst. Zuneigung im Alltag und
    Liebe sind zwei verschiedene Dinge. Das eine schwankt täglich, das andere
    nicht.

    Es bedeutet nicht, dass du ein schlechtes Elternteil bist. Es bedeutet, dass
    du erschöpft bist oder in einer schwierigen Phase steckst. Beides sind
    Umstände, keine Eigenschaften.

    Und es bedeutet nicht, dass es so bleibt.

- id: wo-bleiben-meine-beduerfnisse-01
  artikel: wo-bleiben-meine-beduerfnisse
  titel: Bedürfnis und Wunsch sind nicht dasselbe
  heikel: false
  text: |
    Ein Bedürfnis ist etwas, das ein Mensch braucht: Nähe, Schlaf, Sicherheit,
    das Gefühl zu zählen. Bedürfnisse sind nicht verhandelbar.

    Ein Wunsch ist die konkrete Form, in der ein Bedürfnis gerade auftritt:
    dieses Eis, dieser Film, diese Person, dieser Moment. Wünsche sind
    verhandelbar.

    Daraus folgt der Satz, der am meisten entlastet: Du kannst das Bedürfnis
    erfüllen, ohne den Wunsch zu erfüllen.

    Ein Kind, das abends nicht allein sein will, hat ein Bedürfnis nach Nähe.
    Dass ausgerechnet du noch vierzig Minuten sitzen bleibst, ist der Wunsch.

- id: wo-bleiben-meine-beduerfnisse-02
  artikel: wo-bleiben-meine-beduerfnisse
  titel: Deine Bedürfnisse sind nicht der Rest
  heikel: false
  text: |
    Sehr viele Eltern behandeln ihre eigenen Bedürfnisse als das, was übrig
    bleibt. Erst kommen alle anderen, und was danach noch da ist, gehört mir.

    Nur bleibt nie etwas übrig. Das ist keine Frage der Organisation, sondern
    eine mathematische Eigenschaft dieses Modells.

    Was funktioniert: ein paar Dinge fest einplanen, nicht als Rest, sondern als
    Termin. Dienstag 19 Uhr, verabredet. Samstag schläft der eine aus, Sonntag
    der andere.

    Der Unterschied ist nicht die Menge. Es ist die Verlässlichkeit. Auf einen
    festen Termin kann man zusteuern, auf ein Vielleicht nicht.

- id: wo-bleiben-meine-beduerfnisse-03
  artikel: wo-bleiben-meine-beduerfnisse
  titel: Eine Information, kein Vorwurf
  heikel: false
  text: |
    Wie sagt man das einem Kind? Genauso wie jede andere Grenze: als Aussage
    über dich, nicht als Urteil über dein Kind.

    „Ich brauche jetzt fünf Minuten Ruhe. Danach bin ich wieder da.“

    Nicht: „Du bist so anstrengend, ich kann nicht mehr.“

    Der erste Satz ist eine Information. Der zweite ist ein Vorwurf, und Kinder
    tragen Vorwürfe lange mit.

- id: wo-bleiben-meine-beduerfnisse-04
  artikel: wo-bleiben-meine-beduerfnisse
  titel: Kein Abzug vom Konto deines Kindes
  heikel: false
  text: |
    Verlässliche Bindung entsteht nicht durch ständige Verfügbarkeit und nicht
    durch perfekte Reaktionen.

    Was zählt, ist nicht die Abwesenheit von Lücken. Es ist die Verlässlichkeit
    der Rückkehr.

    Daraus folgt etwas Praktisches: Die Zeit, die du dir nimmst, geht deinem
    Kind nicht verloren. Sie kommt ihm zugute, weil ein erholter Erwachsener
    ruhiger ist, und weil Ruhe genau das ist, woran ein Kind sich reguliert.

    Deine Bedürfnisse sind kein Abzug vom Konto deines Kindes. Sie sind Teil
    dessen, was das Konto überhaupt füllt.

- id: wenn-ihr-unterschiedlich-erzieht-01
  artikel: wenn-ihr-unterschiedlich-erzieht
  titel: Nicht Gleichheit zwischen Personen, sondern Verlässlichkeit in einer
  heikel: false
  text: |
    „Eltern müssen an einem Strang ziehen.“ In dieser Allgemeinheit stimmt der
    Satz nicht, und er macht aus jedem Unterschied ein Problem.

    Kinder kommen mit unterschiedlichen Erwachsenen gut zurecht. Bei der Oma
    gelten andere Regeln als zu Hause, in der Kita wieder andere.

    Ein Kind, dessen Vater konsequenter ist als seine Mutter, hat kein Problem,
    solange beide in sich berechenbar sind.

    Ein Kind, dessen Mutter je nach Tagesform mal so und mal so reagiert, hat
    eines. Auch wenn beide Elternteile dieselbe Haltung vertreten.

- id: wenn-ihr-unterschiedlich-erzieht-02
  artikel: wenn-ihr-unterschiedlich-erzieht
  titel: Der einzige Mechanismus, der wirklich schadet
  heikel: false
  text: |
    Wenn ein Erwachsener die Grenze des anderen vor dem Kind aufhebt.

    Das Kind bekommt ein Nein von Person A. Es geht zu Person B. Person B sagt
    Ja.

    Was ein Kind daraus lernt, ist nicht, dass es zwei verschiedene Menschen
    gibt. Es lernt: Ein Nein ist nicht endgültig, man muss nur die richtige
    Person fragen.

    Und danach wird jede Grenze bei beiden getestet, weil sich das Testen lohnt.

    Alles andere ist Geschmacksfrage. Uneinigkeit gehört unter Erwachsene, nicht
    in die Situation.

- id: wenn-ihr-unterschiedlich-erzieht-03
  artikel: wenn-ihr-unterschiedlich-erzieht
  titel: Wo Einigkeit wirklich nötig ist
  heikel: false
  text: |
    Nicht überall. In drei Bereichen schon.

    Sicherheit: Straße, Autositz, Herd. Unbedingt.

    Umgang miteinander: Niemand wird verletzt. Ja.

    Eckpunkte des Tages: ungefähre Schlafenszeit, Mahlzeiten. Weitgehend.

    Ton und Stil, also wie viel geredet und wie viel gekuschelt wird: nein. Da
    darf jeder anders sein, und Kinder profitieren sogar davon.
