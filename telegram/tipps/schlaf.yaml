# Silo: Schlaf und Abend

- id: schlaf-als-fuehrungsaufgabe-01
  artikel: schlaf-als-fuehrungsaufgabe
  titel: Der Abend ist ein Vergrößerungsglas
  heikel: false
  text: |
    „Eigentlich läuft der Tag ganz gut. Aber abends kippt alles.“

    Drei Dinge treffen zwischen achtzehn und zwanzig Uhr aufeinander. Dein Kind
    hat seinen Vorrat an Selbstbeherrschung aufgebraucht. Deine eigene Geduld
    ist ebenfalls am Ende. Und der Abend verlangt genau das, was schwerfällt: Er
    ist die Situation mit den meisten Entscheidungen pro Minute.

    Wann ist Schluss, wie viele Bücher, noch einmal Wasser, noch einmal aufs
    Klo.

    Deshalb ist der Abend kein eigenes Problem. Er ist der Ort, an dem sich
    zeigt, wie klar der Tag war.

- id: schlaf-als-fuehrungsaufgabe-02
  artikel: schlaf-als-fuehrungsaufgabe
  titel: Struktur und Alleinlassen sind zwei verschiedene Dinge
  heikel: true
  freigegeben: false
  text: |
    In Deutschland ist das Wort Struktur beim Thema Schlaf verbrannt, und die
    Gründe dafür sind gut.

    Aber Struktur heißt nicht, ein Kind allein weinen zu lassen. Struktur heißt:
    verlässliche Reihenfolge, verlässliche Zeiten, ein verlässliches Ende. Sie
    sagt nichts darüber, ob dein Kind allein einschläft.

    Die Gegenrichtung, in der es gar keinen Rahmen mehr gibt und jeder Abend neu
    ausgehandelt wird, ist für Kinder nicht entspannter. Sie ist anstrengender.

- id: schlaf-als-fuehrungsaufgabe-03
  artikel: schlaf-als-fuehrungsaufgabe
  titel: Zwei Bücher, entschieden am Nachmittag
  heikel: false
  text: |
    Der häufigste Fehler ist, im Moment zu entscheiden, wie viele Bücher es
    gibt.

    Um halb acht, wenn du müde bist und dein Kind quengelt, entsteht keine gute
    Entscheidung. Es entsteht die mit dem geringsten Widerstand.

    Zwei Bücher, entschieden am Nachmittag, sind ein Rahmen. Zwei Bücher,
    entschieden im Bett, sind ein Angebot, über das verhandelt werden kann.

- id: schlaf-als-fuehrungsaufgabe-04
  artikel: schlaf-als-fuehrungsaufgabe
  titel: Warum Einschlafbegleitung so wütend macht
  heikel: true
  freigegeben: false
  text: |
    Viele Eltern schämen sich dafür. Sie sitzen neben einem müden kleinen
    Menschen, der nichts Böses tut, und spüren Aggression aufsteigen.

    Dafür gibt es Gründe, und keiner davon ist Charakterschwäche.

    Du bist festgesetzt und kannst nicht gehen. Es ist die letzte Aufgabe eines
    langen Tages, und jede Minute Verzögerung nimmt vom eigenen Abend etwas weg.
    Es ist unvorhersehbar: zehn Minuten oder fünfzig, das weiß niemand. Und du
    bist leer.

    Die Situation ist zu lang, zu unklar und zu spät am Tag. An allen drei
    Dingen kann man etwas ändern. An der Wut selbst nicht.

- id: schlaf-als-fuehrungsaufgabe-05
  artikel: schlaf-als-fuehrungsaufgabe
  titel: Was tagsüber den Abend entscheidet
  heikel: false
  text: |
    Das erwartet fast niemand.

    Wie viele Entscheidungen dein Kind am Tag hatte. Ein Kind, das den ganzen
    Tag gefragt wurde, was es möchte, ist abends erschöpft von der Wahl.

    Wie oft du nachgegeben hast. Wer tagsüber beim fünften Nachfragen einknickt,
    bekommt abends das fünfte Nachfragen.

    Und wie viel echte Nähe es gab. Ein Kind, dessen Bedürfnis nach Kontakt
    tagsüber nicht gedeckt wurde, holt es sich abends. Immer.

    Das ist die zuverlässigste Regel in diesem ganzen Bereich.

- id: schlaf-als-fuehrungsaufgabe-06
  artikel: schlaf-als-fuehrungsaufgabe
  titel: Die ersten Abende werden schlechter
  heikel: false
  text: |
    Wenn du etwas änderst, ändere eine Sache. Nicht drei. Meistens ist der
    Abschluss der beste Anfang, weil er den Nochmal-Kreislauf beendet.

    Und rechne damit, dass die ersten zwei bis drei Abende schlechter werden.

    Dein Kind hat gelernt, dass der Abend verhandelbar ist, und wird prüfen, ob
    das noch stimmt. Dieses Prüfen ist der Beweis, dass es die Veränderung
    bemerkt hat, nicht der Beweis, dass es nicht funktioniert.

    Nach ein bis zwei Wochen ist der Abend in aller Regel deutlich kürzer.

- id: schlaf-als-fuehrungsaufgabe-07
  artikel: schlaf-als-fuehrungsaufgabe
  titel: Anwesenheit ohne Verhandlung
  heikel: false
  text: |
    Das ist der schwierigste Teil und der Kern der ganzen Sache.

    Dein Kind darf traurig sein, dass der Abend vorbei ist. Es darf
    protestieren. Und der Abend ist trotzdem vorbei.

    „Ich weiß, du möchtest noch. Und jetzt ist Schlafenszeit. Ich bin da.“

    Nicht erklären, nicht diskutieren, nicht nachgeben. Aber auch nicht
    weggehen.

- id: kind-steht-abends-immer-auf-01
  artikel: kind-steht-abends-immer-auf
  titel: Warum der Abend jeden Tag länger wird
  heikel: false
  text: |
    Noch einmal Wasser. Noch einmal aufs Klo. Noch einmal in den Arm. Noch eine
    Frage.

    Die übliche Erklärung lautet, das Kind sei fordernd geworden. Das trifft es
    nicht.

    Ein Kind, das nicht weiß, wann Schluss ist, muss es herausfinden. Es kann
    dich nicht fragen, wo die Grenze heute liegt. Es kann sie nur erfahren.

    Wenn der siebte Wunsch gestern erfüllt wurde, ist heute der siebte kein
    Grenzfall mehr, sondern normal. Der Test beginnt beim achten.

    So dehnt sich der Abend, ohne dass es irgendjemand will.

- id: kind-steht-abends-immer-auf-02
  artikel: kind-steht-abends-immer-auf
  titel: Zuerst die Schlafenszeit prüfen
  heikel: false
  text: |
    Der am häufigsten übersehene Grund fürs abendliche Aufstehen ist der
    einfachste.

    Ein Kind, das nach vierzig Minuten im Bett noch munter erzählt, singt oder
    spielt, ist meistens nicht ungehorsam. Es ist schlicht noch nicht müde.

    Die Schlafenszeit zwanzig bis dreißig Minuten nach hinten zu schieben klingt
    paradox und verkürzt den Abend häufig deutlich.

    Der zweite Grund ist zu viel Reiz davor. Nicht nur Bildschirme: Auch Toben,
    Besuch oder ein Streit kurz davor wirken nach. Ein Kind braucht ungefähr
    eine Stunde, um von hoher Erregung herunterzukommen.

- id: kind-steht-abends-immer-auf-03
  artikel: kind-steht-abends-immer-auf
  titel: Der Punkt ist die Langeweile
  heikel: false
  text: |
    Wenn dein Kind aufsteht: hingehen, nicht aus dem Wohnzimmer rufen.
    Zurückbegleiten, freundlich, an der Hand. Ein Satz, immer derselbe. „Es ist
    Schlafenszeit. Ich bin da.“ Und wieder rausgehen.

    Ohne neues Thema, ohne Erklärung, ohne Diskussion.

    Ein Kind, das beim Aufstehen nichts Neues bekommt, hört damit auf. Ein Kind,
    das ein Gespräch bekommt, macht weiter.

    Ignorieren ist dabei ausdrücklich nicht der Weg. Freundlich und wortarm ist
    etwas anderes als kalt.

- id: kind-steht-abends-immer-auf-04
  artikel: kind-steht-abends-immer-auf
  titel: Wenn Angst dahintersteckt
  heikel: false
  text: |
    Ein Kind, das sagt, es habe Angst, sagt oft die Wahrheit. Abendliche Ängste
    treten bei vielen Kindern ab etwa drei Jahren auf und sind normal.

    Der Umgang bleibt trotzdem derselbe: ernst nehmen, ohne den Abend neu zu
    öffnen.

    Was hilft: ein kleines Licht, das anbleibt. Ein Gegenstand, der Sicherheit
    gibt. Ein festes Wiederkommen in kurzen Abständen, angekündigt und
    eingehalten. Und tagsüber darüber reden, nicht nachts.

    Was nicht hilft: ein weiteres langes Gespräch im Dunkeln.

- id: kind-steht-abends-immer-auf-05
  artikel: kind-steht-abends-immer-auf
  titel: Zwei Kinder gleichzeitig geht selten gut
  heikel: false
  text: |
    Sie halten sich gegenseitig wach, und beide bekommen halbe Aufmerksamkeit.
    Das verlängert den Vorgang für alle.

    Was funktioniert, ist staffeln. Das Kind, das leichter einschläft, geht
    etwas später ins Bett. Oder das schwierigere bekommt zuerst zehn Minuten
    allein.

    Und: akzeptieren, dass es länger dauert. Ein Abend mit drei Kindern ist
    keine Version desselben Abends mit einem Kind. Er ist eine andere Aufgabe.

- id: abendroutine-die-haelt-01
  artikel: abendroutine-die-haelt
  titel: Eine Routine ist kein Zeitplan
  heikel: false
  text: |
    19:00 Abendessen. 19:20 Baden. 19:40 Buch. 20:00 Licht aus.

    An dem Abend, an dem der Kindergarten später aufhört, das Essen anbrennt
    oder ein Kind Fieber bekommt, ist der Plan hinfällig, und mit ihm die
    Routine.

    Eine Routine, die trägt, ist eine Reihenfolge.

    Ankündigung, Übergang, Ruhe, Abschluss, Begleitung. Immer in dieser Folge.

    Die Reihenfolge ist wichtiger als jede Uhrzeit, weil sie einem Kind sagt, wo
    es gerade ist. Deshalb funktioniert sie auch im Urlaub und bei Besuch.

- id: abendroutine-die-haelt-02
  artikel: abendroutine-die-haelt
  titel: Der Baustein, der in den meisten Familien fehlt
  heikel: false
  text: |
    Von den fünf Bausteinen ist einer wichtiger als alle anderen: der Abschluss.

    Ohne einen erkennbaren letzten Punkt bleibt der Abend offen. Und ein offener
    Abend wird gedehnt, weil ein Kind herausfinden muss, wo er endet.

    Ein guter Abschluss ist immer gleich, kommt nach allen Wünschen und nicht
    davor, ist auch für ein kleines Kind klar erkennbar, ist freundlich statt
    streng, und danach folgt nichts Neues mehr.

    Ein Kind, das diesen Punkt kennt, hört auf zu prüfen. Nicht weil es
    aufgegeben hat, sondern weil es die Antwort hat.

- id: abendroutine-die-haelt-03
  artikel: abendroutine-die-haelt
  titel: Die Stunde vor der Routine
  heikel: false
  text: |
    Die Routine beginnt vor der Routine.

    Ein Kind braucht ungefähr eine Stunde, um von hoher Erregung
    herunterzukommen. Was in dieser Stunde passiert, entscheidet mit darüber,
    wie der Abend läuft.

    Ungünstig sind Bildschirme, Toben, Besuch, aufregende Spiele, Streitthemen,
    große Gespräche.

    Günstig sind gedämpftes Licht, ruhige Beschäftigung, wenig Neues.

    Das ist kein Verbot von Spaß am Abend. Es ist eine Beobachtung darüber, was
    danach passiert.

- id: abendroutine-die-haelt-04
  artikel: abendroutine-die-haelt
  titel: Gemeinsamer Teil, getrennter Schluss
  heikel: false
  text: |
    Mit mehreren Kindern scheitern die meisten Ratschläge, weil sie stillschweigend
    von einem Kind ausgehen.

    Drei Varianten, die funktionieren.

    Nach Alter staffeln: Das jüngere Kind geht früher, das ältere bekommt danach
    seine Zeit. Für das ältere ist das kein Nachteil, sondern ein Privileg.

    Gemeinsamer Teil, getrennter Schluss: Zähne, Schlafanzug und das erste Buch
    zusammen, danach jedem fünf Minuten allein.

    Oder aufteilen, wenn zwei Erwachsene da sind. Wichtig ist nur, dass jeder
    Erwachsene in sich verlässlich ist.

- id: abendroutine-die-haelt-05
  artikel: abendroutine-die-haelt
  titel: Wenn die Routine plötzlich nicht mehr wirkt
  heikel: false
  text: |
    Meistens liegt es nicht an der Routine.

    Der häufigste Grund: Dein Kind ist aus seinem Rhythmus herausgewachsen. Der
    Schlafbedarf sinkt über die Jahre, und eine Schlafenszeit, die vor einem
    halben Jahr gepasst hat, ist heute zu früh. Das Symptom: Es liegt lange wach
    und ist dabei fröhlich.

    Oder der Mittagsschlaf hat sich verändert. Zu lang, zu spät oder ganz
    weggefallen: Alle drei verändern den Abend deutlich.

    Bevor du den Ablauf umbaust, prüf die Schlafenszeit. Sehr oft löst eine
    Verschiebung um zwanzig Minuten das Problem, für das man gerade eine neue
    Methode gesucht hätte.
