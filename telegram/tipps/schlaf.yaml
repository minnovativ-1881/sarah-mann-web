# Silo: Schlaf und Abend

- id: schlaf-als-fuehrungsaufgabe-01
  artikel: schlaf-als-fuehrungsaufgabe
  titel: Der Abend ist ein Vergrößerungsglas
  heikel: false
  text: |
    „Eigentlich läuft der Tag ganz gut. Aber abends kippt alles.“

    Drei Dinge treffen zwischen achtzehn und zwanzig Uhr aufeinander. Dein Kind
    hat seinen Vorrat an Selbstbeherrschung aufgebraucht. Deine eigene Geduld
    ist ebenfalls am Ende. Und der Abend verlangt genau das, was schwerfällt: Er
    ist die Situation mit den meisten Entscheidungen pro Minute.

    Wann ist Schluss, wie viele Bücher, noch einmal Wasser, noch einmal aufs
    Klo.

    Deshalb ist der Abend kein eigenes Problem. Er ist der Ort, an dem sich
    zeigt, wie klar der Tag war.

- id: schlaf-als-fuehrungsaufgabe-02
  artikel: schlaf-als-fuehrungsaufgabe
  titel: Struktur und Alleinlassen sind zwei verschiedene Dinge
  heikel: true
  freigegeben: false
  text: |
    In Deutschland ist das Wort Struktur beim Thema Schlaf verbrannt, und die
    Gründe dafür sind gut.

    Aber Struktur heißt nicht, ein Kind allein weinen zu lassen. Struktur heißt:
    verlässliche Reihenfolge, verlässliche Zeiten, ein verlässliches Ende. Sie
    sagt nichts darüber, ob dein Kind allein einschläft.

    Die Gegenrichtung, in der es gar keinen Rahmen mehr gibt und jeder Abend neu
    ausgehandelt wird, ist für Kinder nicht entspannter. Sie ist anstrengender.

- id: schlaf-als-fuehrungsaufgabe-03
  artikel: schlaf-als-fuehrungsaufgabe
  titel: Zwei Bücher, entschieden am Nachmittag
  heikel: false
  text: |
    Der häufigste Fehler ist, im Moment zu entscheiden, wie viele Bücher es
    gibt.

    Um halb acht, wenn du müde bist und dein Kind quengelt, entsteht keine gute
    Entscheidung. Es entsteht die mit dem geringsten Widerstand.

    Zwei Bücher, entschieden am Nachmittag, sind ein Rahmen. Zwei Bücher,
    entschieden im Bett, sind ein Angebot, über das verhandelt werden kann.

- id: schlaf-als-fuehrungsaufgabe-04
  artikel: schlaf-als-fuehrungsaufgabe
  titel: Warum Einschlafbegleitung so wütend macht
  heikel: true
  freigegeben: false
  text: |
    Viele Eltern schämen sich dafür. Sie sitzen neben einem müden kleinen
    Menschen, der nichts Böses tut, und spüren Aggression aufsteigen.

    Dafür gibt es Gründe, und keiner davon ist Charakterschwäche.

    Du bist festgesetzt und kannst nicht gehen. Es ist die letzte Aufgabe eines
    langen Tages, und jede Minute Verzögerung nimmt vom eigenen Abend etwas weg.
    Es ist unvorhersehbar: zehn Minuten oder fünfzig, das weiß niemand. Und du
    bist leer.

    Die Situation ist zu lang, zu unklar und zu spät am Tag. An allen drei
    Dingen kann man etwas ändern. An der Wut selbst nicht.

- id: schlaf-als-fuehrungsaufgabe-05
  artikel: schlaf-als-fuehrungsaufgabe
  titel: Was tagsüber den Abend entscheidet
  heikel: false
  text: |
    Das erwartet fast niemand.

    Wie viele Entscheidungen dein Kind am Tag hatte. Ein Kind, das den ganzen
    Tag gefragt wurde, was es möchte, ist abends erschöpft von der Wahl.

    Wie oft du nachgegeben hast. Wer tagsüber beim fünften Nachfragen einknickt,
    bekommt abends das fünfte Nachfragen.

    Und wie viel echte Nähe es gab. Ein Kind, dessen Bedürfnis nach Kontakt
    tagsüber nicht gedeckt wurde, holt es sich abends. Immer.

    Das ist die zuverlässigste Regel in diesem ganzen Bereich.

- id: schlaf-als-fuehrungsaufgabe-06
  artikel: schlaf-als-fuehrungsaufgabe
  titel: Die ersten Abende werden schlechter
  heikel: false
  text: |
    Wenn du etwas änderst, ändere eine Sache. Nicht drei. Meistens ist der
    Abschluss der beste Anfang, weil er den Nochmal-Kreislauf beendet.

    Und rechne damit, dass die ersten zwei bis drei Abende schlechter werden.

    Dein Kind hat gelernt, dass der Abend verhandelbar ist, und wird prüfen, ob
    das noch stimmt. Dieses Prüfen ist der Beweis, dass es die Veränderung
    bemerkt hat, nicht der Beweis, dass es nicht funktioniert.

    Nach ein bis zwei Wochen ist der Abend in aller Regel deutlich kürzer.

- id: schlaf-als-fuehrungsaufgabe-07
  artikel: schlaf-als-fuehrungsaufgabe
  titel: Anwesenheit ohne Verhandlung
  heikel: false
  text: |
    Das ist der schwierigste Teil und der Kern der ganzen Sache.

    Dein Kind darf traurig sein, dass der Abend vorbei ist. Es darf
    protestieren. Und der Abend ist trotzdem vorbei.

    „Ich weiß, du möchtest noch. Und jetzt ist Schlafenszeit. Ich bin da.“

    Nicht erklären, nicht diskutieren, nicht nachgeben. Aber auch nicht
    weggehen.

- id: kind-steht-abends-immer-auf-01
  artikel: kind-steht-abends-immer-auf
  titel: Warum der Abend jeden Tag länger wird
  heikel: false
  text: |
    Noch einmal Wasser. Noch einmal aufs Klo. Noch einmal in den Arm. Noch eine
    Frage.

    Die übliche Erklärung lautet, das Kind sei fordernd geworden. Das trifft es
    nicht.

    Ein Kind, das nicht weiß, wann Schluss ist, muss es herausfinden. Es kann
    dich nicht fragen, wo die Grenze heute liegt. Es kann sie nur erfahren.

    Wenn der siebte Wunsch gestern erfüllt wurde, ist heute der siebte kein
    Grenzfall mehr, sondern normal. Der Test beginnt beim achten.

    So dehnt sich der Abend, ohne dass es irgendjemand will.

- id: kind-steht-abends-immer-auf-02
  artikel: kind-steht-abends-immer-auf
  titel: Zuerst die Schlafenszeit prüfen
  heikel: false
  text: |
    Der am häufigsten übersehene Grund fürs abendliche Aufstehen ist der
    einfachste.

    Ein Kind, das nach vierzig Minuten im Bett noch munter erzählt, singt oder
    spielt, ist meistens nicht ungehorsam. Es ist schlicht noch nicht müde.

    Die Schlafenszeit zwanzig bis dreißig Minuten nach hinten zu schieben klingt
    paradox und verkürzt den Abend häufig deutlich.

    Der zweite Grund ist zu viel Reiz davor. Nicht nur Bildschirme: Auch Toben,
    Besuch oder ein Streit kurz davor wirken nach. Ein Kind braucht ungefähr
    eine Stunde, um von hoher Erregung herunterzukommen.

- id: kind-steht-abends-immer-auf-03
  artikel: kind-steht-abends-immer-auf
  titel: Der Punkt ist die Langeweile
  heikel: false
  text: |
    Wenn dein Kind aufsteht: hingehen, nicht aus dem Wohnzimmer rufen.
    Zurückbegleiten, freundlich, an der Hand. Ein Satz, immer derselbe. „Es ist
    Schlafenszeit. Ich bin da.“ Und wieder rausgehen.

    Ohne neues Thema, ohne Erklärung, ohne Diskussion.

    Ein Kind, das beim Aufstehen nichts Neues bekommt, hört damit auf. Ein Kind,
    das ein Gespräch bekommt, macht weiter.

    Ignorieren ist dabei ausdrücklich nicht der Weg. Freundlich und wortarm ist
    etwas anderes als kalt.

- id: kind-steht-abends-immer-auf-04
  artikel: kind-steht-abends-immer-auf
  titel: Wenn Angst dahintersteckt
  heikel: false
  text: |
    Ein Kind, das sagt, es habe Angst, sagt oft die Wahrheit. Abendliche Ängste
    treten bei vielen Kindern ab etwa drei Jahren auf und sind normal.

    Der Umgang bleibt trotzdem derselbe: ernst nehmen, ohne den Abend neu zu
    öffnen.

    Was hilft: ein kleines Licht, das anbleibt. Ein Gegenstand, der Sicherheit
    gibt. Ein festes Wiederkommen in kurzen Abständen, angekündigt und
    eingehalten. Und tagsüber darüber reden, nicht nachts.

    Was nicht hilft: ein weiteres langes Gespräch im Dunkeln.

- id: kind-steht-abends-immer-auf-05
  artikel: kind-steht-abends-immer-auf
  titel: Zwei Kinder gleichzeitig geht selten gut
  heikel: false
  text: |
    Sie halten sich gegenseitig wach, und beide bekommen halbe Aufmerksamkeit.
    Das verlängert den Vorgang für alle.

    Was funktioniert, ist staffeln. Das Kind, das leichter einschläft, geht
    etwas später ins Bett. Oder das schwierigere bekommt zuerst zehn Minuten
    allein.

    Und: akzeptieren, dass es länger dauert. Ein Abend mit drei Kindern ist
    keine Version desselben Abends mit einem Kind. Er ist eine andere Aufgabe.

- id: abendroutine-die-haelt-01
  artikel: abendroutine-die-haelt
  titel: Eine Routine ist kein Zeitplan
  heikel: false
  text: |
    19:00 Abendessen. 19:20 Baden. 19:40 Buch. 20:00 Licht aus.

    An dem Abend, an dem der Kindergarten später aufhört, das Essen anbrennt
    oder ein Kind Fieber bekommt, ist der Plan hinfällig, und mit ihm die
    Routine.

    Eine Routine, die trägt, ist eine Reihenfolge.

    Ankündigung, Übergang, Ruhe, Abschluss, Begleitung. Immer in dieser Folge.

    Die Reihenfolge ist wichtiger als jede Uhrzeit, weil sie einem Kind sagt, wo
    es gerade ist. Deshalb funktioniert sie auch im Urlaub und bei Besuch.

- id: abendroutine-die-haelt-02
  artikel: abendroutine-die-haelt
  titel: Der Baustein, der in den meisten Familien fehlt
  heikel: false
  text: |
    Von den fünf Bausteinen ist einer wichtiger als alle anderen: der Abschluss.

    Ohne einen erkennbaren letzten Punkt bleibt der Abend offen. Und ein offener
    Abend wird gedehnt, weil ein Kind herausfinden muss, wo er endet.

    Ein guter Abschluss ist immer gleich, kommt nach allen Wünschen und nicht
    davor, ist auch für ein kleines Kind klar erkennbar, ist freundlich statt
    streng, und danach folgt nichts Neues mehr.

    Ein Kind, das diesen Punkt kennt, hört auf zu prüfen. Nicht weil es
    aufgegeben hat, sondern weil es die Antwort hat.

- id: abendroutine-die-haelt-03
  artikel: abendroutine-die-haelt
  titel: Die Stunde vor der Routine
  heikel: false
  text: |
    Die Routine beginnt vor der Routine.

    Ein Kind braucht ungefähr eine Stunde, um von hoher Erregung
    herunterzukommen. Was in dieser Stunde passiert, entscheidet mit darüber,
    wie der Abend läuft.

    Ungünstig sind Bildschirme, Toben, Besuch, aufregende Spiele, Streitthemen,
    große Gespräche.

    Günstig sind gedämpftes Licht, ruhige Beschäftigung, wenig Neues.

    Das ist kein Verbot von Spaß am Abend. Es ist eine Beobachtung darüber, was
    danach passiert.

- id: abendroutine-die-haelt-04
  artikel: abendroutine-die-haelt
  titel: Gemeinsamer Teil, getrennter Schluss
  heikel: false
  text: |
    Mit mehreren Kindern scheitern die meisten Ratschläge, weil sie stillschweigend
    von einem Kind ausgehen.

    Drei Varianten, die funktionieren.

    Nach Alter staffeln: Das jüngere Kind geht früher, das ältere bekommt danach
    seine Zeit. Für das ältere ist das kein Nachteil, sondern ein Privileg.

    Gemeinsamer Teil, getrennter Schluss: Zähne, Schlafanzug und das erste Buch
    zusammen, danach jedem fünf Minuten allein.

    Oder aufteilen, wenn zwei Erwachsene da sind. Wichtig ist nur, dass jeder
    Erwachsene in sich verlässlich ist.

- id: abendroutine-die-haelt-05
  artikel: abendroutine-die-haelt
  titel: Wenn die Routine plötzlich nicht mehr wirkt
  heikel: false
  text: |
    Meistens liegt es nicht an der Routine.

    Der häufigste Grund: Dein Kind ist aus seinem Rhythmus herausgewachsen. Der
    Schlafbedarf sinkt über die Jahre, und eine Schlafenszeit, die vor einem
    halben Jahr gepasst hat, ist heute zu früh. Das Symptom: Es liegt lange wach
    und ist dabei fröhlich.

    Oder der Mittagsschlaf hat sich verändert. Zu lang, zu spät oder ganz
    weggefallen: Alle drei verändern den Abend deutlich.

    Bevor du den Ablauf umbaust, prüf die Schlafenszeit. Sehr oft löst eine
    Verschiebung um zwanzig Minuten das Problem, für das man gerade eine neue
    Methode gesucht hätte.

- id: einschlafbegleitung-wie-lange-01
  artikel: einschlafbegleitung-wie-lange
  titel: Es gibt kein Alter, ab dem das aufhören müsste
  heikel: false
  text: |
    Kinder finden auf sehr unterschiedliche Weise in den Schlaf, und diese
    Unterschiede sind größer als die zwischen den Altersstufen. Manche brauchen
    ab dem zweiten Lebensjahr niemanden mehr, andere bis in die Grundschule
    jemanden im Zimmer.

    Beides ist normal.

    Die nützlichere Frage ist nicht, wie alt dein Kind ist, sondern ob euer
    Abend tragbar ist. Tragbar heißt: Er dauert absehbar lange, er lässt sich
    von mehr als einer Person übernehmen, und er lässt dir danach noch etwas vom
    Abend.

    Wenn diese drei Punkte stimmen, gibt es kein Problem.

- id: einschlafbegleitung-wie-lange-02
  artikel: einschlafbegleitung-wie-lange
  titel: Wie lange ein Abend dauern darf
  heikel: false
  text: |
    Unter zehn Minuten ist ungewöhnlich kurz und oft ein Zeichen für großen
    Schlafdruck. Zehn bis dreißig Minuten sind der übliche Bereich. Dreißig bis
    fünfundvierzig kommen vor, meist mit erkennbarem Grund.

    Über eine Stunde regelmäßig ist ein Hinweis, dass etwas im Ablauf nicht
    stimmt.

    Und dann liegt es fast nie an der Begleitung selbst.

- id: einschlafbegleitung-wie-lange-03
  artikel: einschlafbegleitung-wie-lange
  titel: Erst der Ablauf, dann die Anwesenheit
  heikel: false
  text: |
    Der häufigste Fehler ist, an der Begleitung zu arbeiten, bevor drei andere
    Dinge stimmen: Schlafenszeit, Reize in der letzten Stunde, ein klares Ende.

    Man versucht dann, sich langsam aus dem Zimmer zu bewegen, während das Kind
    gar nicht müde ist. Das funktioniert nicht, und danach ist die Enttäuschung
    größer als vorher.

    Wenn ein Kind mit echtem Schlafdruck, nach einer ruhigen Stunde und mit
    einem klaren Abschluss ins Bett geht, ist die Frage nach der Begleitung oft
    schon halb erledigt.

- id: einschlafbegleitung-wie-lange-04
  artikel: einschlafbegleitung-wie-lange
  titel: In Schritten, mit einer Woche dazwischen
  heikel: false
  text: |
    Wenn du es aktiv verändern willst, geht es klein.

    Nicht mehrere Dinge gleichzeitig: kein Kita-Start, kein Umzug, keine
    Krankheit in derselben Woche.

    Ein Schritt, dann eine Woche warten. Erst nicht mehr im Bett liegen, sondern
    daneben sitzen. Nach einer Woche etwas weiter weg. Nach einer Woche an der
    Tür.

    Ankündigen, was passiert. Und wiederkommen, wenn du gehst. Das ist der
    wichtigste Punkt: Ein Kind, das erlebt, dass jemand verlässlich zurückkommt,
    lässt schneller los als eines, bei dem das Weggehen endgültig war.

- id: einschlafbegleitung-macht-wuetend-01
  artikel: einschlafbegleitung-macht-wuetend
  titel: Fünf Gründe, und keiner davon bist du
  heikel: true
  freigegeben: false
  text: |
    Du bist festgesetzt. Für den Körper ist erzwungene Bewegungsunfähigkeit ein
    Stressreiz.

    Es ist unvorhersehbar. Zehn Minuten oder fünfzig. Ein festes Ende wäre
    leichter auszuhalten als ein offenes, selbst wenn es später läge.

    Es ist die letzte Aufgabe eines langen Tages.

    Du bist leer. Selbstbeherrschung verbraucht sich über den Tag.

    Und es gibt keine Rückmeldung. Du tust seit vierzig Minuten etwas, ohne zu
    sehen, ob es wirkt.

    Fünf Faktoren, und keiner davon hat mit deinem Kind zu tun.

- id: einschlafbegleitung-macht-wuetend-02
  artikel: einschlafbegleitung-macht-wuetend
  titel: Rausgehen ist besser als laut werden
  heikel: true
  freigegeben: false
  text: |
    Es gibt einen Punkt, an dem nichts mehr hilft, weil die Wut schon da ist.

    Für diesen Moment gilt eine einzige Regel.

    Ankündigen, dass du gleich wiederkommst. Dann rausgehen, kurz. Zwei Minuten
    vor der Tür, atmen, wiederkommen.

    Ein Kind kann zwei Minuten Warten verkraften. An einen lauten Satz im
    Dunkeln erinnert es sich länger.

    Und wenn es doch passiert ist, ist nichts kaputt. Der Schaden entsteht nicht
    durch den lauten Moment, sondern durch das, was danach fehlt.

- id: einschlafbegleitung-macht-wuetend-03
  artikel: einschlafbegleitung-macht-wuetend
  titel: Was im dunklen Zimmer tatsächlich hilft
  heikel: false
  text: |
    Die Bewegungsunfähigkeit lässt sich nicht auflösen, aber abmildern.

    Ein Hörbuch mit einem Ohrstöpsel. Beschäftigt, ohne das Zimmer zu erhellen.

    Bequem sitzen statt verkrampft. Ein Kissen an die Wand, nicht auf der
    Bettkante balancieren.

    Sich vorher hinsetzen und nichts mehr vorhaben. Der Ärger wächst besonders,
    wenn man innerlich schon woanders ist.

    Das Handy dagegen ist meist keine gute Lösung, weil das Licht viele Kinder
    wach hält und die halbe Anwesenheit den Vorgang oft verlängert.

- id: einschlafbegleitung-macht-wuetend-04
  artikel: einschlafbegleitung-macht-wuetend
  titel: Wenn es nur mit einer Person geht
  heikel: false
  text: |
    Das ist meist keine Ablehnung des anderen Elternteils, sondern eine erlernte
    Verknüpfung. Das Gehirn hat gespeichert, dass Einschlafen und diese eine
    Person zusammengehören.

    Verknüpfungen lassen sich verändern, aber nicht durch Verhandlung.

    Der zweite Elternteil bekommt einen eigenen Ablauf, nicht eine Kopie des
    ersten. Anderes Lied, andere Reihenfolge, anderes Ritual. Kinder gewöhnen
    sich an etwas Eigenes schneller als an eine schlechte Imitation.

    Und die erste Person bleibt außer Reichweite, nicht hörbar im Nebenzimmer.
    Das verlängert es nur.

- id: einschlafbegleitung-macht-wuetend-05
  artikel: einschlafbegleitung-macht-wuetend
  titel: Die Aufgabe, die leer aussieht
  heikel: false
  text: |
    Die Einschlafbegleitung ist eine der wenigen Aufgaben im Familienalltag, bei
    denen man nichts tun darf außer da sein.

    Kein Erledigen, kein Fortschritt, kein Ergebnis. Nur Anwesenheit.

    Für Menschen, die den ganzen Tag Dinge erledigen, ist genau das die
    schwerste Aufgabe des Tages. Nicht weil sie anstrengend wäre, sondern weil
    sie leer aussieht.

    Sie ist es nicht. Aber es ist völlig verständlich, dass sie sich so anfühlt.

- id: mittagsschlaf-wann-vorbei-01
  artikel: mittagsschlaf-wann-vorbei
  titel: Das sieht aus wie ein Erziehungsproblem und ist ein Rechenproblem
  heikel: false
  text: |
    Schlafdruck baut sich über die Zeit auf, in der ein Kind wach ist. Zwischen
    Aufwachen und Einschlafen muss genug davon liegen, sonst ist ein Kind
    schlicht nicht müde.

    Ein Dreijähriger, der bis 15:30 Uhr schläft und um 19:00 Uhr ins Bett soll,
    hat dreieinhalb Stunden Wachzeit. Nötig sind in dem Alter eher sechs.

    Das Ergebnis ist ein Kind, das eine Stunde lang fröhlich im Bett erzählt.

    In sehr vielen Familien, die abends kämpfen, liegt die Ursache nicht am
    Abend. Sie liegt sechs Stunden früher.

- id: mittagsschlaf-wann-vorbei-02
  artikel: mittagsschlaf-wann-vorbei
  titel: Drei Stellschrauben, bevor du ihn abschaffst
  heikel: false
  text: |
    Die Endzeit ist die wirksamste. Wenn der Mittagsschlaf nach 15 Uhr endet,
    wird der Abend bei den meisten Kindern schwierig. Sanft wecken ist dann
    besser, als jeden Abend eine Stunde zu kämpfen.

    Die Dauer: Über anderthalb Stunden ist bei Kindern über zwei oft zu viel.

    Die Startzeit: Ein zu früher Mittagsschlaf macht den Nachmittag zu lang.

    In dieser Reihenfolge ausprobieren, jeweils eine Woche, und immer nur eine
    Sache verändern. Sonst weißt du am Ende nicht, was gewirkt hat.

- id: mittagsschlaf-wann-vorbei-03
  artikel: mittagsschlaf-wann-vorbei
  titel: Das aussagekräftigste Zeichen
  heikel: false
  text: |
    Es gibt kein Alter, an dem der Mittagsschlaf enden müsste. Bei den meisten
    Kindern passiert es zwischen dem dritten und fünften Geburtstag, mit großen
    Unterschieden.

    Das verlässlichste Zeichen: An Tagen ohne Mittagsschlaf schläft dein Kind
    abends schnell und gut ein und bricht tagsüber nicht zusammen.

    Dann ist die Sache klar.

    Dazu passen: Das Einschlafen mittags dauert immer länger. Es schläft an
    manchen Tagen und an anderen nicht.

- id: mittagsschlaf-wann-vorbei-04
  artikel: mittagsschlaf-wann-vorbei
  titel: Ruhezeit statt Schlaf
  heikel: false
  text: |
    Der Übergang ist selten ein Schalter. Es gibt Wochen, in denen ein Kind an
    manchen Tagen schläft und an anderen nicht.

    Was in dieser Phase gut funktioniert: dreißig bis sechzig Minuten Ruhezeit,
    jeden Tag zur selben Zeit. Gedämpftes Licht, keine Anforderung, kein
    Bildschirm.

    Wenn dein Kind einschläft, schläft es. Wenn nicht, hat es trotzdem eine
    Pause gehabt.

    Der Nutzen ist größer, als es aussieht. Die Struktur des Tages bleibt, und
    der Erwachsene bekommt eine Pause, die in dieser Phase dringend gebraucht
    wird.

- id: mittagsschlaf-wann-vorbei-05
  artikel: mittagsschlaf-wann-vorbei
  titel: An schlaflosen Tagen den Abend vorziehen
  heikel: false
  text: |
    Das ist die wichtigste Maßnahme in der Übergangsphase, und sie wird fast
    immer vergessen.

    An Tagen ohne Mittagsschlaf dreißig bis sechzig Minuten früher ins Bett.

    Ein Kind, das um 17:30 Uhr zusammenbricht, gehört um 18:30 Uhr ins Bett,
    nicht um 20:00 Uhr.

    Und rechne mit Schwankungen über Wochen. Die Übergangsphase dauert bei den
    meisten Familien zwei bis sechs Wochen.

- id: kind-will-nur-mit-mama-einschlafen-01
  artikel: kind-will-nur-mit-mama-einschlafen
  titel: Es ist keine Ablehnung, es ist eine Verknüpfung
  heikel: false
  text: |
    Ein Kind schläft ausschließlich mit einer Person ein. Für die eine heißt
    das: kein freier Abend seit Monaten. Für die andere: das Gefühl, nicht
    gebraucht zu werden.

    Beides beruht auf einem Missverständnis.

    Das Gehirn eines kleinen Kindes speichert sehr zuverlässig, welche
    Bedingungen zum Einschlafen gehören. Ein bestimmtes Kuscheltier, ein
    bestimmtes Lied, eine bestimmte Position. Und eben auch: eine bestimmte
    Person.

    Diese Verknüpfung entsteht durch Wiederholung, nicht durch Präferenz. Und
    was durch Wiederholung entstanden ist, lässt sich durch Wiederholung
    verändern.

- id: kind-will-nur-mit-mama-einschlafen-02
  artikel: kind-will-nur-mit-mama-einschlafen
  titel: Keine Kopie, sondern etwas Eigenes
  heikel: false
  text: |
    Der zweite Elternteil sollte nicht den Ablauf des ersten nachmachen.

    Ein anderes Lied, ein anderes Ritual, eine andere Reihenfolge. Kinder
    gewöhnen sich an etwas Eigenes schneller als an eine schlechte Imitation.

    Dazu zwei Bedingungen. Nicht in einer Woche anfangen, in der ohnehin etwas
    umgestellt wird: kein Kita-Start, keine Krankheit, kein Urlaub.

    Und die erste Person bleibt außer Reichweite, nicht hörbar im Nebenzimmer.
    Das verlängert es nur.

    Mit den ersten Nächten rechnen. Sie werden lauter. Danach wird es meistens
    schnell ruhiger.
