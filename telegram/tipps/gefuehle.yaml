# Silo: Gefühle begleiten

- id: ko-regulation-01
  artikel: ko-regulation
  titel: Kinder lernen Ruhe nicht allein
  heikel: false
  text: |
    „Kinder müssen lernen, sich selbst zu beruhigen.“ Der Satz stimmt. Nur der
    Zeitpunkt ist falsch gedacht.

    Diese Fähigkeit kommt nicht dadurch, dass man ein Kind damit allein lässt,
    bis es sie irgendwann entwickelt.

    Ein kleines Kind orientiert sich an einem anderen Menschen. An deiner
    Stimme, deinem Tempo, deiner Atmung. Diese Signale sagen seinem
    Nervensystem: Hier ist keine Gefahr.

    Was ein Kind tausendfach von außen erlebt hat, wird irgendwann innen
    verfügbar. So lernt ein Mensch, sich selbst zu beruhigen: indem er lange
    genug mit jemandem beruhigt wurde.

- id: ko-regulation-02
  artikel: ko-regulation
  titel: Das große Missverständnis
  heikel: false
  text: |
    Ko-Regulation wird fast immer als Gegenteil von Führung dargestellt. Als das
    Weiche, das man macht statt Grenzen zu setzen.

    Das ist ein Missverständnis, und es kostet Eltern viel.

    Es heißt nicht, nachzugeben, damit dein Kind sich beruhigt. Es heißt, ruhig
    zu bleiben, während die Grenze steht.

    Ein Kind braucht in einem schwierigen Moment nicht, dass die Grenze
    verschwindet. Es braucht jemanden, der die Ruhe hat, die es selbst gerade
    nicht aufbringen kann.

- id: ko-regulation-03
  artikel: ko-regulation
  titel: Was im Wutanfall wirkt, ist nicht sprachlich
  heikel: false
  text: |
    In der Hochphase ist Reden wirkungslos. Auch „Was ist denn los?“. Das ist
    keine Trotzhaltung, das ist Biologie.

    Was wirkt: Runtergehen, körperlich, auf Augenhöhe. Langsamer werden,
    Bewegungen und Sprechtempo um die Hälfte drosseln. Leiser werden statt
    lauter. Kurze Sätze, zwei bis drei Worte: „Ich bin da.“ „Ich bleibe hier.“

    Und dann der Teil, der am meisten kostet: warten. Einen Wutanfall kann man
    nicht abkürzen. Man kann ihn nur begleiten oder verschlimmern.

- id: ko-regulation-04
  artikel: ko-regulation
  titel: Nähe anbieten, nicht aufdrängen
  heikel: false
  text: |
    Manche Kinder wollen im Sturm gehalten werden. Andere ertragen Berührung
    genau dann nicht.

    Beides ist normal, und keines davon ist ein Urteil über eure Beziehung.

    „Ich setze mich hierhin“ reicht. Damit bleibt die Nähe verfügbar, ohne dass
    dein Kind sie abwehren muss.

    Dazu gehört auch: dableiben, wenn dein Kind dich gerade wegschickt. Das
    Wegschicken ist Teil des Sturms, nicht seine Aussage.

- id: ko-regulation-05
  artikel: ko-regulation
  titel: Zuerst du, dann dein Kind
  heikel: false
  text: |
    Man kann niemanden zu einer Ruhe führen, die man selbst gerade nicht hat.

    Wenn dein eigenes System auf hundertachtzig ist, wenn du müde und wütend
    bist und dein Kind seit zwanzig Minuten schreit, ist Ko-Regulation in diesem
    Moment nicht verfügbar. Nicht weil du nicht willst, sondern weil man nicht
    geben kann, was man nicht hat.

    Dann ist deine erste Aufgabe nicht dein Kind. Sondern du.

    Ein paar lange Ausatmungen. Kurz ans Fenster. Ein Schluck Wasser. Zwanzig
    Sekunden reichen oft.

    Das ist kein Ausweichen. Es ist die Reihenfolge, die funktioniert.

- id: ko-regulation-06
  artikel: ko-regulation
  titel: Das Geländer
  heikel: false
  text: |
    Wenn du dir ein Bild merken willst, dann dieses.

    Ein Geländer an einer Treppe. Dein Kind wird diese Treppe eines Tages ganz
    allein hinaufgehen. Aber bis dahin braucht es das Geländer. Nicht weil es
    schwach wäre, sondern weil es noch wächst.

    Du bist für eine Zeit lang die Regulation deines Kindes, bis es seine eigene
    gebaut hat.

    Und dann passiert nach und nach etwas: Es braucht dich immer weniger dafür.

- id: kind-beruhigt-sich-nicht-01
  artikel: kind-beruhigt-sich-nicht
  titel: Wutanfall oder Überlastung?
  heikel: false
  text: |
    Das sind zwei verschiedene Zustände, und die Unterscheidung erklärt sehr
    viel.

    Ein Wutanfall hat einen Auslöser, den man benennen kann, und eine Forderung
    dahinter. Er wäre theoretisch durch Nachgeben zu beenden.

    Eine Überlastung ist etwas anderes. Der Auslöser ist winzig oder gar nicht
    erkennbar. Es gibt keine Forderung. Nachgeben ändert nichts, weil es nichts
    gibt, dem man nachgeben könnte. Und sie dauert länger.

    Wer eine Überlastung wie einen Wutanfall behandelt, sucht nach dem, was das
    Kind will. Es will nichts. Es kann nur gerade nicht mehr.

- id: kind-beruhigt-sich-nicht-02
  artikel: kind-beruhigt-sich-nicht
  titel: Weniger tun ist fast immer richtiger
  heikel: false
  text: |
    Es gibt einen verbreiteten Reflex, wenn nichts hilft: mehr versuchen.

    Man hat es mit Nähe probiert, jetzt probiert man Abstand. Man hat es mit
    Reden probiert, jetzt mit Singen. Dann Ablenkung. Dann das Angebot,
    rauszugehen.

    Jeder dieser Versuche ist gut gemeint und wirkt in der Situation wie ein
    neuer Reiz. Ein überlastetes System wird durch zusätzliche Eingänge nicht
    ruhiger.

    Also: Licht dämpfen. Musik aus. Aufhören zu reden. Nichts mehr anbieten,
    auch kein Wasser, denn ein Angebot verlangt eine Entscheidung.

- id: kind-beruhigt-sich-nicht-03
  artikel: kind-beruhigt-sich-nicht
  titel: Dableiben, mit Abstand
  heikel: false
  text: |
    Der Unterschied zwischen Weggehen und Abstandhalten ist entscheidend.

    Im Raum sein. Nicht bedrängen, nicht anfassen, sichtbar bleiben.

    Und dann warten. Das ist der schwerste Teil. Die Erregung sinkt von selbst,
    weil sie sich körperlich nicht unbegrenzt halten lässt. Nicht weil du das
    Richtige gefunden hast.

    Es gibt Zustände, aus denen man ein Kind nicht herausholen kann. Man kann
    nur dabei sein, während sie vorbeigehen. Das ist keine kleine Sache.

- id: kind-beruhigt-sich-nicht-04
  artikel: kind-beruhigt-sich-nicht
  titel: Wann es in eine Untersuchung gehört
  heikel: true
  freigegeben: false
  text: |
    Manches gehört nicht in einen Ratgebertext, sondern zur Kinderärztin. Ein
    Gespräch ist sinnvoll, wenn Zusammenbrüche regelmäßig deutlich länger als
    zwanzig Minuten dauern, wenn sie über Monate mehrmals pro Woche auftreten,
    wenn dein Kind sich dabei selbst verletzt oder sich von niemandem beruhigen
    lässt, auch nicht im Abklingen.

    Nichts davon bedeutet automatisch eine Diagnose.

    Aber es gibt Ursachen, die man kennen und gut behandeln kann, und je früher
    sie bekannt sind, desto einfacher ist der Alltag für alle.

- id: wutanfall-begleiten-01
  artikel: wutanfall-begleiten
  titel: Ein Wutanfall ist kein Verhalten
  heikel: false
  text: |
    Er ist ein Zustand, in den ein Kind gerät, kein Verhalten, das es wählt.

    Bei hoher Erregung sind die Teile des Gehirns, die für Sprache, Einsicht und
    Selbstbeherrschung zuständig sind, nicht erreichbar. Nicht blockiert aus
    Trotz, sondern schlicht überlagert.

    Das erklärt dreierlei. Erklärungen werden nicht abgelehnt, sie werden gar
    nicht verarbeitet. „Was ist denn los?“ verlangt eine Leistung, die gerade
    nicht verfügbar ist. Und wenn die Erregung sinkt, kommt dein Kind oft
    schlagartig zurück.

- id: wutanfall-begleiten-02
  artikel: wutanfall-begleiten
  titel: Die Kurve kennen
  heikel: false
  text: |
    Fast jeder Wutanfall folgt derselben Kurve, und jede Phase braucht etwas
    anderes.

    Anstieg: Quengeln, Anspannung. Jetzt hilft noch Benennen, Ablenken, Nähe.

    Hochphase: Schreien, kein Kontakt möglich. Wenig sagen, dableiben.

    Abklingen: Das Weinen wird weicher, dein Kind sucht Blickkontakt. Nähe
    anbieten, immer noch wenig reden.

    Erst danach reden, und kurz.

    Der häufigste Fehler ist, in der Hochphase das zu tun, was in Phase eins
    geholfen hätte.

- id: wutanfall-begleiten-03
  artikel: wutanfall-begleiten
  titel: „Geh weg“ heißt selten „lass mich allein“
  heikel: false
  text: |
    Bei kleinen Kindern heißt es fast immer etwas anderes: Ich halte gerade
    nichts aus.

    Der Unterschied liegt darin, in der Nähe zu bleiben, ohne zu bedrängen.

    Dazu ein Satz, höchstens zwei: „Du bist wütend. Ich bleibe da.“

    Und nichts erwarten. Keine Reaktion, keine Einsicht, keinen Erfolg. Die
    Hochphase geht vorbei, weil Erregung nicht unbegrenzt anhält, nicht weil du
    das Richtige gesagt hast.

- id: wutanfall-begleiten-04
  artikel: wutanfall-begleiten
  titel: Geh körperlich runter
  heikel: false
  text: |
    Ein Erwachsener, der über einem schreienden Kind steht, verstärkt allein
    durch die Position den Druck.

    Auf den Boden, auf Augenhöhe. Langsamer werden, Bewegungen und Sprache.
    Hektik ist ansteckend.

    Und leiser werden statt lauter. Dein Kind orientiert sich an deinem Zustand,
    bevor es sich an sich selbst orientieren kann. Steigt deine Erregung, steigt
    seine mit. Sinkt deine, folgt seine irgendwann nach.

- id: gefuehle-benennen-01
  artikel: gefuehle-benennen
  titel: Der Ratschlag ist richtig. Der Zeitpunkt meistens falsch.
  heikel: false
  text: |
    „Benenne die Gefühle deines Kindes.“ Steht in jedem Ratgeber, stimmt auch,
    und wird so oft zur falschen Zeit angewendet, dass viele Eltern denken, es
    funktioniere nicht.

    In der Hochphase eines starken Gefühls sind die Teile des Gehirns, die
    Sprache verarbeiten, nicht erreichbar. Ein Kind, das schreiend auf dem Boden
    liegt, hört „Du bist gerade wütend“ nicht als Verständnis. Es hört gar
    nichts.

    Deshalb verschlimmert das Benennen die Lage dort tatsächlich: Es ist ein
    zusätzlicher Reiz in einem überlasteten System.

- id: gefuehle-benennen-02
  artikel: gefuehle-benennen
  titel: Die drei Zeitpunkte, die funktionieren
  heikel: false
  text: |
    Davor, wenn ein Gefühl aufzieht: „Das ärgert dich gerade.“ Dein Kind ist
    noch ansprechbar.

    Danach, wenn Ruhe eingekehrt ist: „Du warst richtig wütend vorhin.“ Jetzt
    kann es die Erfahrung einordnen.

    Und bei anderen, im Alltag: „Schau, der Junge ist traurig.“ Ohne eigene
    Betroffenheit lässt sich viel unbefangener hinschauen.

    Der mittlere Punkt ist der wertvollste und wird am häufigsten ausgelassen.
    Nach einem Sturm entstehen in zwei Sätzen mehr Lernen als in zwanzig Minuten
    Erklärung mittendrin.

- id: gefuehle-benennen-03
  artikel: gefuehle-benennen
  titel: Vier bis sechs Wörter reichen
  heikel: false
  text: |
    Der häufigste Fehler in der Formulierung ist, zu viel zu sagen.

    „Du bist enttäuscht.“ Nicht: „Ich sehe, dass du gerade enttäuscht bist, weil
    du gehofft hattest, dass wir noch bleiben, und das kann ich total
    verstehen.“

    Als Feststellung, nicht als Frage. „Das hat dich erschreckt“ wirkt besser
    als „Hat dich das erschreckt?“

    Beiläufig, nicht als feierlicher Moment.

    Und ohne Nachsatz. Kein aber, keine Lehre. Das Benennen darf für sich
    stehen.

- id: gefuehle-benennen-04
  artikel: gefuehle-benennen
  titel: Wenn dein Kind widerspricht
  heikel: false
  text: |
    „Du bist traurig.“ „Nein! Ich bin wütend!“

    Das ist ein gutes Zeichen. Wenn ein Kind korrigiert, hat es gerade eine
    feinere Unterscheidung getroffen als du. Genau das war das Ziel.

    Was hilft: die Korrektur annehmen. „Ah, wütend. Verstehe.“

    Was nicht hilft: beharren. „Doch, du bist auch ein bisschen traurig.“ Damit
    lernt ein Kind, dass sein eigenes Erleben nicht zählt.

- id: gefuehle-benennen-05
  artikel: gefuehle-benennen
  titel: Kinder lernen Gefühlswörter an uns
  heikel: false
  text: |
    Das ist der Punkt, der in Ratgebern selten vorkommt und der am meisten
    bringt.

    „Ich bin gerade genervt. Das hat nichts mit dir zu tun, ich brauche kurz
    Ruhe.“ „Ich war heute traurig, weil eine Freundin abgesagt hat.“

    Das belastet ein Kind nicht, solange es klein dosiert ist und du selbst
    damit umgehst. Im Gegenteil: Es zeigt, dass Gefühle normal sind, Namen haben
    und vorbeigehen.

    Wichtig ist nur die Grenze. Dein Kind darf wissen, dass du müde oder
    ärgerlich bist. Es soll nicht zuständig dafür sein.

- id: gefuehle-benennen-06
  artikel: gefuehle-benennen
  titel: Fang mit fünf Wörtern an
  heikel: false
  text: |
    Nicht mit fünfzehn Begriffen. Fünf reichen, und es sollten die häufigsten
    sein: wütend, traurig, erschrocken, froh, enttäuscht.

    Der letzte ist besonders nützlich, weil er im Alltag ständig vorkommt und
    weil er etwas anderes meint als Wut oder Traurigkeit. Ein Kind, das seine
    Enttäuschung benennen kann, kommt oft ganz ohne Zusammenbruch aus.

    Erst wenn diese fünf sitzen, lohnen sich feinere Unterscheidungen:
    eifersüchtig, überfordert, aufgeregt, einsam.

- id: selbstregulation-kind-01
  artikel: selbstregulation-kind
  titel: Er ist kein schwieriges Kind. Er ist ein zweijähriges Kind.
  heikel: false
  text: |
    Warten. Nicht hauen. Aufhören, wenn es Zeit ist. Sich wieder beruhigen.

    All das gehört zu einer einzigen Fähigkeit: Selbstregulation. Sie besteht
    aus Impulskontrolle, dem Aushalten von Gefühlen, Aufmerksamkeit,
    Frustrationstoleranz und dem Herunterkommen nach einem Sturm.

    Diese fünf hängen alle an demselben Teil des Gehirns, der bei einem kleinen
    Kind noch weitgehend im Bau ist und über viele Jahre reift.

    Die meisten Konflikte im Familienalltag entstehen genau dort: wo ein Kind
    etwas leisten soll, das es schlicht noch nicht kann.

- id: selbstregulation-kind-02
  artikel: selbstregulation-kind
  titel: Der Irrtum vom Alleinlernen
  heikel: true
  freigegeben: false
  text: |
    Eine Vorstellung hält sich hartnäckig: Ein Kind lerne, sich selbst zu
    beruhigen, wenn man es damit allein lässt.

    So funktioniert es nicht.

    Ein kleines Kind, das allein mit einem starken Gefühl bleibt, hört
    irgendwann auf, weil die Erregung von selbst nachlässt oder weil es
    aufgibt. Beides ist kein Lernvorgang.

    Man lernt, sich selbst zu beruhigen, indem man lange genug mit jemandem
    beruhigt wurde.

- id: selbstregulation-kind-03
  artikel: selbstregulation-kind
  titel: Verlässliche Abläufe fördern mehr als jedes Gefühlsspiel
  heikel: false
  text: |
    Ein Kind, das nicht weiß, was als Nächstes kommt, ist ständig in leichter
    Alarmbereitschaft.

    Diese Wachsamkeit kostet Energie, und zwar genau die Energie, die für
    Selbstbeherrschung gebraucht würde.

    Kinder in verlässlichen Verhältnissen tragen offenbar sogar eine niedrigere
    Grundanspannung durch ihren Alltag. Nicht weniger Stress in einzelnen
    Momenten, sondern weniger Grundbelastung insgesamt.

    Praktisch heißt das: Ein fester Ablauf am Abend bringt mehr als jede Übung
    mit Gefühlskarten.

- id: selbstregulation-kind-04
  artikel: selbstregulation-kind
  titel: Zumutbarer Frust
  heikel: false
  text: |
    Frustrationstoleranz kann man nicht erklären. Man kann sie nur üben, und
    dafür braucht ein Kind Situationen, in denen etwas nicht sofort klappt.

    Der Turm fällt um. Das Puzzleteil passt nicht. Es muss warten, bis das
    Geschwisterkind fertig ist.

    Der Reflex vieler Eltern ist, das schnell zu beheben. Verständlich, und es
    nimmt dem Kind die Übung weg.

    Die Kunst liegt in der Dosierung: klein genug, dass es zu schaffen ist, groß
    genug, dass es etwas kostet. Und du bleibst dabei, statt es abzunehmen.

- id: selbstregulation-kind-05
  artikel: selbstregulation-kind
  titel: Woran du erkennst, dass es besser wird
  heikel: false
  text: |
    Selbstregulation entwickelt sich nicht geradlinig. Es gibt gute Wochen und
    Rückschritte, besonders bei Entwicklungssprüngen, Krankheit oder einem
    Kita-Wechsel.

    Die Fortschritte sind subtil. Die Wutanfälle werden kürzer, nicht sofort
    seltener. Dein Kind lässt sich schneller trösten. Es sagt hinterher, was los
    war. Es kündigt ein Gefühl an, statt sofort zu explodieren. Es hält kleine
    Wartezeiten aus, die vorher unmöglich waren.

    Das dauert Monate, nicht Tage.

- id: frustrationstoleranz-kind-01
  artikel: frustrationstoleranz-kind
  titel: Angestrengt oder überfordert?
  heikel: false
  text: |
    An dieser Beobachtung erkennst du, ob du dabeibleiben oder helfen solltest.

    Angestrengt heißt: Dein Kind ärgert sich, probiert weiter, schimpft
    vielleicht, bleibt aber in der Sache.

    Überfordert heißt: Es bricht ab, weint anhaltend, ist nicht mehr
    ansprechbar.

    Bei Angestrengtheit bleibst du dabei. Bei Überforderung hilfst du.

    Klein genug, dass es zu schaffen ist. Groß genug, dass es etwas kostet.
    Dazwischen liegt die Zone, in der etwas wächst.

- id: frustrationstoleranz-kind-02
  artikel: frustrationstoleranz-kind
  titel: Drei Reaktionen, nur eine baut etwas auf
  heikel: false
  text: |
    Wenn ein Kind an etwas scheitert, gibt es drei Möglichkeiten.

    Abnehmen: Ich mache es für dich. Der Frust ist weg, die Übung auch.

    Allein lassen: Streng dich an, du schaffst das schon. Der Frust bleibt, die
    Unterstützung fehlt.

    Dabeibleiben: Ich bleibe hier, ich helfe nicht, aber ich gehe auch nicht
    weg.

    Nur die dritte baut etwas auf. Sicherheit heißt nicht, dass ein Kind niemals
    Frust erlebt. Sicherheit heißt, dass es Frust erleben darf, ohne damit
    allein zu sein.

- id: frustrationstoleranz-kind-03
  artikel: frustrationstoleranz-kind
  titel: Warum es nachmittags an einer Kleinigkeit kippt
  heikel: false
  text: |
    Frustrationstoleranz hängt an derselben Reserve wie jede Selbstbeherrschung.
    Ein müdes Kind hat sie nicht.

    Deshalb bricht ein Kind nachmittags an etwas zusammen, das es morgens
    mühelos verkraftet hätte.

    Das ist kein Rückschritt und kein schlechter Tag im Sinne von Erziehung. Das
    ist der Stand des Akkus.

- id: frustrationstoleranz-kind-04
  artikel: frustrationstoleranz-kind
  titel: Der Frust wird nicht weniger, er wandert
  heikel: false
  text: |
    Ein Kind sitzt vor einem umgefallenen Turm. Der schnellste Weg zurück zur
    Ruhe ist, ihn wieder aufzubauen. Also tut man es.

    Das Problem daran ist nicht die Freundlichkeit. Es ist, dass genau dort die
    Übung gewesen wäre.

    Und das Erstaunliche: Der Frust wird dadurch nicht weniger. Er verschiebt
    sich nur auf immer kleinere Anlässe, weil die Schwelle nicht wächst.

- id: wutanfall-in-der-oeffentlichkeit-01
  artikel: wutanfall-in-der-oeffentlichkeit
  titel: Für dein Kind ist nichts anders
  heikel: false
  text: |
    Ein Wutanfall im Supermarkt ist derselbe wie zu Hause. Dieselbe Kurve,
    dieselbe Dauer. Die Blicke der anderen nimmt dein Kind gar nicht wahr, es
    ist vollständig mit sich beschäftigt.

    Anders ist es für dich. Du bist unter Beobachtung, du fühlst dich beurteilt,
    und du willst, dass es jetzt aufhört.

    Dieser letzte Punkt ist der entscheidende. Wer will, dass es sofort aufhört,
    tut eines von zwei Dingen: Er wird lauter, oder er gibt nach. Beides
    verlängert die Sache, das eine sofort, das andere beim nächsten Mal.

- id: wutanfall-in-der-oeffentlichkeit-02
  artikel: wutanfall-in-der-oeffentlichkeit
  titel: Der Einkaufswagen darf stehen bleiben
  heikel: false
  text: |
    Das fühlt sich falsch an und ist die richtige Entscheidung.

    Ein abgebrochener Einkauf kostet zwanzig Minuten. Eine eskalierte Situation
    kostet den ganzen Nachmittag.

    Weniger Reize lassen die Erregung schneller sinken, und der Supermarkt ist
    reizintensiv: Licht, Geräusche, Menschen, Farben.

    Also: runtergehen auf Augenhöhe, wenig sagen, und wenn möglich den Ort
    wechseln.

- id: wutanfall-in-der-oeffentlichkeit-03
  artikel: wutanfall-in-der-oeffentlichkeit
  titel: Lenk deine eigene Aufmerksamkeit um
  heikel: false
  text: |
    Nicht die deines Kindes. Deine.

    Wenn du merkst, dass du auf die Umstehenden achtest, ist deine
    Aufmerksamkeit am falschen Ort. Dein Kind spürt das, weil du dann anders
    reagierst als sonst.

    Was hilft, ist eine bewusste Entscheidung: Für die nächsten fünf Minuten
    existiert nur mein Kind.

    Das klingt esoterisch und ist praktisch. Wer aufhört, sich selbst zu
    beobachten, wird ruhiger.

    Und auf Kommentare antwortest du am besten gar nicht. Wenn es sein muss, ein
    Satz: „Danke, wir kommen zurecht.“

- id: wutanfall-in-der-oeffentlichkeit-04
  artikel: wutanfall-in-der-oeffentlichkeit
  titel: Was vor der Tür entschieden wurde
  heikel: false
  text: |
    Die meisten Zusammenbrüche im Supermarkt sind vorhersehbar, und das ist die
    gute Nachricht.

    Nicht hungrig einkaufen, das ist der häufigste einzelne Auslöser. Nicht am
    Ende eines langen Tages. Kurz halten, nach zwanzig Minuten wird es bei den
    meisten schwierig.

    Und eine Aufgabe geben: etwas suchen, etwas tragen, das Obst aussuchen. Ein
    Kind, das im Wagen sitzt und zusieht, ist unterbeschäftigt und reizüberflutet
    zugleich.

    Der wichtigste Punkt aber ist: Was vor der Tür entschieden wurde, muss im
    Regal nicht verhandelt werden.

- id: wann-wutanfall-nicht-normal-01
  artikel: wann-wutanfall-nicht-normal
  titel: Was bei Wutanfällen im üblichen Rahmen liegt
  heikel: true
  freigegeben: false
  text: |
    Die meisten Anfälle liegen zwischen anderthalb und vier Jahren, mit einem
    Höhepunkt bei zwei bis drei. Mehrere pro Woche sind üblich, in schwierigen
    Phasen täglich. Zwei bis fünfzehn Minuten Dauer. Ab etwa vier Jahren nimmt
    es deutlich ab.

    Innerhalb dieses Rahmens gibt es enorme Unterschiede. Ein Kind am oberen
    Rand ist nicht auffällig, sondern am oberen Rand.

    Zwei Dinge verschieben das Bild vorübergehend, ohne dass etwas nicht stimmt:
    Müdigkeit und Veränderungen. Nach einem Umzug oder in der Eingewöhnung ist
    ein Kind wochenlang dünnhäutiger. Das ist eine Reaktion, kein Signal.

- id: wann-wutanfall-nicht-normal-02
  artikel: wann-wutanfall-nicht-normal
  titel: Der wichtigste einzelne Hinweis
  heikel: true
  freigegeben: false
  text: |
    Wenn die Anfälle mit dem Alter zunehmen statt abzunehmen.

    Nach dem vierten Geburtstag sollte die Kurve nach unten zeigen. Tut sie das
    über Monate nicht, lohnt sich ein Gespräch mit der Kinderärztin.

    Dasselbe gilt, wenn sie regelmäßig deutlich länger als zwanzig Minuten
    dauern, wenn dein Kind sich dabei gezielt verletzt oder sich von niemandem
    beruhigen lässt, auch nicht im Abklingen.

    Ein Termin ist keine Diagnose und keine Vorentscheidung. Er ist eine Frage.

- id: wann-wutanfall-nicht-normal-03
  artikel: wann-wutanfall-nicht-normal
  titel: Drei Dinge, die zuerst geprüft gehören
  heikel: true
  freigegeben: false
  text: |
    Bevor man an etwas Größeres denkt, stecken sehr oft drei gut behandelbare
    Dinge dahinter.

    Schlaf. Bei Schlafmangel bricht die Selbstregulation als Erstes zusammen.
    Viele Kinder, die als schwierig gelten, sind schlicht chronisch übermüdet.

    Hören. Ein Kind, das schlecht hört, wirkt unaufmerksam und wird häufiger
    frustriert. Wiederholte Mittelohrentzündungen sind ein typischer
    Hintergrund.

    Sprache. Wer sich nicht ausdrücken kann, hat mehr Zusammenbrüche. Das ist
    oft nicht ein Nebenaspekt, sondern die Hauptursache.

- id: wann-wutanfall-nicht-normal-04
  artikel: wann-wutanfall-nicht-normal
  titel: Zwei Wochen Protokoll
  heikel: false
  text: |
    Wenn du unsicher bist, ob etwas nicht stimmt, lohnt sich eine einfache
    Aufzeichnung.

    Für jeden Zusammenbruch: Datum, Uhrzeit, Dauer, was vorher war, wie er
    endete. Zwei Wochen reichen.

    Das Ergebnis überrascht die meisten Eltern. Sehr oft zeigt sich ein Muster,
    das im Alltag unsichtbar war. Immer nach der Kita. Immer vor dem Essen.
    Immer an den Tagen ohne Mittagsschlaf.

    Manchmal löst sich das Problem allein dadurch.

- id: enttaeuschung-aushalten-01
  artikel: enttaeuschung-aushalten
  titel: Warum „nächste Woche“ kein Trost ist
  heikel: false
  text: |
    Ein Erwachsener, dem etwas abgesagt wird, hat sofort einen Gedanken parat:
    nächste Woche.

    Diesen Gedanken hat ein vierjähriges Kind nicht. Zukunft ist für kleine
    Kinder kein verlässlicher Ort, sondern eine Behauptung von jemandem.

    Deshalb heißt ausgefallen im kindlichen Erleben zunächst weg. Und auf weg
    reagiert man anders als auf verschoben.

    Das ändert sich mit der Zeit von selbst, und zwar in dem Maß, in dem ein
    Kind erlebt, dass Angekündigtes tatsächlich stattfindet.

- id: enttaeuschung-aushalten-02
  artikel: enttaeuschung-aushalten
  titel: Erst die Nachricht, dann das Gefühl, dann der Ersatz
  heikel: false
  text: |
    Die Reihenfolge entscheidet mehr als die Formulierung.

    Erst die Nachricht, klar und ohne Vorrede: „Das Schwimmbad hat heute zu. Wir
    fahren nicht.“

    Dann das Gefühl: „Du hast dich den ganzen Tag darauf gefreut. Das ist
    richtig blöd.“ Und dann nichts. Nicht sofort weiterreden.

    Erst danach die Perspektive: „Am Samstag ist wieder auf.“

    Wer mit dem dritten Schritt anfängt, verliert das Kind. In dem Moment ist
    Samstag keine Information, sondern ein Ablenkungsversuch.

- id: enttaeuschung-aushalten-03
  artikel: enttaeuschung-aushalten
  titel: Die Entschuldigungsfalle
  heikel: false
  text: |
    Viele Eltern entschuldigen sich, wenn etwas ausfällt, auch wenn sie nichts
    dafür können.

    „Es tut mir so leid, ich weiß, du hattest dich so gefreut.“

    Das klingt einfühlsam und hat einen Haken: Wer sich entschuldigt, macht sich
    zur Ursache. Und wenn du die Ursache bist, kannst du es auch ändern. Damit
    ist eine Verhandlung eröffnet.

    Bedauern ohne Schuld klingt anders: „Ich hätte auch gern gebadet. Blöd, dass
    es heute nicht geht.“

- id: enttaeuschung-aushalten-04
  artikel: enttaeuschung-aushalten
  titel: Wenn du die Ursache bist
  heikel: false
  text: |
    Manchmal bist du es tatsächlich. Du hast etwas vergessen, falsch geplant
    oder zugesagt, was nicht ging.

    Dann gehört genau das gesagt, und zwar ohne Rechtfertigung.

    „Ich habe vergessen, die Karten zu kaufen. Das war mein Fehler, und deshalb
    geht es heute nicht.“

    Kinder verkraften das erstaunlich gut. Was sie schlecht verkraften, ist eine
    Erklärung, in der niemand verantwortlich ist, obwohl jemand es war.

- id: neid-bei-kindern-01
  artikel: neid-bei-kindern
  titel: Neid fragt selten nach dem Gegenstand
  heikel: false
  text: |
    Ein Kind, das ein Trampolin will, will meistens nicht das Trampolin.

    Es will wissen, ob es dieselbe Stellung hat wie das Kind, das eines hat. Ob
    es genauso viel wert ist. Ob bei ihm zu Hause auch an es gedacht wird.

    Deshalb funktioniert die Antwort auf den Gegenstand so schlecht. Ein Kind,
    das ein Trampolin bekommt, hat zwei Wochen später eine neue Liste.

    Und deshalb funktioniert die Antwort auf die Frage dahinter so gut, obwohl
    sie nichts kostet.

- id: neid-bei-kindern-02
  artikel: neid-bei-kindern
  titel: Warum Ausgleichen es schlimmer macht
  heikel: false
  text: |
    Der naheliegende Reflex ist, Ungleichheit zu beseitigen. Das
    Geschwisterkind bekommt auch etwas. Es wird nachgekauft.

    Das entschärft den Moment und bestätigt die Rechnung: Gleichheit ist der
    Maßstab, und Ungleichheit ist ein Fehler, der behoben gehört.

    Danach wird jede Abweichung zum Anlass, und Abweichungen gibt es täglich.
    Die Liste wird länger, nicht kürzer.

    Zwei Sätze reichen meistens: „Du hättest auch gern eins. Das ist blöd.“ Und:
    „Wir kaufen keins. Und ich weiß, was du dir wünschst.“

- id: neid-bei-kindern-03
  artikel: neid-bei-kindern
  titel: Die Wunschliste
  heikel: false
  text: |
    Ein Zettel, auf dem Wünsche aufgeschrieben werden. Nicht diskutiert, nicht
    bewertet, nur notiert. Zum Geburtstag und zu Weihnachten wird die Liste
    angeschaut.

    Das leistet drei Dinge auf einmal. Der Wunsch ist ernst genommen. Er ist aus
    dem Moment heraus. Und dein Kind sieht mit der Zeit selbst, welche Wünsche
    geblieben sind und welche nach zwei Wochen keine mehr waren.

    Der dritte Punkt ist der wertvollste, weil dein Kind ihn selbst entdeckt.

- id: scham-bei-kindern-01
  artikel: scham-bei-kindern
  titel: Wenn dein Kind frech wird, während du hinsiehst
  heikel: false
  text: |
    Ein Kind kippt das Glas um. Jemand sagt „Mensch, pass doch auf.“ Und das
    Kind wird laut, wirft die Gabel hin und schreit, dass es das Essen sowieso
    nicht mag.

    Von außen sieht das nach Frechheit aus. Es ist Scham.

    Wut bewegt sich auf dich zu, sie fordert, sie sucht Blickkontakt. Scham
    bewegt sich von dir weg. Und wenn ein Kind nicht weg kann, greift es an,
    denn Angriff ist der schnellste Weg, den Blick von sich wegzulenken.

    Die nützlichste Faustregel: Wenn ein Kind heftiger reagiert, je genauer du
    hinsiehst, ist es fast immer Scham.

- id: scham-bei-kindern-02
  artikel: scham-bei-kindern
  titel: Schuld sagt „ich habe“, Scham sagt „ich bin“
  heikel: false
  text: |
    Die beiden werden oft in einen Topf geworfen und sind sehr verschieden.

    Schuld sagt: Ich habe etwas Falsches getan. Sie ist unangenehm und führt zu
    etwas. Entschuldigen, aufräumen, wiedergutmachen.

    Scham sagt: Ich bin falsch. Daraus folgt nichts Konstruktives, denn man kann
    die eigene Person nicht aufräumen. Es bleiben zwei Wege: verstecken oder
    angreifen.

    Deshalb ist es keine Kleinigkeit, ob ein Satz die Handlung oder das Kind
    meint. „Der Teller ist runtergefallen“ gegenüber „Du bist so ein
    Tollpatsch“.

- id: scham-bei-kindern-03
  artikel: scham-bei-kindern
  titel: Nimm das Publikum weg, nicht das Kind
  heikel: false
  text: |
    Scham entsteht selten aus der Sache selbst. Sie entsteht daraus, dass jemand
    zusieht.

    Deshalb hilft im Moment vor allem eins: Zuschauer entfernen. Aus dem Raum
    gehen, den Tisch verlassen, das Gespräch verschieben.

    Dazu Nähe ohne Blick. Sich danebensetzen, statt sich gegenüberzustellen.
    Nebeneinander ist bei Scham deutlich erträglicher.

    Und nichts erklären. Ein Kind in Scham kann keine Erklärung aufnehmen. Jeder
    Satz über die Sache verlängert den Moment.

- id: scham-bei-kindern-04
  artikel: scham-bei-kindern
  titel: Der Satz danach
  heikel: false
  text: |
    Später, wenn dein Kind wieder ansprechbar ist, reicht meist ein Satz.

    „Vorhin war dir das unangenehm. Mir passiert das auch, und dann will ich am
    liebsten weg.“

    Zwei Dinge stecken darin. Das Gefühl bekommt einen Namen, und es bekommt
    Gesellschaft.

    Der zweite Teil wirkt stärker, als er klingt. Scham lebt davon, dass man
    sich für den Einzigen hält. Ein Erwachsener, der zugibt, dass er das kennt,
    nimmt genau diese Voraussetzung weg.

- id: stolz-bei-kindern-01
  artikel: stolz-bei-kindern
  titel: „Jetzt gib mal nicht so an“
  heikel: false
  text: |
    Der Satz rutscht schnell heraus, er ist gut gemeint, und er trifft etwas,
    das gerade gebraucht wird.

    Stolz und Scham tauchen zur selben Zeit auf, ungefähr ab dem zweiten
    Geburtstag, und sie setzen dasselbe voraus: Ein Kind erlebt sich als
    jemanden, der von außen betrachtet wird.

    Scham sagt: Ich bin gerade nicht in Ordnung. Stolz sagt: Ich bin gerade
    genau richtig.

    Ein Kind, das nur die erste Hälfte kennt, hat ein Selbstbild mit nur einer
    Richtung.

- id: stolz-bei-kindern-02
  artikel: stolz-bei-kindern
  titel: Wo die Grenze wirklich verläuft
  heikel: false
  text: |
    Es gibt einen Punkt, an dem eingegriffen gehört, und er ist enger, als die
    meisten Ermahnungen ihn ziehen.

    Nicht: Ein Kind freut sich laut über etwas.

    Sondern: Ein Kind macht jemand anderen dafür klein.

    Das erste ist Stolz und darf sein. Das zweite ist etwas anderes, und dort
    gehört ein Satz hin.

- id: einsamkeit-bei-kindern-01
  artikel: einsamkeit-bei-kindern
  titel: Alleinsein ist ein Zustand, Einsamkeit ein Gefühl
  heikel: false
  text: |
    Sie kommen oft zusammen vor und sind nicht dasselbe.

    Manche Kinder sind viel allein und dabei zufrieden. Sie bauen, lesen,
    spielen für sich. Diese Kinder haben kein Problem. Sie haben Eltern, die
    sich Sorgen machen.

    Andere sind ständig von Kindern umgeben und trotzdem einsam, weil sie
    nirgends wirklich dazugehören. Sie fallen nicht auf, weil die Zahl der
    Kontakte stimmt.

    Entscheidend ist nicht, wie voll der Kalender ist, sondern wie dein Kind es
    erlebt.

- id: einsamkeit-bei-kindern-02
  artikel: einsamkeit-bei-kindern
  titel: Die aufschlussreichste Frage
  heikel: false
  text: |
    Bevor du etwas organisierst: Was passiert, wenn du zu einer Gruppe dazugehen
    willst?

    Es macht einen großen Unterschied, ob ein Kind sich nicht traut, ob es
    dazugeht und übersehen wird, oder ob es dazugeht und weggeschickt wird.

    Drei völlig verschiedene Lagen, die drei verschiedene Antworten brauchen.

    Die dritte wird häufig falsch behandelt. Ein Kind, das systematisch
    ausgeschlossen wird, hat kein Defizit an sozialen Fähigkeiten, das man
    beheben könnte. Es hat ein Gruppenproblem, und das ist Sache der
    Erwachsenen.

- id: einsamkeit-bei-kindern-03
  artikel: einsamkeit-bei-kindern
  titel: Ein Freund reicht
  heikel: false
  text: |
    Für das Wohlbefinden eines Kindes zählt nicht, wie beliebt es ist. Es zählt,
    ob es mindestens eine verlässliche Freundschaft hat.

    Beliebtheit und Freundschaft sind zwei getrennte Dinge. Ein Kind kann in der
    Klasse unauffällig sein und einen besten Freund haben, und es geht ihm gut.
    Ein anderes kann viele Kontakte haben und niemanden, dem es etwas erzählt.

    Das Ziel ist deshalb nicht, dass dein Kind dazugehört. Das Ziel ist ein
    Mensch.

- id: einsamkeit-bei-kindern-04
  artikel: einsamkeit-bei-kindern
  titel: Warum mehr Verabredungen nicht helfen
  heikel: false
  text: |
    Freundschaft entsteht nicht aus Menge, sondern aus Wiederholung. Zwei Kinder
    werden Freunde, weil sie sich oft sehen, dieselben Dinge tun und einander
    vertraut werden.

    Deshalb bringt eine wöchentliche Gruppe mit immer denselben Kindern
    meistens mehr als zehn einzelne Nachmittage mit zehn verschiedenen Kindern.

    Die schmale Lösung ist oft die richtige: ein Kind, ein Nachmittag, immer
    wieder.
