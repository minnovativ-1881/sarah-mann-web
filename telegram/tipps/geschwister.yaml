# Silo: Geschwister unter einem Dach

- id: geschwisterstreit-was-tun-01
  artikel: geschwisterstreit-was-tun
  titel: Die Zwei-Minuten-Regel
  heikel: false
  text: |
    Wenn es losgeht und keine Gefahr besteht: Warte zwei Minuten, bevor du etwas
    tust. Nicht weggehen, nicht ignorieren. Nur nicht sofort eingreifen.

    In dieser Zeit passiert erstaunlich oft eines von drei Dingen. Der Streit
    verpufft. Einer macht einen Vorschlag. Oder beide kommen von selbst und
    wollen eine Lösung statt ein Urteil.

    Erst wenn nach zwei Minuten nichts davon passiert ist, wird es deine Sache.

- id: geschwisterstreit-was-tun-02
  artikel: geschwisterstreit-was-tun
  titel: Such nicht, wer angefangen hat
  heikel: false
  text: |
    Der häufigste Fehler bei Geschwisterstreit ist gut gemeint. Er führt fast
    nie zu etwas.

    Die beiden Versionen stimmen nie überein. Das Kind, das gewinnt, lernt, dass
    sich Anklagen lohnt. Das Kind, das verliert, lernt, dass es hier keine
    Gerechtigkeit gibt. Beides macht den nächsten Streit wahrscheinlicher.

    Übersetzen statt urteilen: „Du willst den blauen Becher. Und du willst ihn
    auch.“ Dann: „Es gibt einen Becher und zwei Kinder. Was machen wir da?“ Und
    dann warten. Länger, als es angenehm ist.
