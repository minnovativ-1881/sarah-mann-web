# Silo: Geschwister unter einem Dach

- id: geschwisterstreit-was-tun-01
  artikel: geschwisterstreit-was-tun
  titel: Die Zwei-Minuten-Regel
  heikel: false
  text: |
    Wenn es losgeht und keine Gefahr besteht: Warte zwei Minuten, bevor du etwas
    tust. Nicht weggehen, nicht ignorieren. Nur nicht sofort eingreifen.

    In dieser Zeit passiert erstaunlich oft eines von drei Dingen. Der Streit
    verpufft. Einer macht einen Vorschlag. Oder beide kommen von selbst und
    wollen eine Lösung statt ein Urteil.

    Erst wenn nach zwei Minuten nichts davon passiert ist, wird es deine Sache.

- id: geschwisterstreit-was-tun-02
  artikel: geschwisterstreit-was-tun
  titel: Such nicht, wer angefangen hat
  heikel: false
  text: |
    Der häufigste Fehler bei Geschwisterstreit ist gut gemeint. Er führt fast
    nie zu etwas.

    Die beiden Versionen stimmen nie überein. Das Kind, das gewinnt, lernt, dass
    sich Anklagen lohnt. Das Kind, das verliert, lernt, dass es hier keine
    Gerechtigkeit gibt. Beides macht den nächsten Streit wahrscheinlicher.

    Übersetzen statt urteilen: „Du willst den blauen Becher. Und du willst ihn
    auch.“ Dann: „Es gibt einen Becher und zwei Kinder. Was machen wir da?“ Und
    dann warten. Länger, als es angenehm ist.

- id: geschwisterstreit-was-tun-03
  artikel: geschwisterstreit-was-tun
  titel: Mehrmals pro Stunde, nicht pro Tag
  heikel: false
  text: |
    In Beobachtungsstudien kommen Geschwister im Kindergartenalter auf mehrere
    Konflikte pro Stunde gemeinsam verbrachter Zeit.

    Nicht pro Tag. Pro Stunde.

    Wenn es sich bei euch anfühlt, als wäre dauernd Streit, liegt das nicht
    daran, dass etwas schiefläuft. Es liegt daran, dass dauernd Streit ist. Bei
    allen.

    Die meisten dieser Konflikte dauern weniger als eine Minute und enden ohne
    Erwachsene.

- id: geschwisterstreit-was-tun-04
  artikel: geschwisterstreit-was-tun
  titel: Streit oder Übergriff?
  heikel: false
  text: |
    Die Grenze verläuft nicht bei der Lautstärke.

    Streit: Beide argumentieren, die Kräfte sind etwa gleich verteilt, es geht
    um eine Sache, danach spielen sie weiter, beide erzählen hinterher eine
    Version.

    Übergriff: Eines fügt sich, jedes Mal. Ein deutlicher Kräfteunterschied wird
    ausgenutzt. Es geht um die Person statt um die Sache. Eines zieht sich
    zurück. Eines erzählt gar nichts mehr.

    Streit ist das Lernfeld. Übergriffe sind es nicht, und dort gehört eine
    erwachsene Person hinein, sofort und ohne Diskussion.

- id: eifersucht-auf-das-baby-01
  artikel: eifersucht-auf-das-baby
  titel: Das ist kein Rückfall, das ist eine Frage
  heikel: false
  text: |
    Ein Kind, das seit einem Jahr trocken ist, macht wieder in die Hose. Eines,
    das flüssig spricht, redet plötzlich in Babysprache.

    Stell dir vor, du machst seit drei Jahren Fortschritte, und jeder davon
    wurde gefeiert. Größerwerden lohnt sich, das ist die Botschaft.

    Und dann kommt jemand ins Haus, der nichts davon kann und die meiste
    Aufmerksamkeit bekommt.

    Ein dreijähriges Kind kann daraus nur einen logischen Schluss ziehen:
    Offenbar habe ich mich in die falsche Richtung entwickelt.

    Der Rückschritt ist der Versuch, die Richtung zu korrigieren.

- id: eifersucht-auf-das-baby-02
  artikel: eifersucht-auf-das-baby
  titel: Warum „du bist doch schon groß“ das Falsche ist
  heikel: false
  text: |
    Aus der Sicht des Kindes bestätigt jeder dieser Sätze die schlechte
    Nachricht: Großsein bringt nichts außer Erwartungen. Kleinsein bringt Nähe.

    Was stattdessen wirkt, ist die Antwort auf die eigentliche Frage. Und die
    lautet nicht „Du bist groß“, sondern: Du gehörst weiterhin dazu, und zwar
    unabhängig davon, was du kannst.

- id: eifersucht-auf-das-baby-03
  artikel: eifersucht-auf-das-baby
  titel: Zehn Minuten, die nicht gestrichen werden dürfen
  heikel: false
  text: |
    Zehn Minuten am Tag, in denen das große Kind dich allein hat. Ohne Baby im
    Arm, ohne Handy, ohne nebenbei aufräumen. Das Kind bestimmt, was gemacht
    wird.

    Vier Dinge entscheiden, ob es wirkt. Jeden Tag, auch an schlechten. Das Kind
    bestimmt den Inhalt. Es hat einen Namen und eine feste Zeit.

    Und der wichtigste Punkt: Es wird nicht entzogen, auch nicht als Konsequenz.

    Wenn diese Zeit gestrichen werden kann, ist sie keine Sicherheit mehr,
    sondern eine Belohnung. Und dann trägt sie nicht.

- id: eifersucht-auf-das-baby-04
  artikel: eifersucht-auf-das-baby
  titel: „Das Baby braucht mich“
  heikel: false
  text: |
    Diesen Satz sagen viele Eltern oft, ohne ihn zu bemerken. Er stimmt. Und er
    richtet trotzdem etwas an, wenn er zu oft fällt.

    Das Kind hört: Das Baby steht zwischen uns.

    Es hilft, die Verantwortung dorthin zu legen, wo sie hingehört: „Ich brauche
    noch fünf Minuten, dann bin ich bei dir.“

    Der Unterschied ist klein und im Ergebnis groß. Im ersten Satz ist das Baby
    der Grund. Im zweiten bist du es.

- id: gerechtigkeit-unter-geschwistern-01
  artikel: gerechtigkeit-unter-geschwistern
  titel: „Sie hat mehr bekommen“
  heikel: false
  text: |
    Dieser Satz kommt zuverlässig, egal wie sorgfältig abgemessen wurde. Bei
    zwei Kindern und bei sieben.

    Viele Eltern reagieren mit noch genauerem Abmessen. Und es funktioniert
    nicht, weil die Frage keine Frage nach Mengen ist.

    Dahinter steht: Bin ich hier genauso wichtig?

    Diese Frage lässt sich mit Kuchen nicht beantworten. Man kann sie mit Kuchen
    nur ablenken, und zwar für ungefähr vier Minuten.

- id: gerechtigkeit-unter-geschwistern-02
  artikel: gerechtigkeit-unter-geschwistern
  titel: Zwei Sätze, kein dritter
  heikel: false
  text: |
    „Du hättest das auch gern. Das verstehe ich.“

    Und dann nichts mehr. Keine Begründung, warum das andere Kind es bekommen
    hat. Keine Aufzählung, was dieses Kind letzte Woche bekommen hat.

    Der Grund ist einfach: Sobald du dich rechtfertigst, hast du die Rechnung
    eröffnet. Und in einer Rechnung findet ein Kind immer einen Posten, der auf
    seiner Seite fehlt.

    Es gibt keine Aufstellung, die ein Kind zufriedenstellt, weil es nicht um die
    Aufstellung geht.

- id: gerechtigkeit-unter-geschwistern-03
  artikel: gerechtigkeit-unter-geschwistern
  titel: Der Satz, der Rollen festschreibt
  heikel: false
  text: |
    „Der ist eben der Wilde.“ „Sie ist unsere Sensible.“ „Das ist der
    Vernünftige.“

    Das sind keine Beschreibungen, das sind Zuweisungen. Und Kinder übernehmen
    sie, weil sie von den wichtigsten Menschen ihres Lebens kommen.

    Der Wilde wird wilder. Die Sensible traut sich weniger zu. Und der
    Vernünftige hört auf zu sagen, wenn es ihm schlecht geht, weil das nicht zu
    seiner Rolle passt.

    Der Ausweg ist eine Formulierung, die dieselbe Beobachtung enthält, ohne die
    Person festzulegen. Nicht „du bist“, sondern „gerade ist“.

- id: gerechtigkeit-unter-geschwistern-04
  artikel: gerechtigkeit-unter-geschwistern
  titel: Wo Gleichheit trotzdem richtig ist
  heikel: false
  text: |
    Ein Kind, das eine Brille braucht, bekommt eine Brille. Das Geschwisterkind
    bekommt keinen Ausgleich dafür, dass es gut sieht. Das leuchtet allen sofort
    ein.

    Genauso ist es mit Zeit, Nähe, Geduld und Unterstützung.

    Drei Bereiche bleiben davon ausgenommen. Bei Anlässen wie Weihnachten und
    Geburtstag hilft grobe Gleichheit, weil der Anlass symbolisch ist. Bei
    Regeln: Was für das eine Kind gilt, gilt für das andere im selben Alter
    genauso. Und beim Zuhören: Jedes Kind darf seine Version bis zum Ende
    erzählen.

- id: geschwister-teilen-lernen-01
  artikel: geschwister-teilen-lernen
  titel: Warum „jetzt teil doch mal“ das Gegenteil bewirkt
  heikel: false
  text: |
    Setz dich in die Lage des größeren Kindes. Du hast etwas, du bist mittendrin,
    du hast eine Idee, was du damit machen willst.

    Dann kommt jemand, der lauter ist als du, und ein Erwachsener nimmt dir die
    Sache weg und gibt sie ihm.

    Aus deiner Sicht ist das kein Akt der Großzügigkeit. Es ist eine Enteignung,
    begründet damit, dass du älter bist oder dass der andere weint.

    Was du daraus lernst, ist nicht Teilen. Es ist: Was ich habe, kann mir
    jederzeit genommen werden. Und die vernünftige Reaktion darauf heißt
    festhalten.

- id: geschwister-teilen-lernen-02
  artikel: geschwister-teilen-lernen
  titel: Was Teilen voraussetzt
  heikel: false
  text: |
    Es sieht einfach aus und ist entwicklungspsychologisch anspruchsvoll.

    Ein Kind muss verstehen, dass die Sache zurückkommt. Solange Weggeben gleich
    Weg ist, ist Teilen ein Verlust.

    Und es muss begreifen, dass der andere gerade dasselbe fühlt wie es selbst.
    Diese Fähigkeit entwickelt sich schrittweise und ist frühestens im
    Vorschulalter halbwegs verlässlich.

    Von einem Zweijährigen Teilen zu verlangen ist deshalb ungefähr so sinnvoll,
    wie von ihm zu verlangen, die Uhr zu lesen.

- id: aeltestes-kind-verantwortung-01
  artikel: aeltestes-kind-verantwortung
  titel: „Du bist doch die Große“
  heikel: false
  text: |
    Der Satz rutscht in vielen Familien mehrmals täglich heraus, und er klingt
    harmlos.

    Gemeint ist meistens: Sei bitte gerade vernünftig, ich schaffe es nicht
    anders.

    Gehört wird etwas anderes: Deine Bedürfnisse zählen weniger, weil du früher
    geboren bist.

    Er wirkt sofort, und zwar zuverlässiger als jede Erklärung. Das liegt daran,
    dass er nicht widerlegt werden kann. Ein Kind kann diskutieren, ob eine
    Regel sinnvoll ist. Es kann nicht diskutieren, ob es älter ist.

- id: aeltestes-kind-verantwortung-02
  artikel: aeltestes-kind-verantwortung
  titel: Für Aufgaben, nicht für Menschen
  heikel: false
  text: |
    Verantwortung ist nichts Schlechtes. Kinder wachsen daran.

    Der Unterschied liegt an drei Stellen. Verantwortung, die stärkt, bezieht
    sich auf eine Sache, hat einen Anfang und ein Ende und darf misslingen.

    Verantwortung, die belastet, bezieht sich auf einen Menschen, gilt immer und
    muss klappen.

    Den Tisch zu decken ist eine Sache. Dafür zu sorgen, dass die kleine
    Schwester nicht vom Klettergerüst fällt, ist ein Mensch. Das erste stärkt,
    das zweite ist eine Aufgabe für Erwachsene.

- id: aeltestes-kind-verantwortung-03
  artikel: aeltestes-kind-verantwortung
  titel: Vier Zeichen, dass es zu viel ist
  heikel: false
  text: |
    Kinder, die zu viel tragen, beschweren sich selten. Sie funktionieren, und
    das ist gerade das Problem.

    Es meldet nichts mehr an. Eigene Wünsche kommen nicht mehr vor, oder nur
    noch entschuldigend.

    Es haftet für die Geschwister. Wenn das kleine Kind etwas anstellt, reagiert
    es, als hätte es selbst versagt.

    Es wirkt älter, als es ist. Erwachsene loben das gern. Es ist aber kein
    Kompliment.

    Und es entspannt sich sichtbar, sobald es allein mit dir ist.

- id: aeltestes-kind-verantwortung-04
  artikel: aeltestes-kind-verantwortung
  titel: Was du stattdessen sagst
  heikel: false
  text: |
    Der Ersatz ist kein netterer Satz, sondern ein anderer Aufbau. Die Zumutung
    wird mit der Sache begründet, nicht mit dem Alter, und sie bekommt eine
    Grenze.

    Nicht „Du bist die Große, lass ihn doch“, sondern „Ich brauche zwei Minuten
    für ihn. Danach bin ich bei dir.“

    Nicht „Du kannst das schon allein“, sondern „Ich schaffe gerade nur eins.
    Willst du warten oder erst mal ohne mich anfangen?“

    Im ersten Fall zahlt das Alter. Im zweiten die Lage, und die ist
    vorübergehend.

- id: mittelkind-01
  artikel: mittelkind
  titel: Das Mittelkind hat kein Syndrom
  heikel: false
  text: |
    Die Vorstellung, dass die Geburtsreihenfolge den Charakter formt, ist alt und
    populär. Große Untersuchungen mit mehreren zehntausend Personen haben sie
    gründlich geprüft.

    Die gefundenen Zusammenhänge sind so klein, dass sie im Einzelfall nichts
    vorhersagen. Ein Mittelkind ist nicht messbar diplomatischer und nicht
    messbar unzufriedener als ein Erstgeborenes.

    Wer sein Kind anhand seiner Position beschreibt, beschreibt nicht sein Kind.
    Er beschreibt eine Erwartung.

- id: mittelkind-02
  artikel: mittelkind
  titel: Zwei Lücken, keine Charakterfrage
  heikel: false
  text: |
    Und doch berichten viele Mittelkinder etwas Ähnliches. Die Gründe liegen
    nicht im Charakter, sondern in der Struktur.

    Es gab nie eine Zeit allein. Das erste Kind hatte die Eltern für sich, bis
    das zweite kam. Das letzte bekommt sie wieder, wenn die Größeren in Schule
    und Freundeskreis wandern. Das Kind in der Mitte hat diese Erfahrung nie
    gemacht.

    Und es gibt keine geerbte Rolle. Das erste ist das Große, das letzte das
    Kleine. In der Mitte ist die Stelle in der Familienerzählung schlicht leer.

    Beides sind Lücken, und Lücken kann man füllen.

- id: mittelkind-03
  artikel: mittelkind
  titel: Eine Zeit, die einen Namen hat
  heikel: false
  text: |
    Die fehlende Zeit allein lässt sich nachholen, nur eben nicht am Stück.

    Was wirkt: eine feste, wiederkehrende Zeit mit einem Elternteil. Kurz und
    verlässlich, zwanzig Minuten pro Woche. Das Kind bestimmt den Inhalt.

    Was kaum wirkt: ein großer Ausflug einmal im Jahr.

    Und ein unterschätzter Punkt: Wenn diese Zeit einen Namen hat und in der
    Familie bekannt ist, wird sie zu einem Besitz. Das Kind kann sich darauf
    freuen, und es kann sich darauf berufen.

- id: mittelkind-04
  artikel: mittelkind
  titel: Es braucht keinen Titel, sondern einen Ort
  heikel: false
  text: |
    Eine Rolle entsteht nicht dadurch, dass man sie zuweist. „Du bist unsere
    Diplomatin“ ist gut gemeint und verteilt wieder ein Etikett.

    Was wirkt, ist etwas Eigenes. Ein Instrument, ein Sport, ein Interesse, das
    keines der Geschwister hat. Eine Aufgabe im Haushalt, die nur diesem Kind
    gehört und die tatsächlich gebraucht wird.

    Das Kind braucht keinen Titel. Es braucht einen Ort, an dem es
    unverwechselbar ist.

- id: wenn-eines-mehr-braucht-01
  artikel: wenn-eines-mehr-braucht
  titel: Mehr Begleitung, nicht mehr Erziehung
  heikel: false
  text: |
    In fast jeder Familie mit mehreren Kindern gibt es eines, das mehr Kraft
    kostet.

    Der häufigste Denkfehler ist, den Bedarf für einen Charakterzug zu halten.
    Er ist keiner.

    Kinder unterscheiden sich von Geburt an darin, wie schnell sie in Aufregung
    geraten, wie stark diese ausfällt und wie lange sie braucht, bis sie
    abklingt. Das ist Temperament, und es ist zu einem großen Teil mitgebracht.

    Ein Kind mit kurzer Zündschnur und langem Nachhall braucht mehr erwachsene
    Begleitung, um sich zu regulieren. Nicht mehr Erziehung.

- id: wenn-eines-mehr-braucht-02
  artikel: wenn-eines-mehr-braucht
  titel: Das Kind, über das nie gesprochen wird
  heikel: false
  text: |
    Daneben sitzt oft eines, das mitbekommt, dass Ansprüche gerade schwer
    unterzubringen sind. Und das deshalb aufhört, welche zu stellen.

    Von außen sieht das gut aus. Es ist pflegeleicht, kommt allein zurecht,
    macht keine Umstände.

    Manchmal ist das echte Selbstständigkeit. Manchmal ist es Anpassung.

    Der Unterschied zeigt sich an Kleinigkeiten. Echte Selbstständigkeit holt
    sich Hilfe, wenn sie welche braucht, und erzählt auch Unangenehmes.
    Anpassung versucht alles allein und erzählt nur, was gut lief.

- id: wenn-eines-mehr-braucht-03
  artikel: wenn-eines-mehr-braucht
  titel: Benennen, ohne das Kind zum Problem zu machen
  heikel: false
  text: |
    Manchmal braucht ein Kind über Monate mehr, weil es krank ist oder eine
    schwere Zeit hat. Und die anderen merken es.

    Es zu verstecken hilft nicht. Kinder merken es ohnehin, und was sie sich
    ohne Erklärung zusammenreimen, ist meist schlimmer als die Wahrheit.

    Was hilft, ist ein Satz, der die Lage benennt: „Bei deinem Bruder ist gerade
    viel los, und ich bin oft bei ihm. Das ist für dich blöd. Deine Zeit mit mir
    bleibt trotzdem, jeden Tag.“

    Und dann muss diese Zeit auch tatsächlich bleiben. Genau daran entscheidet
    sich, ob der Satz etwas wert war.

- id: geschwister-schlichten-oder-nicht-01
  artikel: geschwister-schlichten-oder-nicht
  titel: Vier Fragen in wenigen Sekunden
  heikel: false
  text: |
    Ist jemand in Gefahr? Dann wird sofort getrennt. Ohne Erklärung im Moment,
    ohne Schuldfrage.

    Sind die Kräfte etwa gleich? Ein Streit zwischen einem Achtjährigen und
    einem Dreijährigen ist keiner. Bei Ungleichgewicht gehörst du hinein, auch
    wenn es harmlos aussieht.

    Geht es um eine Sache oder um die Person? „Gib das her“ ist ein Streit. „Du
    bist zu blöd dafür“ ist ein Angriff.

    Und wenn nichts davon zutrifft: Gib zwei Minuten.

- id: geschwister-schlichten-oder-nicht-02
  artikel: geschwister-schlichten-oder-nicht
  titel: Eine Ausbildung im Anklagen
  heikel: false
  text: |
    Wer regelmäßig herausfindet, wer angefangen hat, züchtet einen Wettbewerb
    darum, wer zuerst und überzeugender klagt.

    Die Versionen stimmen nie überein, und beide Kinder erzählen
    wahrheitsgemäß, was sie erlebt haben. Der Anfang liegt fast immer weiter
    zurück, als beide zugeben.

    Und das Kind, dem geglaubt wird, lernt, dass Anklagen sich lohnt.

    Deshalb ist es klüger, die Schuldfrage zu überspringen. Nicht aus
    Bequemlichkeit, sondern weil sie nichts löst.

- id: geschwister-schlichten-oder-nicht-03
  artikel: geschwister-schlichten-oder-nicht
  titel: Hilfe holen oder anschwärzen?
  heikel: false
  text: |
    Petzen macht Eltern wahnsinnig, und es lohnt sich, zwei Sorten zu
    unterscheiden.

    Hilfe holen: Jemand ist in Gefahr oder verletzt, das Kind will, dass etwas
    aufhört, es erzählt, was passiert ist. Die Antwort darauf: Danke, dass du
    mir das sagst.

    Anschwärzen: Niemandem ist etwas passiert, das Kind will, dass der andere
    Ärger bekommt, es erzählt, wer schuld ist. Die Antwort darauf: Was brauchst
    du gerade?

    Diese Rückfrage nimmt dem Anschwärzen die Wirkung, ohne das Kind abzuweisen.
    Häufig kommt darauf ein überraschend ehrliches „Ich will auch mitspielen“.

- id: geschwister-schlichten-oder-nicht-04
  artikel: geschwister-schlichten-oder-nicht
  titel: Warum Sammelstrafen schaden
  heikel: true
  freigegeben: true
  text: |
    „Dann geht ihr eben beide auf euer Zimmer.“ Der Satz ist verständlich, wenn
    man erschöpft ist, und er richtet etwas an.

    Ein Kind, das nichts getan hat und trotzdem bestraft wird, lernt eine sehr
    klare Lektion: Gerechtigkeit gibt es hier nicht. Und wenn es ohnehin egal
    ist, kann man beim nächsten Mal auch gleich richtig mitmachen.

    Was stattdessen geht: die Situation beenden, ohne jemanden zu verurteilen.
    Der strittige Gegenstand macht eine Pause. Die Kinder werden räumlich
    getrennt, ohne dass das eine Strafe ist.
